<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora Limited — Construction Site Management System</title>
  <meta name="description" content="Nexora Limited construction site management: masters, budgets, contracts & LPOs, expenses, profitability reports — Google Sheets backend." />
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
  <div id="app-root"></div>
  <noscript>
    <div style="padding:40px;font-family:sans-serif">
      <h2>JavaScript is required</h2>
      <p>Please enable JavaScript in your browser to run the Nexora Construction Site Management System.</p>
    </div>
  </noscript>

  <!-- Chart.js (CDN) — reports fall back to CSS bars when offline -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <script src="config.js"></script>
  <script src="js/format.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/components.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/reports-core.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/masters.js"></script>
  <script src="js/pages/budget.js"></script>
  <script src="js/pages/contract.js"></script>
  <script src="js/pages/expenses.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/audit.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      window.App.boot().catch(err => {
        console.error(err);
        document.getElementById("app-root").innerHTML =
          '<div style="padding:60px 20px;text-align:center;font-family:Inter,sans-serif"><h2>Failed to start</h2><p>' +
          String(err && err.message || err) + '</p></div>';
      });
    });
  </script>
</body>
</html>
