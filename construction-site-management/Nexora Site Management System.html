        btn.disabled = false;
        if (res.ok) {
          host.innerHTML = `<div class="notice info">${UI.icon("check", 15)} Connected in ${res.ms} ms — backend version ${F.esc(String((res.data && res.data.version) || "?"))}. You are now in LIVE mode.</div>`;
          await api.refreshAll(false);
          render(container);
          UI.toast("Google Sheets backend connected!", "success");
        } else {
          host.innerHTML = `<div class="notice warn">${UI.icon("warn", 15)} ${F.esc(res.error && res.error.message || "Connection failed")}</div>`;
        }
      } else if (act === "openurl") {
        const url = (container.querySelector("#set-url").value || "").trim() || store.apiUrl;
        if (!url) { UI.toast("Paste the Web App URL first.", "error"); return; }
        window.open(url, "_blank", "noopener");
        UI.toast("A browser tab should have opened. You must see “backend is ONLINE” with no Google sign-in.", "info", { ms: 7000 });
      } else if (act === "disconnect") {
        api.setApiUrl("");
        UI.toast("Disconnected — switched to demo mode.", "success");
        render(container);
      } else if (act === "synctest") {
        const res = await api.call("selftest", {});
        const host = container.querySelector("#conn-result");
        if (res && res.ok && res.data && res.data.results) {
          host.innerHTML = `<div class="notice info">${res.data.results.map(r =>
            `<div>${r.pass ? "✅" : "❌"} ${F.esc(r.name)}${r.error ? " — " + F.esc(r.error) : ""}</div>`).join("")}</div>`;
        } else {
          host.innerHTML = `<div class="notice warn">Self-test not available ${store.mode === "live" ? "on this backend version" : "in demo mode"}: ${F.esc((res && res.error && res.error.message) || "")}</div>`;
        }
      } else if (act === "savecompany") {
        const data = CMP.formData(container.querySelector(".settings-grid"));
        if (!String(data.companyName).trim()) { CMP.fieldError("companyName", "Required"); return; }
        if (F.num(data.pollInterval) < 15) { CMP.fieldError("pollInterval", "Minimum 15 seconds"); return; }
        const res = await api.call("saveSettings", { settings: data });
        if (res && res.ok) {
          store.settings = Object.assign({}, store.settings, res.data.settings || {});
          UI.toast("Company settings saved.", "success");
          render(container);
        }
      } else if (act === "changepin") {
        const oldPin = container.querySelector('[name="oldPin"]').value;
        const newPin = container.querySelector('[name="newPin"]').value;
        if (!oldPin || !newPin) { UI.toast("Enter both current and new PIN.", "error"); return; }
        const res = await api.call("changePin", { id: store.user ? store.user.id : "", oldPin, newPin });
        if (res && res.ok) {
          UI.toast("PIN changed.", "success");
          render(container);
        }
      } else if (act === "backup") {
        F.exportJSON(`nexora-backup-${F.todayISO()}.json`, {
          app: "Nexora Construction Site Management", exportedAt: F.nowStamp(),
          settings: store.settings, users: store.users, masters: store.masters,
          budget: store.budget, contracts: store.contracts, expenses: store.expenses, audit: store.audit,
        });
        UI.toast("Backup downloaded.", "success");
      } else if (act === "resetdemo") {
        const ok = await UI.confirmDialog({ danger: true, title: "Reset demo data?", message: "The sample database will be restored to its original state. This only affects demo mode in this browser.", okLabel: "Reset" });
        if (ok) {
          await api.call("resetDemo", {});
          await api.refreshAll(false);
          UI.toast("Demo data reset.", "success");
          location.hash = "#/dashboard";
          root.App.enter();
        }
      } else if (act === "exportall") {
        exportAll();
      } else if (act === "home") location.hash = "#/dashboard";
      else if (act === "back") history.back();
    });

    renderUsers(container);
  }

  function renderUsers(container) {
    const store = root.API.store;
    const host = container.querySelector("#users-host");
    host.innerHTML = "";
    const canUsers = root.App.can("users");
    const table = CMP.dataTable({
      columns: [
        { key: "name", label: "Name", render: r => `<div class="who"><div class="av sm">${F.initials(r.name)}</div><b>${F.esc(r.name)}</b></div>` },
        { key: "role", label: "Role", render: r => UI.pill(r.role) },
        { key: "active", label: "Status", render: r => UI.pill(r.active === "YES" ? "Active" : "Inactive") },
        { key: "createdAt", label: "Created", render: r => F.fmtDateTime(r.createdAt) },
      ],
      rows: store.users || [],
      search: false,
      onAction: (act, row) => {
        if (act === "edit") openUserForm(container, row);
        else if (act === "delete") deleteUser(container, row);
      },
      actions: [
        { act: "edit", icon: "edit", title: "Edit", show: () => canUsers },
        { act: "delete", icon: "trash", title: "Delete", danger: true, show: () => canUsers },
      ],
    });
    host.appendChild(table.wrap);
    if (canUsers) {
      const addBtn = document.createElement("button");
      addBtn.className = "btn btn-soft";
      addBtn.style.marginTop = "12px";
      addBtn.innerHTML = UI.icon("plus", 15) + " Add User";
      addBtn.addEventListener("click", () => openUserForm(container, null));
      host.appendChild(addBtn);
    }
  }

  function openUserForm(container, row) {
    const isEdit = !!row;
    const d = row || { role: "Clerk", active: "YES" };
    UI.openModal(`
      <div class="form-grid">
        ${CMP.field("Full Name", CMP.textInput("name", d.name, { required: true }), { required: true, span: 2 })}
        ${CMP.field("Role", `<select class="input" name="role"><option>Admin</option><option>Supervisor</option><option>Clerk</option></select>`)}
        ${CMP.field("PIN", CMP.textInput("pin", "", { type: "password", placeholder: isEdit ? "Leave blank to keep current PIN" : "Min 4 digits" }))}
        ${CMP.field("Status", `<select class="input" name="active"><option value="YES">Active</option><option value="NO">Inactive</option></select>`)}
      </div>
      <div class="notice info">${UI.icon("info", 15)} <b>Admin</b> — full access incl. settings &amp; overrides · <b>Supervisor</b> — everything except settings/users · <b>Clerk</b> — create entries &amp; view reports only.</div>
    `, {
      title: `${isEdit ? "Edit" : "Add"} User`,
      footer: `${UI.BTN.cancel} ${UI.BTN.save}`,
    });
    const modal = UI.modalEl();
    const form = modal.querySelector(".form-grid");
    CMP.setFormData(form, d);
    UI.attachActions(modal, async act => {
      if (act === "cancel") UI.closeModal();
      else if (act === "save") {
        const data = CMP.formData(form);
        data.name = String(data.name || "").trim();
        if (!data.name) { CMP.fieldError("name", "Required"); return; }
        if (!isEdit && !String(data.pin || "").trim()) { CMP.fieldError("pin", "PIN required for new users"); return; }
        if (!isEdit && String(data.pin).length < 4) { CMP.fieldError("pin", "At least 4 characters"); return; }
        if (isEdit && !data.pin) data.pin = row.pin;
        const res = await root.API.call("saveUser", { id: isEdit ? row.id : null, data });
        if (res && res.ok) {
          root.API.store.users = res.data.rows || [];
          UI.toast("User saved.", "success");
          UI.closeModal();
          render(container);
        } else if (res && res.error) {
          if (res.error.field) CMP.fieldError(res.error.field, res.error.message);
          else UI.toast(res.error.message, "error", { ms: 7000 });
        }
      }
    });
  }

  async function deleteUser(container, row) {
    const ok = await UI.confirmDialog({ danger: true, title: `Delete user?`, message: `“${row.name}” will no longer be able to sign in.`, okLabel: "Delete" });
    if (!ok) return;
    const res = await root.API.call("deleteUser", { id: row.id });
    if (res && res.ok) {
      root.API.store.users = res.data.rows || [];
      UI.toast("User deleted.", "success");
      render(container);
    } else if (res && res.error) UI.toast(res.error.message, "error", { ms: 7000 });
  }

  function exportAll() {
    const store = root.API.store;
    const zip = [];
    const push = (name, cols, rows) => {
      zip.push(`### ${name} ###\r\n` + F.toCSV(cols, rows) + "\r\n");
    };
    push("Projects", [{ key: "id", label: "ID" }, { key: "code", label: "Code" }, { key: "name", label: "Name" }, { key: "client", label: "Client" }, { key: "status", label: "Status" }], store.masters.Projects);
    push("Shops", [{ key: "id", label: "ID" }, { key: "name", label: "Name" }, { key: "location", label: "Location" }], store.masters.Shops);
    push("ExpenseHeads", [{ key: "id", label: "ID" }, { key: "name", label: "Name" }, { key: "category", label: "Category" }], store.masters.ExpenseHeads);
    push("Materials", [{ key: "id", label: "ID" }, { key: "name", label: "Name" }, { key: "category", label: "Category" }, { key: "unit", label: "Unit" }], store.masters.Materials);
    push("Units", [{ key: "id", label: "ID" }, { key: "name", label: "Name" }, { key: "abbrev", label: "Abbrev" }], store.masters.Units);
    push("Suppliers", [{ key: "id", label: "ID" }, { key: "name", label: "Name" }, { key: "phone", label: "Phone" }, { key: "tin", label: "TIN" }], store.masters.Suppliers);
    push("Customers", [{ key: "id", label: "ID" }, { key: "name", label: "Name" }, { key: "phone", label: "Phone" }, { key: "tin", label: "TIN" }], store.masters.Customers);
    push("Budget", [{ key: "id", label: "ID" }, { key: "projectId", label: "Project" }, { key: "materialId", label: "Material" }, { key: "qty", label: "Qty" }, { key: "rate", label: "Rate" }, { key: "amount", label: "Amount" }], store.budget);
    push("Contracts", [{ key: "id", label: "ID" }, { key: "type", label: "Type" }, { key: "refNo", label: "Ref" }, { key: "total", label: "Total" }], store.contracts);
    push("Expenses", [{ key: "id", label: "ID" }, { key: "date", label: "Date" }, { key: "invoiceNo", label: "Invoice" }, { key: "amount", label: "Amount" }], store.expenses);
    F.downloadFile(`nexora-export-${F.todayISO()}.csv`, zip.join(""), "text/csv;charset=utf-8");
    UI.toast("Full export downloaded.", "success");
  }

  root.Pages = root.Pages || {};
  root.Pages.settings = { render, title: "Settings" };
})(typeof window !== "undefined" ? window : globalThis);

</script>
  <script>
/* ===== js/app.js ===== */
/* ============================================================
   NEXORA CMS — application shell
   routing, sidebar, real-time sync loop, permissions, printing
   ============================================================ */
(function (root) {
  "use strict";

  const F = root.Fmt, UI = root.UI, api = root.API;

  const ROUTES = [
    { hash: "dashboard", page: "dashboard", icon: "home", label: "Dashboard" },
    { hash: "masters", page: "masters", icon: "grid", label: "Masters" },
    { hash: "budget", page: "budget", icon: "doc", label: "Budget" },
    { hash: "contracts", page: "contract", icon: "briefcase", label: "Contracts & LPO" },
    { hash: "expenses", page: "expenses", icon: "wallet", label: "Expenses" },
    { hash: "reports", page: "reports", icon: "chart", label: "Reports" },
    { hash: "audit", page: "audit", icon: "shield", label: "Audit Trail" },
    { hash: "settings", page: "settings", icon: "settings", label: "Settings" },
  ];

  const PERMS = {
    Admin: { settings: true, users: true, masters: true, edit: true, delete: true, create: true, override: true },
    Supervisor: { settings: false, users: false, masters: true, edit: true, delete: true, create: true, override: false },
    Clerk: { settings: false, users: false, masters: false, edit: false, delete: false, create: true, override: false },
  };

  function can(perm) {
    const role = api.store.user ? api.store.user.role : "Clerk";
    const p = PERMS[role] || PERMS.Clerk;
    return !!p[perm];
  }

  function buildShell() {
    const host = document.getElementById("app-root");
    if (!host) return;
    host.innerHTML = `
      <aside class="sidebar" id="sidebar">
        <div class="sb-brand">
          <div class="logo-badge">${UI.icon("building", 22)}</div>
          <div class="sb-brand-txt">
            <div class="sb-company">NEXORA</div>
            <div class="sb-tag">Site Management</div>
          </div>
        </div>
        <nav class="sb-nav">
          ${ROUTES.map(r => `<a class="sb-link" data-route="${r.hash}">${UI.icon(r.icon, 18)}<span>${r.label}</span></a>`).join("")}
        </nav>
        <div class="sb-foot">
          <div class="sb-user">
            <div class="av">${F.initials(api.store.user ? api.store.user.name : "?")}</div>
            <div class="sb-user-txt">
              <div class="sb-user-name">${F.esc(api.store.user ? api.store.user.name : "")}</div>
              <div class="sb-user-role">${F.esc(api.store.user ? api.store.user.role : "")}</div>
            </div>
            <button class="icon-btn" id="logout-btn" title="Sign out">${UI.icon("logout", 17)}</button>
          </div>
        </div>
      </aside>
      <div class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn">${UI.icon("menu", 20)}</button>
          <div class="topbar-sync" id="topbar-sync">
            <span class="sync-dot"></span><span class="sync-txt">Synced · ${api.store.mode === "live" ? "Google Sheets" : "Demo mode"}</span>
          </div>
          <div class="topbar-right">
            <span class="topbar-clock" id="topbar-clock"></span>
            <button class="btn btn-soft btn-sm" id="sync-now">${UI.icon("sync", 14)} Sync Now</button>
          </div>
        </header>
        <main class="content" id="content"></main>
      </div>
      <div class="sb-overlay" id="sb-overlay"></div>`;

    host.querySelectorAll(".sb-link").forEach(a => a.addEventListener("click", () => {
      location.hash = "#/" + a.dataset.route;
      closeSidebar();
    }));
    host.querySelector("#logout-btn").addEventListener("click", () => root.Auth.logout());
    host.querySelector("#sync-now").addEventListener("click", async () => {
      setSyncState("syncing");
      await api.refreshAll(false);
      setSyncState("synced");
      UI.toast("All data refreshed", "success");
      rerenderCurrent();
    });
    host.querySelector("#menu-btn").addEventListener("click", () => {
      document.body.classList.toggle("sb-open");
    });
    host.querySelector("#sb-overlay").addEventListener("click", closeSidebar);

    setInterval(() => {
      const el = document.getElementById("topbar-clock");
      if (el) el.textContent = new Date().toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }, 1000);
  }

  function closeSidebar() { document.body.classList.remove("sb-open"); }

  function setSyncState(mode) {
    const el = document.getElementById("topbar-sync");
    if (!el) return;
    el.className = "topbar-sync " + mode;
    const txt = el.querySelector(".sync-txt");
    if (!txt) return;
    if (mode === "syncing") txt.textContent = "Syncing…";
    else if (mode === "offline") txt.textContent = "Offline / not connected";
    else txt.textContent = `Synced · ${api.store.mode === "live" ? "Google Sheets" : "Demo mode"} · ${api.store.lastSync ? F.fmtDateTime(api.store.lastSync) : "—"}`;
  }

  /* ---------------- router ---------------- */
  function parseHash() {
    const h = (location.hash || "#/dashboard").replace(/^#\/?/, "");
    const qIdx = h.indexOf("?");
    const pathPart = qIdx >= 0 ? h.slice(0, qIdx) : h;
    const queryPart = qIdx >= 0 ? h.slice(qIdx + 1) : "";
    const parts = pathPart.split("/").filter(Boolean);
    const route = ROUTES.find(r => r.hash === parts[0]);
    return {
      page: route ? route.page : "dashboard",
      path: parts.slice(1),
      query: Object.fromEntries(new URLSearchParams(queryPart || "")),
    };
  }

  function enter() {
    buildShell();
    navigate();
    startSyncLoop();
  }

  function navigate() {
    if (!root.Auth.requireLogin()) return;
    const { page, path, query } = parseHash();
    const def = root.Pages[page];
    const container = document.getElementById("content");
    if (!def || !container) return;
    const params = {};
    if (query.new) params.new = true;
    if (query.type) params.type = query.type;
    if (path[0]) {
      if (page === "masters") params.sheet = path[0];
      if (page === "reports") params.key = path[0];
    }
    document.querySelectorAll(".sb-link").forEach(a => a.classList.toggle("on", "#/" + a.dataset.route === "#/" + (location.hash.replace(/^#\/?/, "").split(/[/?]/)[0])));
    container.innerHTML = "";
    try {
      def.render(container, params);
    } catch (e) {
      console.error(e);
      container.innerHTML = UI.emptyState("warn", "Something went wrong rendering this page", F.esc(String(e && e.message || e)));
    }
    window.scrollTo({ top: 0 });
  }

  function rerenderCurrent() {
    const { page } = parseHash();
    const container = document.getElementById("content");
    if (container) container.innerHTML = "";
    navigate();
  }

  /* ---------------- real-time sync loop ---------------- */
  let syncTimer = null;
  function startSyncLoop() {
    clearInterval(syncTimer);
    const secs = Math.max(15, F.num(api.store.settings.pollInterval) || 45);
    syncTimer = setInterval(syncTick, secs * 1000);
  }

  async function syncTick() {
    if (!api.store.user) return;
    if (api.store.mode === "live") {
      setSyncState("syncing");
      const v = await api.pollVersion();
      if (v == null) { setSyncState("offline"); return; }
      if (v !== api.store.version) {
        await api.refreshAll(false);
        UI.toast("New changes from another user detected — view refreshed.", "info");
        rerenderCurrent();
      } else {
        api.store.lastSync = F.nowStamp();
      }
      setSyncState("synced");
    } else {
      // demo mode: cross-tab sync via localStorage events
      setSyncState("synced");
    }
  }

  window.addEventListener("storage", e => {
    if (e.key === "nexora_cms_db_v1" && api.store.user) {
      try {
        const db = JSON.parse(e.newValue);
        if (db && db.version && db.version !== api.store.version) {
          api.refreshAll(false).then(() => {
            UI.toast("Changes made in another tab — data updated.", "info");
            rerenderCurrent();
          });
        }
      } catch (err) { /* ignore */ }
    }
  });

  /* ---------------- print infrastructure ---------------- */
  function buildPrintHTML(title, bodyHtml, filterNote) {
    const s = api.store.settings;
    const user = api.store.user ? api.store.user.name : "";
    return `
      <div class="print-doc">
        <div class="print-head">
          <div class="print-brand">
            <div class="print-logo">${UI.icon("building", 22)}</div>
            <div>
              <div class="print-company">${F.esc(s.companyName || "Nexora Limited")}</div>
              <div class="print-addr">${F.esc(s.companyAddress || "")}${s.companyPhone ? " · " + F.esc(s.companyPhone) : ""}${s.companyEmail ? " · " + F.esc(s.companyEmail) : ""}</div>
            </div>
          </div>
          <div class="print-meta">
            <div class="print-title">${F.esc(title)}</div>
            <div class="print-sub">${filterNote ? F.esc(filterNote) : ""} · Generated ${F.fmtDate(F.todayISO())} ${new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })} by ${F.esc(user)}</div>
          </div>
        </div>
        <div class="print-body">${bodyHtml}</div>
        <div class="print-foot">Nexora Limited · Construction Site Management System · This report is generated from live data in Google Sheets.</div>
      </div>`;
  }

  function printReport(title, bodyHtml, filterNote) {
    let rootEl = document.getElementById("print-root");
    if (!rootEl) {
      rootEl = document.createElement("div");
      rootEl.id = "print-root";
      document.body.appendChild(rootEl);
    }
    rootEl.innerHTML = buildPrintHTML(title, bodyHtml, filterNote);
    const before = () => { };
    const after = () => { rootEl.innerHTML = ""; };
    window.addEventListener("afterprint", after, { once: true });
    window.addEventListener("beforeprint", before, { once: true });
    setTimeout(() => window.print(), 80);
  }

  function printTable(cols, rows) {
    const esc = F.esc;
    return `<table class="ptable">
      <thead><tr>${cols.map(c => `<th class="${c.align === "right" ? "ar" : ""}">${esc(c.label)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr>${cols.map(c => {
        const v = c.render ? c.render(r) : r[c.key];
        return `<td class="${c.align === "right" ? "ar" : ""}">${v == null || v === "" ? "—" : v}</td>`;
      }).join("")}</tr>`).join("")}</tbody>
      ${rows.length ? `<tfoot><tr><td colspan="${cols.length}" class="ar"><b>Total rows: ${rows.length}</b></td></tr></tfoot>` : ""}
    </table>`;
  }

  /* ---------------- global events ---------------- */
  window.addEventListener("hashchange", () => {
    if (api.store.user) navigate();
  });

  /* ---------------- boot ---------------- */
  async function boot() {
    // preload lookups for the login screen
    const res = await api.call("getState", {});
    if (res && res.ok && res.data && res.data.settings) {
      api.store.settings = Object.assign({}, api.store.settings, res.data.settings);
      api.store.version = res.data.version || 0;
    }
    const usersRes = await api.call("getLoginUsers", {});
    if (usersRes && usersRes.ok && usersRes.data) api.store.users = usersRes.data.rows || [];

    if (!root.Auth.requireLogin()) return;
    await api.refreshAll(false);
    buildShell();
    navigate();
    startSyncLoop();
  }

  root.App = { boot, enter, navigate, rerenderCurrent, can, buildPrintHTML, printReport, printTable, ROUTES, setSyncState };
})(typeof window !== "undefined" ? window : globalThis);

</script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      window.App.boot().catch(err => {
        console.error(err);
        document.getElementById("app-root").innerHTML =
          '<div style="padding:60px 20px;text-align:center;font-family:Inter,sans-serif"><h2>Failed to start</h2><p>' +
          String(err && err.message || err) + '</p></div>';
      });
    });
  </script>
</body>
