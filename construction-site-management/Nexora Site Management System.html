    const contractValue = sum(cs.filter(c => c.type === "Contract Value"), c => num(c.total));
    const salesInvoices = sum(cs.filter(c => c.type === "Sales Invoice"), c => num(c.total));
    const lpo = sum(cs.filter(c => c.type === "LPO"), c => num(c.total));
    const collected = sum(cs.filter(c => c.type === "Sales Invoice" && c.paymentStatus === "Paid"), c => num(c.total));
    const receivable = sum(cs.filter(c => c.type === "Sales Invoice" && c.paymentStatus !== "Paid" && c.status !== "Cancelled"), c => num(c.total));
    const lpoOutstanding = sum(cs.filter(c => c.type === "LPO" && !["Received", "Cancelled"].includes(c.status)), c => num(c.total));
    return { income, contractValue, salesInvoices, lpo, collected, receivable, lpoOutstanding, count: cs.length };
  }

  /* ------------------------------------------------------------
     DASHBOARD
     ------------------------------------------------------------ */
  function dashboardKPIs(store, f) {
    const budget = enrichBudget(store);
    const expenses = enrichExpenses(store, budget);
    const contracts = enrichContracts(store);
    const fe = filterExpenses(expenses, f);
    const cs = contractSums(contracts, f);
    const fb = filterBudget(budget, f);
    const budgetApproved = sum(fb.filter(b => b.status === "Approved"), b => num(b.amount));
    const expTotal = sum(fe, e => num(e.amount));
    const profit = cs.income - expTotal;
    const margin = cs.income > 0 ? (profit / cs.income) * 100 : 0;
    const budgetUsed = budgetApproved > 0 ? (expTotal / budgetApproved) * 100 : 0;
    const activeProjects = (store.masters.Projects || []).filter(p => p.status === "Active").length;
    const pendingPay = sum(fe.filter(e => e.paymentStatus !== "Paid"), e => num(e.amount));
    return [
      { key: "projects", icon: "building", label: "Active Projects", value: String(activeProjects), sub: `${(store.masters.Projects || []).length} total projects`, tone: "" },
      { key: "income", icon: "briefcase", label: "Contracts & Invoices", value: F.money(cs.income), sub: `${cs.count} document(s)`, tone: "ok" },
      { key: "budget", icon: "doc", label: "Approved Budget", value: F.money(budgetApproved), sub: `${fb.length} budget line(s)`, tone: "" },
      { key: "expense", icon: "wallet", label: "Actual Expenses", value: F.money(expTotal), sub: `${fe.length} expense ${fe.length === 1 ? "entry" : "entries"}`, tone: "warn" },
      { key: "profit", icon: "money", label: "Net Profit (to date)", value: F.money(profit), sub: `margin ${margin.toFixed(1)}%`, tone: profit >= 0 ? "ok" : "bad" },
      { key: "budgetused", icon: "chart", label: "Budget Utilisation", value: `${budgetUsed.toFixed(1)}%`, sub: budgetUsed > 100 ? "OVER budget" : "of approved budget", tone: budgetUsed > 100 ? "bad" : budgetUsed >= 80 ? "warn" : "ok" },
      { key: "lpo", icon: "truck", label: "Open LPO Commitments", value: F.money(cs.lpoOutstanding), sub: `total LPOs ${F.money(cs.lpo)}`, tone: "warn" },
      { key: "receivable", icon: "money", label: "Outstanding Invoices", value: F.money(cs.receivable), sub: `collected ${F.money(cs.collected)}`, tone: cs.receivable > 0 ? "bad" : "ok" },
    ];
  }

  function dashboardCharts(store, f) {
    const budget = enrichBudget(store);
    const expenses = enrichExpenses(store, budget);
    const contracts = enrichContracts(store);
    const fe = filterExpenses(expenses, f);
    const fb = filterBudget(budget, f);
    const fc = filterContracts(contracts, f);
    const projects = store.masters.Projects || [];

    // 1. Budget vs Expense by project (bar)
    const projIds = [...new Set([...fb.map(b => b.projectId), ...fe.map(e => e.projectId)])];
    const pLabels = projIds.map(id => {
      const p = byId(projects, id);
      return p ? p.name : "Unknown";
    });
    const budgetByProj = projIds.map(id => sum(fb.filter(b => b.projectId === id), b => num(b.amount)));
    const expByProj = projIds.map(id => sum(fe.filter(e => e.projectId === id), e => num(e.amount)));

    // 2. Expenses by head (doughnut)
    const byHead = groupBy(fe, e => e.headId);
    const headLabels = [...byHead.keys()].map(id => nameOf(store.masters.ExpenseHeads, id));
    const headData = [...byHead.values()].map(list => sum(list, e => num(e.amount)));

    // 3. Monthly trend (line) — income vs expense
    const from = f && f.from ? f.from : minDate([...fe.map(e => e.date), ...fc.map(c => c.date)]);
    const to = f && f.to ? f.to : F.todayISO();
    const months = monthRange(from, to);
    const expByMonth = months.map(m => sum(fe.filter(e => F.monthKey(e.date) === m), e => num(e.amount)));
    const incByMonth = months.map(m => sum(fc.filter(c => c.isIncome && F.monthKey(c.date) === m), c => num(c.total)));

    // 4. Top materials (hbar)
    const byMat = groupBy(fe, e => e.materialId);
    const matList = [...byMat.values()]
      .map(list => ({ name: nameOf(store.masters.Materials, list[0].materialId), amt: sum(list, e => num(e.amount)) }))
      .sort((a, b) => b.amt - a.amt).slice(0, 8);

    return [
      { type: "bar", title: "Budget vs Actual Expenses by Project", labels: pLabels, series: [
        { label: "Approved Budget", data: budgetByProj, color: "#0ea5e9" },
        { label: "Actual Expenses", data: expByProj, color: "#f59e0b" },
      ] },
      { type: "doughnut", title: "Expenses by Expense Head", labels: headLabels, series: [
        { label: "Amount", data: headData, color: "#f59e0b" },
      ] },
      { type: "line", title: "Monthly Income vs Expenses", labels: months.map(F.fmtMonth), series: [
        { label: "Income (Contracts + Invoices)", data: incByMonth, color: "#059669" },
        { label: "Expenses", data: expByMonth, color: "#e11d48" },
      ] },
      { type: "hbar", title: "Top Materials by Spend", labels: matList.map(m => m.name), series: [
        { label: "Spend", data: matList.map(m => m.amt), color: "#f59e0b" },
      ] },
    ];
  }

  function dashboardAlerts(store) {
    const budget = enrichBudget(store);
    const expenses = enrichExpenses(store, budget);
    const contracts = enrichContracts(store);
    const alerts = [];
    const over = budget.filter(b => b.pctUsed > 100.005);
    const near = budget.filter(b => b.pctUsed >= 80 && b.pctUsed <= 100.005);
    over.slice(0, 5).forEach(b => alerts.push({
      tone: "bad", title: "Budget line exceeded",
      msg: `${b.materialId ? nameOf(store.masters.Materials, b.materialId) : "—"} (${b.projectId ? nameOf(store.masters.Projects, b.projectId) : "—"}) at ${b.pctUsed.toFixed(1)}% of budget`,
    }));
    near.slice(0, 5).forEach(b => alerts.push({
      tone: "warn", title: "Budget line near limit (≥80%)",
      msg: `${b.materialId ? nameOf(store.masters.Materials, b.materialId) : "—"} (${b.projectId ? nameOf(store.masters.Projects, b.projectId) : "—"}) at ${b.pctUsed.toFixed(1)}%`,
    }));
    (contracts || []).filter(c => c.type === "Sales Invoice" && c.paymentStatus !== "Paid" && c.status !== "Cancelled")
      .sort((a, b) => String(a.date).localeCompare(String(b.date)))
      .slice(0, 5)
      .forEach(c => alerts.push({
        tone: "bad", title: "Invoice not fully paid",
        msg: `${c.refNo} — ${F.money(c.total)} (${c.customerId ? nameOf(store.masters.Customers, c.customerId) : "—"})`,
      }));
    const orphans = (store.expenses || []).filter(e => !byId(budget, e.budgetId));
    orphans.slice(0, 3).forEach(e => alerts.push({
      tone: "bad", title: "Expense references a removed budget line",
      msg: `${e.invoiceNo || "no invoice"} — ${F.money(e.amount)} on ${e.date}`,
    }));
    return alerts;
  }

  function dashboardActivity(store, n) {
    return (store.audit || []).slice().reverse().slice(0, n || 8);
  }

  /* ------------------------------------------------------------
     REPORTS
     ------------------------------------------------------------ */
  function report(store, key, f) {
    const E = enrichAll(store);
    const cs = contractSums(E.contracts, f);
    const fe = filterExpenses(E.expenses, f);
    const fc = filterContracts(E.contracts, f);
    const fb = filterBudget(E.budget, f);
    const expTotal = sum(fe, e => num(e.amount));
    const budgetTotal = sum(fb.filter(b => b.status === "Approved"), b => num(b.amount));
    const profit = cs.income - expTotal;
    const variance = budgetTotal - expTotal;

    const cols = {
      money: (v) => `<span class="num">${F.money(v)}</span>`,
      qty: (v) => `<span class="num">${F.qty(v)}</span>`,
      date: (v) => F.fmtDate(v),
    };

    switch (key) {

      /* ============ P&L (overall + per project) ============ */
      case "pl": {
        const byProj = groupBy(fb.concat(fe).concat(fc), r => r.projectId);
        const rows = [...byProj.keys()].filter(id => {
          if (f.projectId) return id === f.projectId;
          return true;
        }).map(id => {
          const p = byId(store.masters.Projects, id);
          const bls = fb.filter(b => b.projectId === id);
          const exs = fe.filter(e => e.projectId === id);
          const cts = fc.filter(c => c.projectId === id);
          const income = sum(cts.filter(c => c.isIncome), c => num(c.total));
          const lpo = sum(cts.filter(c => c.type === "LPO"), c => num(c.total));
          const bud = sum(bls.filter(b => b.status === "Approved"), b => num(b.amount));
          const exp = sum(exs, e => num(e.amount));
          const prof = income - exp;
          return {
            project: p ? p.name : "(Unassigned)", client: p ? p.client : "—", status: p ? p.status : "—",
            income, lpo, budget: bud, expenses: exp,
            variance: bud - exp, profit: prof,
            pctUsed: bud > 0 ? (exp / bud) * 100 : 0,
            margin: income > 0 ? (prof / income) * 100 : 0,
          };
        });
        return {
          title: "Profit & Loss Statement", subtitle: "Profitability at any stage of running projects",
          cards: [
            { label: "Total Income", value: F.money(cs.income), tone: "ok" },
            { label: "Actual Expenses", value: F.money(expTotal), tone: "warn" },
            { label: "Net Profit", value: F.money(profit), tone: profit >= 0 ? "ok" : "bad" },
            { label: "Profit Margin", value: cs.income ? F.pct(profit / cs.income * 100) : "—", tone: profit >= 0 ? "ok" : "bad" },
            { label: "Approved Budget", value: F.money(budgetTotal), tone: "" },
            { label: "Budget Variance", value: F.money(variance), tone: variance < 0 ? "bad" : "ok" },
          ],
          charts: [
            { type: "bar", title: "Income vs Expenses vs Profit by Project", labels: rows.map(r => r.project), series: [
              { label: "Income", data: rows.map(r => r.income), color: "#059669" },
              { label: "Expenses", data: rows.map(r => r.expenses), color: "#e11d48" },
              { label: "Profit", data: rows.map(r => r.profit), color: "#f59e0b" },
            ] },
          ],
          tables: [{
            title: "Profitability by Project", columns: [
              { key: "project", label: "Project" },
              { key: "client", label: "Client" },
              { key: "status", label: "Status", render: r => root.UI ? root.UI.pill(r.status) : r.status },
              { key: "income", label: "Income (MK)", align: "right", render: r => cols.money(r.income) },
              { key: "lpo", label: "LPO (MK)", align: "right", render: r => cols.money(r.lpo) },
              { key: "budget", label: "Budget (MK)", align: "right", render: r => cols.money(r.budget) },
              { key: "expenses", label: "Expenses (MK)", align: "right", render: r => cols.money(r.expenses) },
              { key: "variance", label: "Variance (MK)", align: "right", render: r => cols.money(r.variance) },
              { key: "pctUsed", label: "Budget Used", align: "right", render: r => root.UI ? root.UI.usagePill(r.pctUsed) : F.pct(r.pctUsed) },
              { key: "profit", label: "Net Profit (MK)", align: "right", render: r => `<span class="num ${r.profit < 0 ? "neg" : "pos"}">${F.money(r.profit)}</span>` },
            ],
            rows,
            foot: [
              { label: "Totals", values: ["", "", "", F.money(sum(rows, r => r.income)), F.money(sum(rows, r => r.lpo)), F.money(sum(rows, r => r.budget)), F.money(sum(rows, r => r.expenses)), F.money(sum(rows, r => r.variance)), "", F.money(sum(rows, r => r.profit))] },
            ],
          }],
        };
      }

      /* ============ Project-wise ============ */
      case "project": {
        const rows = (store.masters.Projects || [])
          .filter(p => !f.projectId || p.id === f.projectId)
          .map(p => {
            const bls = fb.filter(b => b.projectId === p.id);
            const exs = fe.filter(e => e.projectId === p.id);
            const cts = fc.filter(c => c.projectId === p.id);
            const cv = sum(cts.filter(c => c.type === "Contract Value"), c => num(c.total));
            const inv = sum(cts.filter(c => c.type === "Sales Invoice"), c => num(c.total));
            const lpo = sum(cts.filter(c => c.type === "LPO"), c => num(c.total));
            const bud = sum(bls.filter(b => b.status === "Approved"), b => num(b.amount));
            const exp = sum(exs, e => num(e.amount));
            return {
              project: p.name, code: p.code, client: p.client, status: p.status,
              start: p.startDate, end: p.endDate,
              contractValue: cv, invoices: inv, lpo,
              budget: bud, expenses: exp, remaining: bud - exp,
              pctUsed: bud > 0 ? exp / bud * 100 : 0,
              profit: cv + inv - exp,
            };
          });
        return {
          title: "Project-wise Report", subtitle: "Budget vs expenses and profitability per project",
          cards: [
            { label: "Projects", value: String(rows.length), tone: "" },
            { label: "Total Contract Value", value: F.money(sum(rows, r => r.contractValue)), tone: "ok" },
            { label: "Total Expenses", value: F.money(sum(rows, r => r.expenses)), tone: "warn" },
            { label: "Budget Remaining", value: F.money(sum(rows, r => r.remaining)), tone: sum(rows, r => r.remaining) < 0 ? "bad" : "ok" },
          ],
          tables: [{
            title: "All Projects", columns: [
              { key: "code", label: "Code" },
              { key: "project", label: "Project" },
              { key: "client", label: "Client" },
              { key: "status", label: "Status", render: r => root.UI ? root.UI.pill(r.status) : r.status },
              { key: "contractValue", label: "Contract Value", align: "right", render: r => cols.money(r.contractValue) },
              { key: "invoices", label: "Invoiced", align: "right", render: r => cols.money(r.invoices) },
              { key: "lpo", label: "LPO", align: "right", render: r => cols.money(r.lpo) },
              { key: "budget", label: "Budget", align: "right", render: r => cols.money(r.budget) },
              { key: "expenses", label: "Expenses", align: "right", render: r => cols.money(r.expenses) },
              { key: "remaining", label: "Remaining", align: "right", render: r => `<span class="num ${r.remaining < 0 ? "neg" : ""}">${F.money(r.remaining)}</span>` },
              { key: "pctUsed", label: "Used", align: "right", render: r => root.UI ? root.UI.usagePill(r.pctUsed) : F.pct(r.pctUsed) },
              { key: "profit", label: "Net Profit", align: "right", render: r => `<span class="num ${r.profit < 0 ? "neg" : "pos"}">${F.money(r.profit)}</span>` },
            ],
            rows,
          }],
        };
      }

      /* ============ Budget vs Actual (item-wise) ============ */
      case "budgetactual": {
        const rows = fb.map(b => ({
          project: b.projectId ? nameOf(store.masters.Projects, b.projectId) : "—",
          head: b.headId ? nameOf(store.masters.ExpenseHeads, b.headId) : "—",
          material: b.materialId ? nameOf(store.masters.Materials, b.materialId) : "—",
          shop: b.shopId ? nameOf(store.masters.Shops, b.shopId) : "—",
          unit: b.unitId ? nameOf(store.masters.Units, b.unitId) : "—",
          status: b.status,
          qty: b.qty, rate: b.rate, amount: b.amount,
          consumedQty: b.consumedQty, consumedAmount: b.consumedAmount,
          remainingQty: b.remainingQty, remainingAmount: b.remainingAmount,
          pctUsed: b.pctUsed, tone: b.tone,
        })).sort((a, b) => b.pctUsed - a.pctUsed);
        const over = rows.filter(r => r.pctUsed > 100.005).length;
        const near = rows.filter(r => r.pctUsed >= 80 && r.pctUsed <= 100.005).length;
        return {
          title: "Budget vs Actual Expenses", subtitle: "Item-wise comparison — expenses cannot exceed the budgeted line",
          cards: [
            { label: "Budget Lines", value: String(rows.length), tone: "" },
            { label: "Budgeted (Approved)", value: F.money(budgetTotal), tone: "" },
            { label: "Consumed", value: F.money(expTotal), tone: "warn" },
            { label: "Remaining", value: F.money(variance), tone: variance < 0 ? "bad" : "ok" },
            { label: "Lines ≥80% used", value: String(near), tone: "warn" },
            { label: "Lines over budget", value: String(over), tone: over ? "bad" : "ok" },
          ],
          charts: [{
            type: "hbar", title: "Budget utilisation by line (top 12)", labels: rows.slice(0, 12).map(r => `${r.material} (${r.project})`),
            series: [{ label: "% used", data: rows.slice(0, 12).map(r => Math.min(r.pctUsed, 130)), color: "#f59e0b" }],
          }],
          tables: [{
            title: "Budget Lines vs Consumption", columns: [
              { key: "project", label: "Project" },
              { key: "head", label: "Expense Head" },
              { key: "material", label: "Material / Item" },
              { key: "shop", label: "Shop" },
              { key: "qty", label: "BQty", align: "right", render: r => cols.qty(r.qty) },
              { key: "rate", label: "Rate", align: "right", render: r => cols.money(r.rate) },
              { key: "amount", label: "Budget", align: "right", render: r => cols.money(r.amount) },
              { key: "consumedQty", label: "Used Qty", align: "right", render: r => cols.qty(r.consumedQty) },
              { key: "consumedAmount", label: "Used Amount", align: "right", render: r => cols.money(r.consumedAmount) },
              { key: "remainingAmount", label: "Remaining", align: "right", render: r => `<span class="num ${r.remainingAmount < 0 ? "neg" : ""}">${F.money(r.remainingAmount)}</span>` },
              { key: "pctUsed", label: "Utilisation", align: "right", render: r => `<div class="pbar-cell">${root.UI ? root.UI.progressBar(r.pctUsed, r.tone === "Over" ? "bad" : r.tone === "Near" ? "warn" : "ok") : ""}<span class="pbar-pct">${F.pct(r.pctUsed)}</span></div>` },
            ],
            rows,
          }],
        };
      }

      /* ============ Material-wise ============ */
      case "material": {
        const g = groupBy(fe, e => e.materialId);
        const rows = [...g.entries()].map(([id, list]) => {
          const m = byId(store.masters.Materials, id);
          const projs = new Set(list.map(e => e.projectId));
          return {
            material: m ? m.name : "—", unit: m ? m.unit : "—",
            qty: sum(list, e => num(e.qty)), amount: sum(list, e => num(e.amount)),
            entries: list.length, projects: projs.size,
            avgRate: sum(list, e => num(e.qty)) > 0 ? sum(list, e => num(e.amount)) / sum(list, e => num(e.qty)) : 0,
          };
        }).sort((a, b) => b.amount - a.amount);
        return {
          title: "Item-wise Report", subtitle: "Spend by material / item across the selected range",
          cards: [
            { label: "Distinct Items", value: String(rows.length), tone: "" },
            { label: "Total Spend", value: F.money(expTotal), tone: "warn" },
            { label: "Top Item", value: rows[0] ? rows[0].material : "—", tone: "ok" },
          ],
          charts: [{
            type: "hbar", title: "Top 12 items by spend", labels: rows.slice(0, 12).map(r => r.material),
            series: [{ label: "Spend", data: rows.slice(0, 12).map(r => r.amount), color: "#f59e0b" }],
          }],
          tables: [{
            title: "Materials / Items", columns: [
              { key: "material", label: "Material / Item" },
              { key: "unit", label: "Unit" },
              { key: "projects", label: "Projects", align: "right" },
              { key: "entries", label: "Entries", align: "right" },
              { key: "qty", label: "Total Qty", align: "right", render: r => cols.qty(r.qty) },
              { key: "avgRate", label: "Avg Rate", align: "right", render: r => cols.money(r.avgRate) },
              { key: "amount", label: "Total Amount", align: "right", render: r => cols.money(r.amount) },
              { key: "share", label: "Share", align: "right", render: r => F.pct(expTotal > 0 ? r.amount / expTotal * 100 : 0) },
            ],
            rows,
            foot: [{ label: "Totals", values: ["", "", "", sum(rows, r => r.entries), sum(rows, r => r.qty), "", F.money(expTotal), "100.0%"] }],
          }],
        };
      }

      /* ============ Shop-wise ============ */
      case "shop": {
        const g = groupBy(fe, e => e.shopId);
        const rows = [...g.entries()].map(([id, list]) => {
          const s = byId(store.masters.Shops, id);
          const budgetFor = sum(fb.filter(b => b.shopId === id), b => num(b.amount));
          const exp = sum(list, e => num(e.amount));
          return { shop: s ? s.name : "—", location: s ? s.location : "—", entries: list.length, budget: budgetFor, expenses: exp, variance: budgetFor - exp, pctUsed: budgetFor > 0 ? exp / budgetFor * 100 : 0 };
        }).sort((a, b) => b.expenses - a.expenses);
        return {
          title: "Shop-wise Report", subtitle: "Expenses and budget utilisation per shop / site store",
          cards: [
            { label: "Shops Active", value: String((store.masters.Shops || []).filter(s => s.status === "Active").length), tone: "" },
            { label: "Total Spend", value: F.money(expTotal), tone: "warn" },
          ],
          charts: [{
            type: "bar", title: "Expenses by shop", labels: rows.map(r => r.shop),
            series: [{ label: "Expenses", data: rows.map(r => r.expenses), color: "#f59e0b" }],
          }],
          tables: [{
            title: "Shops / Site Stores", columns: [
              { key: "shop", label: "Shop" },
              { key: "location", label: "Location" },
              { key: "entries", label: "Entries", align: "right" },
              { key: "budget", label: "Budget", align: "right", render: r => cols.money(r.budget) },
              { key: "expenses", label: "Expenses", align: "right", render: r => cols.money(r.expenses) },
              { key: "variance", label: "Variance", align: "right", render: r => `<span class="num ${r.variance < 0 ? "neg" : ""}">${F.money(r.variance)}</span>` },
              { key: "pctUsed", label: "Used", align: "right", render: r => root.UI ? root.UI.usagePill(r.pctUsed) : F.pct(r.pctUsed) },
            ],
            rows,
          }],
        };
      }

      /* ============ Head-wise ============ */
      case "head": {
        const g = groupBy(fe, e => e.headId);
        const rows = [...g.entries()].map(([id, list]) => {
          const h = byId(store.masters.ExpenseHeads, id);
          const budgetFor = sum(fb.filter(b => b.headId === id), b => num(b.amount));

     helpers
     ------------------------------------------------------------ */
  function minDate(list) {
    const d = (list || []).filter(Boolean).sort()[0];
    return d || "2024-01-01";
  }

  function monthRange(fromISO, toISO) {
    const out = [];
    if (!fromISO || !toISO) return out;
    const s = fromISO.slice(0, 7).split("-").map(Number);
    const e = toISO.slice(0, 7).split("-").map(Number);
    let y = s[0], m = s[1];
    while (y < e[0] || (y === e[0] && m <= e[1])) {
      out.push(`${y}-${String(m).padStart(2, "0")}`);
      m++;
      if (m > 12) { m = 1; y++; }
      if (out.length > 60) break;
    }
    return out;
  }

  /* ---------------- storage ---------------- */
  function MockDB(storage) {
    this.storage = storage || (typeof localStorage !== "undefined" ? localStorage : null);
    let db = null;
    try {
      const raw = this.storage && this.storage.getItem(KEY);
      db = raw ? JSON.parse(raw) : null;
    } catch (e) { db = null; }
    if (!db || !db.settings) {
      db = seed();
      this.persist(db);
    }
    this.db = db;
  }

  MockDB.prototype.persist = function (db) {
    if (!this.storage) return;
    try { this.storage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* quota */ }
  };

  MockDB.prototype.bump = function () {
    this.db.version++;
    this.persist(this.db);
  };

  MockDB.prototype.audit = function (user, action, entity, ref, details) {
    this.db.audit.unshift({ ts: F.nowStamp(), user: user || "System", action, entity, ref: ref || "", details: details || "" });
    if (this.db.audit.length > 600) this.db.audit.length = 600;
  };

  MockDB.prototype.nextId = function (p) {
    return F.uid(p || "ID");
  };

  /* ---------------- shared business rules ---------------- */
  const MASTER_SHEETS = ["Projects", "Shops", "ExpenseHeads", "Materials", "Units", "Suppliers", "Customers"];

  function err(code, message, field) {
    return { ok: false, error: { code, message, field: field || "" } };
  }

  function masterDupError(sheet, data, selfId, db) {
    const list = db.masters[sheet] || [];
    const name = String(data.name || "").trim().toLowerCase();
    if (!name) return err("REQUIRED", "Name is required", "name");
    const dup = list.find(r => r.id !== selfId && String(r.name).trim().toLowerCase() === name);
    if (dup) return err("DUPLICATE", `${sheet.slice(0, -1)} "${data.name}" already exists — duplicate entries are not allowed.`, "name");
    if (sheet === "Projects") {
      const code = String(data.code || "").trim().toUpperCase();
      if (!code) return err("REQUIRED", "Project code is required", "code");
      const dupC = list.find(r => r.id !== selfId && String(r.code).trim().toUpperCase() === code);
      if (dupC) return err("DUPLICATE", `Project code "${code}" is already used by "${dupC.name}".`, "code");
    }
    if (sheet === "Units") {
      const ab = String(data.abbrev || "").trim().toLowerCase();
      if (ab) {
        const dupA = list.find(r => r.id !== selfId && String(r.abbrev).trim().toLowerCase() === ab);
        if (dupA) return err("DUPLICATE", `Unit abbreviation "${data.abbrev}" already exists.`, "abbrev");
      }
    }
    return null;
  }

  function budgetConsumed(db, budgetId) {
    return (db.expenses || []).filter(e => e.budgetId === budgetId)
      .reduce((a, e) => ({ qty: a.qty + F.num(e.qty), amount: a.amount + F.num(e.amount) }), { qty: 0, amount: 0 });
  }

  function validateBudgetLine(db, data, selfId) {
    if (!data.projectId) return err("REQUIRED", "Project is required", "projectId");
    if (!data.headId) return err("REQUIRED", "Expense head is required", "headId");
    if (!data.materialId) return err("REQUIRED", "Material is required", "materialId");
    if (!data.shopId) return err("REQUIRED", "Shop is required", "shopId");
    if (F.num(data.qty) <= 0) return err("INVALID", "Quantity must be greater than zero", "qty");
    if (F.num(data.rate) <= 0) return err("INVALID", "Rate must be greater than zero", "rate");
    if (!["Approved", "Hold"].includes(data.status)) data.status = "Approved";

    const self = selfId ? F.byId(db.budget, selfId) : null;
    if (self) {
      const consumed = budgetConsumed(db, selfId);
      const locked = ["projectId", "headId", "materialId", "shopId", "unitId"];
      for (const k of locked) {
        if (String(data[k]) !== String(self[k])) {
          return err("LOCKED", "This budget line already has expenses against it — its project, head, material, shop and unit cannot be changed.", k);
        }
      }
      if (F.num(data.qty) < consumed.qty - EPS) return err("INVALID", `Quantity cannot be below already consumed ${F.qty(consumed.qty)}.`, "qty");
      if (F.num(data.qty) * F.num(data.rate) < consumed.amount - EPS) return err("INVALID", `Amount cannot be below already consumed ${F.money(consumed.amount)}.`, "rate");
    } else {
      const dup = db.budget.find(b =>
        b.projectId === data.projectId && b.headId === data.headId && b.materialId === data.materialId && b.shopId === data.shopId);
      if (dup) return err("DUPLICATE", "This exact budget line (project + head + material + shop) already exists — duplicate budget lines are not allowed.", "materialId");
    }
    return null;
  }

  const CONTRACT_TYPES = {
    "Contract Value": ["Awarded", "In Progress", "Completed", "Terminated"],
    "Sales Invoice": ["Issued", "Cancelled"],
    "LPO": ["Open", "Partially Received", "Received", "Cancelled"],
  };

  function validateContract(db, data, selfId) {
    if (!CONTRACT_TYPES[data.type]) return err("INVALID", "Document type is required", "type");
    if (!String(data.refNo || "").trim()) return err("REQUIRED", "Reference number is required", "refNo");
    if (!data.date) return err("REQUIRED", "Date is required", "date");
    if (!data.projectId) return err("REQUIRED", "Project is required", "projectId");
    if (F.num(data.amount) <= 0) return err("INVALID", "Amount must be greater than zero", "amount");
    const direction = data.type === "LPO" ? "Expense" : "Income";
    if (direction === "Income" && !data.customerId) return err("REQUIRED", "Customer is required for contracts and invoices", "customerId");
    if (direction === "Expense" && !data.supplierId) return err("REQUIRED", "Supplier is required for LPOs", "supplierId");
    if (!CONTRACT_TYPES[data.type].includes(data.status)) return err("INVALID", `Invalid status for ${data.type}`, "status");
    const dup = db.contracts.find(c => c.id !== selfId && c.type === data.type && String(c.refNo).trim().toUpperCase() === String(data.refNo).trim().toUpperCase());
    if (dup) return err("DUPLICATE", `${data.type} "${data.refNo}" already exists — reference numbers must be unique.`, "refNo");
    return null;
  }

  function validateExpense(db, data, selfId, settings, user) {
    // STRICT CONTROL — the expense MUST be against an existing, approved budget line
    if (!data.projectId) return err("REQUIRED", "Project is required", "projectId");
    if (!data.budgetId) return err("REQUIRED", "Budget line is required — expenses can only be entered against budgeted items.", "budgetId");
    const bl = F.byId(db.budget, data.budgetId);
    if (!bl) return err("INVALID", "Selected budget line no longer exists. Please refresh and select again.", "budgetId");
    if (bl.projectId !== data.projectId) return err("INVALID", "The selected budget line does not belong to this project.", "budgetId");
    if (bl.status !== "Approved") return err("INVALID", `This budget line is on "${bl.status}" — expenses can only be posted against APPROVED budget lines.`, "budgetId");
    if (!data.date) return err("REQUIRED", "Date is required", "date");
    if (!data.supplierId) return err("REQUIRED", "Supplier is required", "supplierId");
    if (F.num(data.qty) <= 0) return err("INVALID", "Quantity must be greater than zero", "qty");
    if (F.num(data.rate) <= 0) return err("INVALID", "Rate must be greater than zero", "rate");

    const qty = F.num(data.qty), rate = F.num(data.rate);
    const amount = Math.round(qty * rate * 100) / 100;

    // duplicate invoice check
    const inv = String(data.invoiceNo || "").trim();
    if (inv) {
      const dup = db.expenses.find(e =>
        e.id !== selfId && e.projectId === data.projectId && e.supplierId === data.supplierId &&
        String(e.invoiceNo || "").trim().toUpperCase() === inv.toUpperCase());
      if (dup) return err("DUPLICATE", `Invoice "${inv}" from this supplier is already entered for this project — duplicate expense entries are not allowed.`, "invoiceNo");
    }

    // budget limit check
    const consumed = budgetConsumed(db, data.budgetId);
    const selfExp = selfId ? F.byId(db.expenses, selfId) : null;
    let cQty = consumed.qty, cAmt = consumed.amount;
    if (selfExp) { cQty -= F.num(selfExp.qty); cAmt -= F.num(selfExp.amount); }
    const remainingQty = F.num(bl.qty) - cQty;
    const remainingAmt = F.num(bl.amount) - cAmt;
    const overQty = qty > remainingQty + EPS;
    const overAmt = amount > remainingAmt + EPS;

    if (overQty || overAmt) {
      const allow = String(settings.allowOverBudget) === "YES";
      const isAdmin = user && user.role === "Admin";
      const overrideOk = data.override === "YES" && String(data.overrideReason || "").trim();
      if (!(allow && isAdmin && overrideOk)) {
        return err("OVER_BUDGET",
          `This entry exceeds the remaining budget on this line. Remaining: ${F.qty(remainingQty)} ${F.byId(db.masters.Units, bl.unitId)?.abbrev || ""} / ${F.money(Math.max(0, remainingAmt))}. ` +
          (allow && isAdmin ? "Tick “Override” and give a reason, or reduce the quantity." : "New or additional expenses outside the approved budget are NOT allowed."),
          "qty");
      }
    }
    return null;
  }

  function inUseCheck(db, sheet, id) {
    const uses = (list) => list.some(r =>
      (sheet === "Projects" && r.projectId === id) ||
      (sheet === "Materials" && r.materialId === id) ||
      (sheet === "ExpenseHeads" && r.headId === id) ||
      (sheet === "Shops" && r.shopId === id) ||
      (sheet === "Units" && r.unitId === id) ||
      (sheet === "Suppliers" && r.supplierId === id) ||
      (sheet === "Customers" && r.customerId === id));
    if (uses(db.budget.concat(db.contracts, db.expenses))) {
      return `Cannot delete — this record is referenced by budget, contract or expense entries. Set its status to "Inactive" instead.`;
    }
    if (sheet === "Units" && (db.masters.Materials || []).some(m => m.unit === id)) {
      return "Cannot delete — this unit is used by one or more materials. Reassign those materials first.";
    }
    return null;
  }

  /* ---------------- action handler ---------------- */
  function handle(db, action, payload, meta) {
    const user = meta.user || null;
    const data = payload || {};
    const delay = 180 + Math.random() * 200;

    return new Promise(resolve => {
      setTimeout(() => {
        let out;
        try { out = route(db, action, data, user); } catch (e) {
          out = { ok: false, error: { code: "SERVER", message: "Unexpected error: " + (e && e.message) } };
        }
        resolve(out);
      }, delay);
    });

    function route(d, action, data, user) {
      switch (action) {

        case "ping":
          return { ok: true, data: { version: d.db.version, timestamp: F.nowStamp(), mode: "demo" } };

        case "getVersion":
          return { ok: true, data: { version: d.db.version, timestamp: F.nowStamp() } };

        case "login": {
          const u = d.db.users.find(x => String(x.name).toLowerCase() === String(data.name || "").toLowerCase());
          if (!u) return err("LOGIN", "User not found. Please check your name.");
          if (u.active !== "YES") return err("LOGIN", "This user account is inactive. Contact an administrator.");
          if (String(u.pin) !== String(data.pin || "")) return err("LOGIN", "Incorrect PIN. (Default PIN is 1234 — change it in Settings.)");
          d.audit(u.name, "LOGIN", "System", u.name, "Signed in");
          d.persist(d.db);
          return { ok: true, data: { user: { name: u.name, role: u.role, id: u.id }, token: "demo-" + F.hash(u.name) } };
        }

        case "getState": {
          const s = d.db.settings;
          return { ok: true, data: { version: d.db.version, timestamp: F.nowStamp(), settings: s, mode: "demo" } };
        }

        case "getLoginUsers": {
          return { ok: true, data: { rows: d.db.users.filter(u => u.active === "YES").map(u => ({ id: u.id, name: u.name, role: u.role })) } };
        }

        case "getSettings":
          return { ok: true, data: { settings: d.db.settings } };

        case "saveSettings": {
          if (!can(user, "settings")) return err("PERM", "You do not have permission to change settings.");
          const allowed = ["companyName", "companyAddress", "companyPhone", "companyEmail", "currency", "defaultVAT", "allowOverBudget", "pollInterval"];
          const next = {};
          allowed.forEach(k => { if (data.settings && data.settings[k] !== undefined) next[k] = data.settings[k]; });
          next.allowOverBudget = next.allowOverBudget === "YES" ? "YES" : "NO";
          d.db.settings = Object.assign({}, d.db.settings, next);
          d.audit(user.name, "UPDATE", "Settings", "", "Settings updated");
          d.bump();
          return { ok: true, data: { settings: d.db.settings, version: d.db.version } };
        }

        case "getUsers": {
          if (!can(user, "users")) return err("PERM", "You do not have permission to view users.");
          return { ok: true, data: { rows: d.db.users } };
        }

        case "saveUser": {
          if (!can(user, "users")) return err("PERM", "Only administrators can manage users.");
          if (!String(data.name || "").trim()) return err("REQUIRED", "Name is required", "name");
          if (!String(data.pin || "").trim()) return err("REQUIRED", "PIN is required", "pin");
          const dup = d.db.users.find(u => u.id !== data.id && String(u.name).toLowerCase() === String(data.name || "").toLowerCase());
          if (dup) return err("DUPLICATE", "A user with this name already exists.", "name");
          if (data.id) {
            const u = F.byId(d.db.users, data.id);
            if (!u) return err("NOT_FOUND", "User not found.");
            Object.assign(u, { name: data.name, role: data.role, pin: data.pin, active: data.active, });
            d.audit(user.name, "UPDATE", "User", u.name, `Updated user (role ${u.role})`);
          } else {
            const nu = { id: d.nextId("U"), name: data.name, role: data.role || "Clerk", pin: data.pin, active: data.active || "YES", createdAt: F.nowStamp() };
            d.db.users.push(nu);
            d.audit(user.name, "CREATE", "User", nu.name, `Created user (role ${nu.role})`);
          }
          d.bump();
          return { ok: true, data: { rows: d.db.users, version: d.db.version } };
        }

        case "deleteUser": {
          if (!can(user, "users")) return err("PERM", "Only administrators can manage users.");
          const u = F.byId(d.db.users, data.id);
          if (!u) return err("NOT_FOUND", "User not found.");
          if (u.name === user.name) return err("INVALID", "You cannot delete your own account.");
          const admins = d.db.users.filter(x => x.role === "Admin" && x.active === "YES").length;
          if (u.role === "Admin" && admins <= 1) return err("INVALID", "At least one active admin must remain.");
          d.db.users = d.db.users.filter(x => x.id !== data.id);
          d.audit(user.name, "DELETE", "User", u.name, "Deleted user");
          d.bump();
          return { ok: true, data: { rows: d.db.users, version: d.db.version } };
        }

        case "changePin": {
          const u = F.byId(d.db.users, data.id) || d.db.users.find(x => x.name === user.name);
          if (!u) return err("NOT_FOUND", "User not found.");
          if (String(u.pin) !== String(data.oldPin || "")) return err("LOGIN", "Current PIN is incorrect.");
          if (!String(data.newPin || "").trim() || String(data.newPin).length < 4) return err("INVALID", "New PIN must be at least 4 characters.");
          u.pin = String(data.newPin);
          d.audit(u.name, "UPDATE", "User", u.name, "Changed PIN");
          d.bump();
          return { ok: true, data: { user: { name: u.name, role: u.role, id: u.id } } };
        }

        case "getMasters": {
          const sheet = data.sheet;
          if (!MASTER_SHEETS.includes(sheet)) return err("INVALID", "Unknown master sheet.");
          return { ok: true, data: { rows: d.db.masters[sheet] || [], version: d.db.version } };
        }

        case "saveMaster": {
          const sheet = data.sheet;
          if (!MASTER_SHEETS.includes(sheet)) return err("INVALID", "Unknown master sheet.");
          if (!can(user, "masters")) return err("PERM", "You do not have permission to manage masters.");
          const row = data.data || {};
          const dupErr = masterDupError(sheet, row, data.id || null, d.db);
          if (dupErr) return dupErr;
          if (sheet === "Materials" && !row.unit) return err("REQUIRED", "Unit is required for materials", "unit");
          if (data.id) {
            const ex = F.byId(d.db.masters[sheet], data.id);
            if (!ex) return err("NOT_FOUND", "Record not found.");
            if (!can(user, "edit")) return err("PERM", "You do not have permission to edit records.");
            Object.assign(ex, row, { updatedBy: user.name, updatedAt: F.nowStamp() });
            d.audit(user.name, "UPDATE", sheet, ex.name, `Updated ${sheet.slice(0, -1)}`);
          } else {
            if (!can(user, "create")) return err("PERM", "You do not have permission to create records.");
            const nu = Object.assign({ id: d.nextId(sheet.slice(0, 2).toUpperCase()), createdBy: user.name, createdAt: F.nowStamp(), updatedBy: "", updatedAt: "" }, row);
            d.db.masters[sheet].push(nu);
            d.audit(user.name, "CREATE", sheet, nu.name, `Created ${sheet.slice(0, -1)}`);
          }
          d.bump();
          return { ok: true, data: { rows: d.db.masters[sheet], version: d.db.version } };
        }

        case "deleteMaster": {
          const sheet = data.sheet;
          if (!MASTER_SHEETS.includes(sheet)) return err("INVALID", "Unknown master sheet.");
          if (!can(user, "delete")) return err("PERM", "You do not have permission to delete records.");
          const ex = F.byId(d.db.masters[sheet], data.id);
          if (!ex) return err("NOT_FOUND", "Record not found.");
          const blocked = inUseCheck(d.db, sheet, data.id);
          if (blocked) return err("IN_USE", blocked);
          d.db.masters[sheet] = d.db.masters[sheet].filter(x => x.id !== data.id);
          d.audit(user.name, "DELETE", sheet, ex.name, `Deleted ${sheet.slice(0, -1)}`);
          d.bump();
          return { ok: true, data: { rows: d.db.masters[sheet], version: d.db.version } };
        }

        case "getBudget":
          return { ok: true, data: { rows: d.db.budget, version: d.db.version } };

        case "saveBudgetLine": {
          if (!can(user, "create")) return err("PERM", "You do not have permission to create records.");
          if (data.id && !can(user, "edit")) return err("PERM", "You do not have permission to edit records.");
          const row = Object.assign({}, data.data || {});
          const vErr = validateBudgetLine(d.db, row, data.id || null);
          if (vErr) return vErr;
          const qty = F.num(row.qty), rate = F.num(row.rate);
          row.amount = Math.round(qty * rate * 100) / 100;
          const mat = F.byId(d.db.masters.Materials, row.materialId);
          if (mat && mat.unit) row.unitId = mat.unit;
          if (data.id) {
            const ex = F.byId(d.db.budget, data.id);
            if (!ex) return err("NOT_FOUND", "Budget line not found.");
            Object.assign(ex, row, { updatedBy: user.name, updatedAt: F.nowStamp() });
            d.audit(user.name, "UPDATE", "Budget", ex.id, "Updated budget line");
          } else {
            const nu = Object.assign({ id: d.nextId("B"), createdBy: user.name, createdAt: F.nowStamp(), updatedBy: "", updatedAt: "" }, row);
            d.db.budget.push(nu);
            d.audit(user.name, "CREATE", "Budget", nu.id, "Created budget line");
          }
          d.bump();
          return { ok: true, data: { rows: d.db.budget, version: d.db.version } };
        }

        case "deleteBudgetLine": {
          if (!can(user, "delete")) return err("PERM", "You do not have permission to delete records.");
          const ex = F.byId(d.db.budget, data.id);
          if (!ex) return err("NOT_FOUND", "Budget line not found.");
          const consumed = budgetConsumed(d.db, data.id);
          if (consumed.qty > 0 || consumed.amount > 0) {
            return err("IN_USE", `This budget line has ${F.money(consumed.amount)} already consumed by ${d.db.expenses.filter(e => e.budgetId === data.id).length} expense entry(ies) and cannot be deleted. Set its status to "Hold" instead.`);
          }
          d.db.budget = d.db.budget.filter(x => x.id !== data.id);
          d.audit(user.name, "DELETE", "Budget", ex.id, "Deleted budget line");
          d.bump();
          return { ok: true, data: { rows: d.db.budget, version: d.db.version } };
        }

        case "getContracts":
          return { ok: true, data: { rows: d.db.contracts, version: d.db.version } };

        case "saveContract": {
          if (!can(user, "create")) return err("PERM", "You do not have permission to create records.");
          if (data.id && !can(user, "edit")) return err("PERM", "You do not have permission to edit records.");
          const row = Object.assign({}, data.data || {});
          const vErr = validateContract(d.db, row, data.id || null);
          if (vErr) return vErr;
          const amount = F.num(row.amount);
          const vatRate = F.num(row.vatRate);
          row.direction = row.type === "LPO" ? "Expense" : "Income";
          row.vatAmount = Math.round(amount * vatRate) / 100;
          row.total = Math.round((amount + row.vatAmount) * 100) / 100;
          if (data.id) {
            const ex = F.byId(d.db.contracts, data.id);
            if (!ex) return err("NOT_FOUND", "Record not found.");
            Object.assign(ex, row, { updatedBy: user.name, updatedAt: F.nowStamp() });
            d.audit(user.name, "UPDATE", "Contract", ex.refNo, `Updated ${ex.type}`);
          } else {
            const nu = Object.assign({ id: d.nextId("CT"), createdBy: user.name, createdAt: F.nowStamp(), updatedBy: "", updatedAt: "" }, row);
            d.db.contracts.push(nu);
            d.audit(user.name, "CREATE", "Contract", nu.refNo, `Created ${nu.type}`);
          }
          d.bump();
          return { ok: true, data: { rows: d.db.contracts, version: d.db.version } };
        }

        case "deleteContract": {
          if (!can(user, "delete")) return err("PERM", "You do not have permission to delete records.");
          const ex = F.byId(d.db.contracts, data.id);
          if (!ex) return err("NOT_FOUND", "Record not found.");
          d.db.contracts = d.db.contracts.filter(x => x.id !== data.id);
          d.audit(user.name, "DELETE", "Contract", ex.refNo, `Deleted ${ex.type}`);
          d.bump();
          return { ok: true, data: { rows: d.db.contracts, version: d.db.version } };
        }

        case "getExpenses":
          return { ok: true, data: { rows: d.db.expenses, version: d.db.version } };

        case "saveExpense": {
          if (!can(user, "create")) return err("PERM", "You do not have permission to create records.");
          if (data.id && !can(user, "edit")) return err("PERM", "You do not have permission to edit records.");
          const row = Object.assign({}, data.data || {});
          const vErr = validateExpense(d.db, row, data.id || null, d.db.settings, user);
          if (vErr) return vErr;
          const bl = F.byId(d.db.budget, row.budgetId);
          const qty = F.num(row.qty), rate = F.num(row.rate);
          row.headId = bl.headId;
          row.materialId = bl.materialId;
          row.unitId = bl.unitId;
          row.shopId = bl.shopId;
          row.amount = Math.round(qty * rate * 100) / 100;
          const consumed = budgetConsumed(d.db, row.budgetId);
          const selfExp = data.id ? F.byId(d.db.expenses, data.id) : null;
          let cQty = consumed.qty, cAmt = consumed.amount;
          if (selfExp) { cQty -= F.num(selfExp.qty); cAmt -= F.num(selfExp.amount); }
          row.override = row.override === "YES" ? "YES" : "NO";
          if (row.override === "YES" && (cQty + qty <= F.num(bl.qty) + EPS) && (cAmt + row.amount <= F.num(bl.amount) + EPS)) {
            row.override = "NO"; row.overrideReason = "";
          }
          if (data.id) {
            const ex = F.byId(d.db.expenses, data.id);
            if (!ex) return err("NOT_FOUND", "Expense not found.");
            Object.assign(ex, row, { updatedBy: user.name, updatedAt: F.nowStamp() });
            d.audit(user.name, "UPDATE", "Expense", ex.invoiceNo || ex.id, "Updated expense entry");
          } else {
            const nu = Object.assign({ id: d.nextId("E"), createdBy: user.name, createdAt: F.nowStamp(), updatedBy: "", updatedAt: "" }, row);
            d.db.expenses.push(nu);
            d.audit(user.name, "CREATE", "Expense", nu.invoiceNo || nu.id, `Expense ${F.money(nu.amount)} against budget line ${bl.id}${nu.override === "YES" ? " (over-budget override: " + nu.overrideReason + ")" : ""}`);
          }
          d.bump();
          return { ok: true, data: { rows: d.db.expenses, version: d.db.version } };
        }

        case "deleteExpense": {
          if (!can(user, "delete")) return err("PERM", "You do not have permission to delete records.");
          const ex = F.byId(d.db.expenses, data.id);
          if (!ex) return err("NOT_FOUND", "Expense not found.");
          d.db.expenses = d.db.expenses.filter(x => x.id !== data.id);
          d.audit(user.name, "DELETE", "Expense", ex.invoiceNo || ex.id, "Deleted expense entry — budget consumption reversed");
          d.bump();
          return { ok: true, data: { rows: d.db.expenses, version: d.db.version } };
        }

        case "getAudit": {
          const rows = d.db.audit.slice(0, Number(data.limit) || 300);
          if (data.q) {
            return { ok: true, data: { rows: rows.filter(r => F.matchSearch(data.q, `${r.user} ${r.action} ${r.entity} ${r.ref} ${r.details}`)) } };
          }
          return { ok: true, data: { rows } };
        }

        case "getAll": {
          return {
            ok: true,
            data: {
              version: d.db.version, timestamp: F.nowStamp(), mode: "demo",
              settings: d.db.settings,
              users: d.db.users.map(u => ({ id: u.id, name: u.name, role: u.role, active: u.active, createdAt: u.createdAt })),
              masters: d.db.masters,
              budget: d.db.budget, contracts: d.db.contracts, expenses: d.db.expenses,
              audit: d.db.audit.slice(0, 300),
            },
          };
        }

        case "resetDemo": {
          const fresh = seed();
          d.db = fresh;
          d.persist(d.db);
          return { ok: true, data: { version: d.db.version, message: "Demo data reset to factory sample." } };
        }

        case "selftest": {
          const results = [];
          const check = (name, fn) => {
            try { fn(); results.push({ name, pass: true }); }
            catch (e) { results.push({ name, pass: false, error: String(e && e.message || e) }); }
          };
          check("strict: expense without budget line blocked", () => {
            const r = validateExpense(d.db, { projectId: "P1", qty: 1, rate: 100, date: "2026-08-20", supplierId: "S1" }, null, d.db.settings, { role: "Admin" });
            if (!r || r.ok !== false) throw new Error("expected error");
          });
          check("strict: expense over remaining budget blocked", () => {
            const r = validateExpense(d.db, { projectId: "P1", budgetId: "B02", qty: 9999, rate: 28000, date: "2026-08-20", supplierId: "S1" }, null, d.db.settings, { role: "Admin" });
            if (!r || r.ok !== false || r.error.code !== "OVER_BUDGET") throw new Error("expected OVER_BUDGET");
          });
          check("duplicate: contract ref rejected", () => {
            const r = validateContract(d.db, { type: "Sales Invoice", refNo: "INV-2026-001", date: "2026-08-20", projectId: "P1", customerId: "C1", amount: 1000, vatRate: 16.5, status: "Issued" }, null);
            if (!r || r.ok !== false || r.error.code !== "DUPLICATE") throw new Error("expected DUPLICATE");
          });
          check("duplicate: budget line combo rejected", () => {
            const r = validateBudgetLine(d.db, { projectId: "P1", headId: "H1", materialId: "M1", shopId: "SH1", qty: 10, rate: 100, status: "Approved" }, null);
            if (!r || r.ok !== false || r.error.code !== "DUPLICATE") throw new Error("expected DUPLICATE");
          });
          check("consistency: every expense has a valid budget line", () => {
            d.db.expenses.forEach(e => {
              const bl = F.byId(d.db.budget, e.budgetId);
              if (!bl) throw new Error("orphan expense " + e.id);
            });
          });
          return { ok: true, data: { results } };
        }

        default:
          return err("UNKNOWN", "Unknown action: " + action);
      }
    }
  }

  root.Mock = {
    KEY, PERMS, can, seed, MockDB, handle,

/* ===== js/api.js ===== */
/* ============================================================
   NEXORA CMS — API layer + global data store
   • Live mode : Google Apps Script web app (Google Sheets)
   • Demo mode : in-browser mock (localStorage) when no API_URL
   ============================================================ */
(function (root) {
  "use strict";

  const F = root.Fmt;

  /* ---------------- store ---------------- */
  function safeStorageGet(key) {
    try { return localStorage.getItem(key) || ""; } catch (e) { return ""; }
  }
  function safeStorageSet(key, val) {
    try { if (val) localStorage.setItem(key, val); else localStorage.removeItem(key); } catch (e) { /* storage blocked */ }
  }

  const store = {
    user: null,
    token: null,
    mode: "demo",
    settings: {
      companyName: (root.APP_CONFIG && root.APP_CONFIG.COMPANY.name) || "Nexora Limited",
      companyAddress: (root.APP_CONFIG && root.APP_CONFIG.COMPANY.address) || "",
      companyPhone: (root.APP_CONFIG && root.APP_CONFIG.COMPANY.phone) || "",
      companyEmail: (root.APP_CONFIG && root.APP_CONFIG.COMPANY.email) || "",
      currency: "MK",
      defaultVAT: (root.APP_CONFIG && root.APP_CONFIG.DEFAULT_VAT_RATE) || 16.5,
      allowOverBudget: "NO",
      pollInterval: (root.APP_CONFIG && root.APP_CONFIG.DEFAULT_POLL_INTERVAL) || 45,
    },
    users: [],
    masters: { Projects: [], Shops: [], ExpenseHeads: [], Materials: [], Units: [], Suppliers: [], Customers: [] },
    budget: [],
    contracts: [],
    expenses: [],
    audit: [],
    version: 0,
    lastSync: null,
    connected: false,
    apiUrl: (root.APP_CONFIG && root.APP_CONFIG.API_URL) || "",
    savedApiUrl: safeStorageGet("nexora_api_url"),
  };

  store.mode = store.savedApiUrl || store.apiUrl ? "live" : "demo";
  if (!store.apiUrl && store.savedApiUrl) store.apiUrl = store.savedApiUrl;

  /* ---------------- real backend (Google Apps Script) ---------------- */
  function urlHints(url) {
    const u = String(url || "").trim();
    if (/\/dev($|\?)/.test(u)) return "You pasted a “/dev” test URL — it only works for the script owner. Use the “/exec” URL from Deploy ▸ Manage deployments.";
    if (/\/edit($|\?)/.test(u) || /script\.google\.com\/home\//.test(u)) return "You pasted the Apps Script editor URL. You need the Web App URL from Deploy ▸ Manage deployments — it ends with “/exec”.";
    if (u.includes("docs.google.com")) return "You pasted the Google Sheet URL. You need the Apps Script Web App URL (Extensions ▸ Apps Script ▸ Deploy) — it ends with “/exec”.";
    if (u && !/\/exec$/.test(u)) return "The URL does not end with “/exec” — check that you copied the complete Web App URL (Deploy ▸ Manage deployments).";
    return "";
  }

  async function probeUrl(url) {
    const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), 9000) : null;
    try {
      await fetch(url, { method: "GET", mode: "no-cors", cache: "no-store", signal: ctrl ? ctrl.signal : undefined });
      return true; // opaque response = the server is reachable
    } catch (e) {
      return false;
    } finally {
      if (timer) clearTimeout(timer);
    }
  }

  async function callLive(action, payload) {
    const url = store.apiUrl;
    if (!url) return { ok: false, error: { code: "NO_BACKEND", message: "Google Sheets backend not configured." } };
    const body = JSON.stringify({ action, payload: payload || {}, user: store.user ? { name: store.user.name, role: store.user.role, id: store.user.id } : null, token: store.token || "" });
    let res;
    try {
      // text/plain keeps this a "simple" CORS request — works from file:// pages
      res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body,
      });
    } catch (e) {
      // fetch() rejects for BOTH real network failures and CORS-blocked
      // responses (e.g. the backend redirected to a Google login page).
      // Tell them apart so the user gets the right fix.
      const hint = urlHints(url);
      if (hint) return { ok: false, error: { code: "BAD_URL", message: hint } };
      const reachable = await probeUrl(url);
      if (reachable) {
        return {
          ok: false,
          error: {
            code: "LOGIN_REDIRECT",
            message: "The backend is reachable, but the browser was blocked from reading its response. This is almost always because the deployment asks for a Google sign-in. Open the Web App URL in a browser tab: if you see a Google “Sign in” page, re-deploy with access “Anyone” (README step 6). If you see “backend is ONLINE”, check that the URL you pasted is exactly the same one.",
          },
        };
      }
      return {
        ok: false,
        error: {
          code: "NETWORK",
          message: "The Google Sheets backend could not be reached at all. Check that the URL ends with “/exec” (not /edit or /dev), that the deployment exists (Deploy ▸ Manage deployments), and your internet connection. Open the URL in your browser — you should see the “backend is ONLINE” page.",
        },
      };
    }
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch (e) {
      const looksLikeLogin = /accounts\.google\.com|ServiceLogin|Sign in/i.test(text.slice(0, 4000));
      if (looksLikeLogin) {
        return {
          ok: false,
          error: {
            code: "DEPLOY_ANYONE",
            message: "The Web App asked for a Google login. Re-deploy it with access “Anyone” (see README, step 6), then copy the new /exec URL.",
          },
        };
      }
      const hint = urlHints(url);
      if (hint) return { ok: false, error: { code: "BAD_URL", message: hint } };
      return {
        ok: false,
        error: {
          code: "BAD_RESPONSE",
          message: "The backend returned an invalid response. Check the Web App URL and deployment type (must be “Web app”, not “API executable” or “Editor add-on”).",
        },
      };
    }
    return json || { ok: false, error: { code: "EMPTY", message: "Empty response from backend." } };
  }

  /* ---------------- mock backend ---------------- */
  let mockDB = null;
  function getMockDB() {
    if (!mockDB) mockDB = new root.Mock.MockDB();
    return mockDB;
  }
  async function callMock(action, payload) {
    return root.Mock.handle(getMockDB(), action, payload || {}, { user: store.user });
  }

  /* ---------------- unified API ---------------- */
  async function call(action, payload) {
    const res = store.mode === "live" ? await callLive(action, payload) : await callMock(action, payload);
    if (res && res.ok && res.data) {
      if (res.data.version != null) store.version = res.data.version;
      if (res.data.timestamp) store.lastSync = res.data.timestamp;
      store.connected = true;
    }
    if (res && !res.ok) {
      if (res.error && res.error.code === "SESSION") {
        store.user = null;
        store.token = null;
      }
      if (root.UI && root.UI.toast) root.UI.toast(res.error.message || "Request failed", "error", { ms: 6000 });
    }
    return res;
  }

  /* ---------------- convenience loaders ---------------- */
  async function refreshAll(showToast) {
    const res = await call("getAll");
    if (res && res.ok && res.data) {
      const d = res.data;
      store.settings = Object.assign({}, store.settings, d.settings || {});
      store.users = d.users || [];
      store.masters = d.masters || store.masters;
      store.budget = d.budget || [];
      store.contracts = d.contracts || [];
      store.expenses = d.expenses || [];
      store.audit = d.audit || [];
      store.version = d.version != null ? d.version : store.version;
      store.lastSync = d.timestamp || store.lastSync;
      store.connected = true;
      if (showToast && root.UI) root.UI.toast("Data synced with Google Sheets", "success");
      return true;
    }
    return false;
  }

  async function refreshEntity(kind, showToast) {
    let res = null;
    if (kind === "budget") res = await call("getBudget");
    else if (kind === "contracts") res = await call("getContracts");
    else if (kind === "expenses") res = await call("getExpenses");
    else if (kind === "settings") res = await call("getSettings");
    else res = await call("getMasters", { sheet: kind });
    if (res && res.ok && res.data) {
      const d = res.data;
      if (kind === "budget") store.budget = d.rows || [];
      else if (kind === "contracts") store.contracts = d.rows || [];
      else if (kind === "expenses") store.expenses = d.rows || [];
      else if (kind === "settings") store.settings = Object.assign({}, store.settings, d.settings || {});
      else store.masters[kind] = d.rows || [];
      if (d.version != null) store.version = d.version;
      if (d.timestamp) store.lastSync = d.timestamp;
      if (showToast && root.UI) root.UI.toast("Data refreshed", "success");
      return true;
    }
    return false;
  }

  async function pollVersion() {
    const res = await call("getVersion", {});
    return res && res.ok ? res.data.version : null;
  }

  function setApiUrl(url) {
    const u = String(url || "").trim().replace(/\/+$/, "");
    store.apiUrl = u;
    safeStorageSet("nexora_api_url", u);
    store.mode = u ? "live" : "demo";
    if (u) store.savedApiUrl = u;
  }

  async function testConnection(url) {
    const prev = store.apiUrl, prevMode = store.mode;
    setApiUrl(url);
    const t0 = Date.now();
    const res = await call("ping", {});
    const ms = Date.now() - t0;
    if (!res.ok) {
      setApiUrl(prev);
      store.mode = prevMode;
      return { ok: false, ms, error: res.error };
    }
    return { ok: true, ms, data: res.data };
  }

  root.API = { store, call, refreshAll, refreshEntity, pollVersion, setApiUrl, testConnection, getMockDB };
})(typeof window !== "undefined" ? window : globalThis);

          root.UI.toast(`Welcome back, ${res.data.user.name}!`, "success");
          hideLogin();

          if (root.App) root.App.enter();

          errEl.textContent = (res && res.error && res.error.message) || "Login failed.";

      document.getElementById("login-screen").style.display = "flex";

  function hideLogin() {
    const host = document.getElementById("login-screen");

      if (raw) {
        const sess = JSON.parse(raw);
        if (sess && sess.name) {
          root.API.store.user = { name: sess.name, role: sess.role };
          root.API.store.token = sess.token || "";
          return true;
        }
      }
    } catch (e) { /* ignore */ }
    return false;
  }

  function requireLogin() {

      if (!restored) {
        showLogin();
        return false;
      }
    }
    return true;
  }
