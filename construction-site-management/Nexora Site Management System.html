/* ============================================================
   NEXORA LIMITED — Construction Site Management System
   Design system & application styles
   ============================================================ */

/* ---------- tokens ---------- */
:root {
  --bg: #f2f5f9;
  --card: #ffffff;
  --ink: #0f172a;
  --ink-2: #334155;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --line: #e5eaf1;
  --line-2: #eef2f7;
  --brand: #f59e0b;
  --brand-2: #d97706;
  --brand-soft: #fef3c7;
  --ok: #059669;
  --ok-soft: #d1fae5;
  --warn: #d97706;
  --warn-soft: #fef3c7;
  --bad: #e11d48;
  --bad-soft: #ffe4e6;
  --info: #0284c7;
  --info-soft: #e0f2fe;
  --violet: #7c3aed;
  --dark: #0b1220;
  --dark-2: #101a2e;
  --dark-3: #16233c;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 24px -12px rgba(15, 23, 42, .12);
  --shadow-lg: 0 24px 60px -20px rgba(15, 23, 42, .35);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

/* ---------- base ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 13.5px; color: var(--ink); }
a { color: var(--brand-2); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

.muted { color: var(--muted); }
.neg { color: var(--bad) !important; }
.pos { color: var(--ok) !important; }
.num { font-variant-numeric: tabular-nums; }
.bold { font-weight: 700; }
.al-c { text-align: center; }
.ar { text-align: right; }
.nowrap { white-space: nowrap; }
.pad0 { padding: 0; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 8px 14px; font-size: 13px; font-weight: 600;
  background: #fff; color: var(--ink-2);
  box-shadow: 0 1px 2px rgba(15,23,42,.06);
  transition: all .15s ease; white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn .ic { flex: none; }
.btn-primary {
  background: linear-gradient(180deg, #fbbf24, var(--brand));
  color: #3b2503; border-color: #eab308;
}
.btn-primary:hover { box-shadow: 0 8px 20px -8px rgba(245,158,11,.55); }
.btn-soft { background: #fff; border-color: var(--line); color: var(--ink-2); }
.btn-soft:hover { border-color: var(--brand); color: var(--brand-2); }
.btn-ghost { background: transparent; box-shadow: none; color: var(--muted); }
.btn-ghost:hover { background: #f1f5f9; color: var(--ink); box-shadow: none; }
.btn-danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn-danger:hover { box-shadow: 0 8px 20px -8px rgba(225,29,72,.5); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-lg { padding: 12px 18px; font-size: 14.5px; }
.btn-block { width: 100%; justify-content: center; }
.loading-btn { position: relative; color: transparent !important; }
.loading-btn::after {
  content: ""; position: absolute; inset: 0; margin: auto;
  width: 16px; height: 16px; border: 2px solid rgba(0,0,0,.25);
  border-top-color: #3b2503; border-radius: 50%; animation: spin .7s linear infinite;
}
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; color: var(--muted); transition: all .15s;
}
.icon-btn:hover { background: #f1f5f9; color: var(--ink); }
.icon-btn.danger:hover { background: var(--bad-soft); color: var(--bad); }

/* ---------- app layout ---------- */
#app-root { display: flex; min-height: 100vh; }

.sidebar {
  width: 246px; flex: none; position: sticky; top: 0; height: 100vh;
  background: linear-gradient(180deg, var(--dark) 0%, var(--dark-2) 55%, #0d1626 100%);
  color: #cbd5e1; display: flex; flex-direction: column; z-index: 50;
}
.sb-brand { display: flex; align-items: center; gap: 11px; padding: 20px 18px 18px; border-bottom: 1px solid rgba(255,255,255,.06); }
.logo-badge {
  width: 42px; height: 42px; border-radius: 12px; flex: none;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  color: #1c1003; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 16px -6px rgba(245,158,11,.6);
}
.sb-company { font-weight: 800; letter-spacing: .14em; color: #fff; font-size: 15px; }
.sb-tag { font-size: 11px; color: #7d8ba1; letter-spacing: .04em; }
.sb-nav { padding: 14px 10px; display: flex; flex-direction: column; gap: 3px; flex: 1; overflow-y: auto; }
.sb-link {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px;
  border-radius: 10px; color: #aab6c8; font-weight: 500; font-size: 13.5px;
  cursor: pointer; text-decoration: none; transition: all .15s; border: 1px solid transparent;
}
.sb-link:hover { background: rgba(255,255,255,.05); color: #fff; }
.sb-link.on {
  background: linear-gradient(90deg, rgba(245,158,11,.16), rgba(245,158,11,.05));
  color: #fcd34d; border-color: rgba(245,158,11,.25); font-weight: 600;
}
.sb-foot { padding: 12px; border-top: 1px solid rgba(255,255,255,.06); }
.sb-user { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: rgba(255,255,255,.04); }
.av {
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  background: linear-gradient(135deg, #fbbf24, #d97706); color: #241503;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
}
.av.sm { width: 28px; height: 28px; font-size: 11px; }
.sb-user-txt { flex: 1; min-width: 0; }
.sb-user-name { color: #fff; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-user-role { color: #7d8ba1; font-size: 11px; }
.sb-user .icon-btn { color: #7d8ba1; }
.sb-user .icon-btn:hover { background: rgba(225,29,72,.15); color: #fb7185; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px; padding: 10px 22px;
  background: rgba(255,255,255,.86); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.menu-btn { display: none; }
.topbar-sync { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(5,150,105,.15); }
.topbar-sync.syncing .sync-dot { background: var(--warn); animation: pulse 1s infinite; }
.topbar-sync.offline .sync-dot { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.topbar-clock { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

.content { padding: 22px; max-width: 1500px; width: 100%; margin: 0 auto; }

.sb-overlay { display: none; position: fixed; inset: 0; background: rgba(11,18,32,.5); z-index: 45; }
body.sb-open .sb-overlay { display: block; }

/* ---------- page head & toolbars ---------- */
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.pagehead h2 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.page-sub { color: var(--muted); font-size: 13px; margin-top: 3px; max-width: 720px; }
.crumbs { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted-2); font-weight: 600; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .05em; }
.crumb { display: inline-flex; align-items: center; gap: 5px; }
.crumb-sep { color: #cbd5e1; }
.pagehead-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- panels & cards ---------- */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 9px; padding: 13px 18px; border-bottom: 1px solid var(--line-2); }
.panel-head h4 { font-size: 13.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
.panel-head .ic { color: var(--brand-2); }
.panel-count { margin-left: auto; font-size: 11.5px; color: var(--muted); background: var(--line-2); padding: 3px 9px; border-radius: 99px; font-weight: 600; }
.panel-body { padding: 16px 18px; }

/* ---------- KPI cards ---------- */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px 17px; position: relative; overflow: hidden;
}
.kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3.5px; background: var(--line); }
.kpi.ok::before { background: var(--ok); }
.kpi.warn::before { background: var(--warn); }
.kpi.bad::before { background: var(--bad); }
.kpi.brand::before { background: var(--brand); }
.kpi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.kpi-ic {
  width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
  background: var(--brand-soft); color: var(--brand-2);
}
.kpi.ok .kpi-ic { background: var(--ok-soft); color: var(--ok); }
.kpi.warn .kpi-ic { background: var(--warn-soft); color: var(--warn); }
.kpi.bad .kpi-ic { background: var(--bad-soft); color: var(--bad); }
.kpi-tag { font-size: 10.5px; font-weight: 700; color: var(--muted); background: var(--line-2); border-radius: 99px; padding: 3px 8px; }
.kpi-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
.kpi-value { font-size: 20px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 11.5px; color: var(--muted-2); margin-top: 3px; }

.summary-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.sum-item {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 16px; box-shadow: var(--shadow); min-width: 140px;
}
.sum-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.sum-value { font-size: 15.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sum-value.warn { color: var(--warn); } .sum-value.bad { color: var(--bad); } .sum-value.ok { color: var(--ok); }

/* ---------- dashboard ---------- */
.dash-greet { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.dash-hello { font-size: 17px; font-weight: 600; }
.dash-date { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.quick-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.chart-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
.chart-head { margin-bottom: 10px; }
.chart-title { font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.chart-body { position: relative; height: 280px; }
.chart-fallback { height: auto !important; display: flex; flex-direction: column; gap: 8px; }
.fb-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.fb-label { width: 220px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.fb-bar-wrap { flex: 1; background: var(--line-2); border-radius: 6px; height: 14px; overflow: hidden; }
.fb-bar { height: 100%; background: linear-gradient(90deg, #fbbf24, #d97706); border-radius: 6px; }
.fb-val { width: 130px; flex: none; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }
.chart-note, .chart-nodata { font-size: 11.5px; color: var(--muted-2); margin-top: 8px; }

.dash-cols { display: grid; grid-template-columns: 1.05fr 1fr; gap: 14px; }

/* alerts & activity */
.alert-list { display: flex; flex-direction: column; gap: 8px; }
.alert-item {
  display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-2); background: #fbfcfe;
}
.alert-item.bad .alert-ic { color: var(--bad); background: var(--bad-soft); }
.alert-item.warn .alert-ic { color: var(--warn); background: var(--warn-soft); }
.alert-ic { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: none; margin-top: 1px; }
.alert-title { font-size: 12.5px; font-weight: 700; }
.alert-msg { font-size: 12px; color: var(--muted); }
.activity-list { display: flex; flex-direction: column; gap: 10px; }
.activity-item { display: flex; gap: 10px; align-items: flex-start; }
.activity-main { min-width: 0; font-size: 12.5px; }
.act-entity { color: var(--brand-2); font-weight: 600; }
.act-ref { background: var(--line-2); padding: 1px 7px; border-radius: 6px; font-weight: 600; font-size: 11px; }
.activity-sub { color: var(--muted); font-size: 11.5px; margin-top: 1px; }

/* ---------- filter bar ---------- */
.filterbar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px 12px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 16px;
}
.fb-item { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fb-item > label, .fb-item label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.fb-grow { grid-column: span 2; }
.fb-actions { justify-content: flex-end; flex-direction: row; align-items: flex-end; }
.searchbox { position: relative; display: flex; align-items: center; }
.searchbox .ic { position: absolute; left: 10px; color: var(--muted-2); pointer-events: none; }
.searchbox input { padding-left: 32px; }
.checkline { display: inline-flex !important; align-items: center; gap: 7px; font-size: 13px !important; text-transform: none !important; letter-spacing: 0 !important; color: var(--ink-2) !important; cursor: pointer; }

/* ---------- inputs ---------- */
.input {
  width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 8px 11px; background: #fff; outline: none; transition: all .15s; min-height: 38px;
}
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(245,158,11,.15); }
.input[readonly] { background: var(--line-2); color: var(--ink-2); font-weight: 600; }
.input-row { display: flex; gap: 8px; align-items: center; }
textarea.input { resize: vertical; }
.mini-select { border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; font-size: 12px; background: #fff; }

/* ---------- forms ---------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.span2 { grid-column: span 2; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.req-star { color: var(--bad); }
.field-hint { font-size: 11px; color: var(--muted-2); min-height: 14px; }
.hint-err { color: var(--bad) !important; font-weight: 600; }
.field.invalid .input, .sselect.error .sselect-box { border-color: var(--bad); box-shadow: 0 0 0 3px rgba(225,29,72,.12); }
.sselect-err { font-size: 11px; color: var(--bad); font-weight: 600; }

/* ---------- SEARCH-AS-YOU-GO SELECT ---------- */
.sselect { position: relative; }
.sselect-box {
  position: relative; display: flex; align-items: center;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: #fff; min-height: 38px; transition: all .15s;
}
.sselect.open .sselect-box { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(245,158,11,.15); }
.sselect.disabled .sselect-box { background: var(--line-2); opacity: .75; }
.sselect.disabled input { cursor: not-allowed; }
.sselect-ic { position: absolute; left: 10px; color: var(--muted-2); display: flex; pointer-events: none; }
.sselect-input {
  width: 100%; border: none; outline: none; background: transparent;
  padding: 8px 56px 8px 32px; font-size: 13.5px; min-height: 36px;
}
.sselect-clear {
  position: absolute; right: 26px; border: none; background: transparent;
  color: var(--muted-2); display: none; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
}
.sselect-clear:hover { background: var(--line-2); color: var(--ink); }
.sselect-arrow { position: absolute; right: 9px; color: var(--muted-2); display: flex; pointer-events: none; transition: transform .15s; }
.sselect.open .sselect-arrow { transform: rotate(180deg); }
.sselect-pop {
  position: absolute; top: calc(100% + 5px); left: 0; right: 0; z-index: 300;
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg); max-height: 280px; overflow-y: auto; padding: 5px;
  display: none;
}
.sselect.open .sselect-pop { display: block; animation: pop .12s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.sselect-item {
  padding: 8px 10px; border-radius: 7px; cursor: pointer; display: flex;
  flex-direction: column; gap: 2px; position: relative;
}
.sselect-item:hover, .sselect-item.sel { background: var(--brand-soft); }
.sselect-item.sel::after { content: "✓"; position: absolute; right: 10px; top: 9px; color: var(--brand-2); font-weight: 800; font-size: 12px; }
.sselect-item-main { font-size: 13px; font-weight: 600; color: var(--ink); padding-right: 24px; }
.sselect-item-main mark { background: #fde68a; color: inherit; border-radius: 3px; }
.sselect-item-sub { font-size: 11px; color: var(--muted); padding-right: 24px; }
.sselect-item-right { position: absolute; right: 10px; top: 10px; font-size: 11px; color: var(--muted); font-weight: 600; }
.sselect-badge { background: var(--bad-soft); color: var(--bad); font-size: 9.5px; font-weight: 800; border-radius: 99px; padding: 1px 7px; margin-left: 5px; vertical-align: middle; }
.sselect-empty { padding: 14px 10px; color: var(--muted-2); font-size: 12.5px; display: flex; gap: 8px; align-items: center; justify-content: center; }
.sselect-more { padding: 8px 10px; font-size: 11px; color: var(--muted-2); border-top: 1px dashed var(--line); margin-top: 4px; }

/* ---------- tables ---------- */
.dtable-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.dtable-count { font-size: 12px; color: var(--muted); font-weight: 600; }
.dtable-search { position: relative; display: flex; align-items: center; margin-left: auto; }
.dtable-search .ic { position: absolute; left: 9px; color: var(--muted-2); }
.dtable-search input {
  border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 7px 10px 7px 30px;
  font-size: 12.5px; width: 240px; outline: none; background: #fff;
}
.dtable-search input:focus { border-color: var(--brand); }
.dtable-scroll { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 12.8px; }
.table th {
  text-align: left; padding: 10px 12px; background: #f8fafc; color: var(--muted);
  font-size: 10.8px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0;
}
.table th.sortable { cursor: pointer; user-select: none; }
.table th.sortable:hover { color: var(--brand-2); }
.th-in { display: inline-flex; align-items: center; gap: 4px; }
.th-sort { opacity: .45; display: inline-flex; }
.table th.asc .th-sort { transform: rotate(180deg); opacity: 1; }
.table td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tbody tr:hover { background: #fbfdff; }
.table tbody tr:last-child td { border-bottom: none; }
.table .al-right, .table th.al-right { text-align: right; }
.table tfoot td { background: #f8fafc; font-size: 12.5px; border-top: 2px solid var(--line); padding: 10px 12px; }
.row-acts { display: flex; gap: 4px; justify-content: flex-end; }
.dtable-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; flex-wrap: wrap; gap: 10px; }
.dtable-pagesize { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.pager { display: flex; gap: 4px; }
.pager-btn {
  min-width: 28px; height: 28px; border: 1px solid var(--line); background: #fff;
  border-radius: 7px; font-size: 12px; color: var(--ink-2); display: inline-flex;
  align-items: center; justify-content: center; padding: 0 6px; font-weight: 600;
}
.pager-btn:hover:not(:disabled) { border-color: var(--brand); color: var(--brand-2); }
.pager-btn.on { background: var(--brand); border-color: var(--brand); color: #3b2503; }
.pager-btn:disabled { opacity: .4; cursor: default; }
.pager-dots { color: var(--muted-2); align-self: center; padding: 0 2px; }

/* ---------- pills & progress ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px; font-size: 10.8px; font-weight: 700;
  padding: 3px 9px; border-radius: 99px; white-space: nowrap; letter-spacing: .01em;
}
.pill.ok { background: var(--ok-soft); color: #047857; }
.pill.warn { background: var(--warn-soft); color: #b45309; }
.pill.bad { background: var(--bad-soft); color: #be123c; }
.pill.info { background: var(--info-soft); color: #0369a1; }
.pill.muted { background: #eef2f7; color: #64748b; }
.pill.brand { background: var(--brand-soft); color: #92400e; }

.pbar { height: 7px; background: var(--line-2); border-radius: 99px; overflow: hidden; min-width: 60px; }
.pbar-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
.pbar-fill.ok { background: linear-gradient(90deg, #10b981, #059669); }
.pbar-fill.warn { background: linear-gradient(90deg, #fbbf24, #d97706); }
.pbar-fill.bad { background: linear-gradient(90deg, #fb7185, #e11d48); }
.pbar-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; min-width: 110px; }
.pbar-pct { font-size: 11px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 42px; text-align: left; }

/* ---------- tabs ---------- */
.master-tabs, .type-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.mtab {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px;
  border-radius: 99px; border: 1px solid var(--line); background: #fff;
  font-size: 12.5px; font-weight: 600; color: var(--muted); transition: all .15s;
}
.mtab:hover { border-color: var(--brand); color: var(--brand-2); }
.mtab.on { background: var(--ink); border-color: var(--ink); color: #fcd34d; }

/* ---------- notices ---------- */
.notice {
  display: flex; gap: 9px; align-items: flex-start; padding: 10px 14px;
  border-radius: var(--radius-sm); font-size: 12.5px; margin-bottom: 12px; border: 1px solid transparent;
}
.notice .ic { flex: none; margin-top: 2px; }
.notice.info { background: var(--info-soft); color: #075985; border-color: #bae6fd; }
.notice.warn { background: var(--warn-soft); color: #92400e; border-color: #fde68a; }
.notice.danger { background: var(--bad-soft); color: #9f1239; border-color: #fecdd3; }

/* ---------- budget info (expense form) ---------- */
.budget-info {
  grid-column: span 2; background: #fbfcfe; border: 1px dashed var(--line);
  border-radius: var(--radius-sm); padding: 10px 14px; display: grid;
  grid-template-columns: 1fr 1fr; gap: 5px 18px;
}
.budget-info:empty { display: none; }
.bi-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
.bi-row span { color: var(--muted); }
.bi-rem { grid-column: span 2; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 3px; }
.bi-rem b { color: var(--ok); font-size: 13px; }
.bi-rem b.neg { color: var(--bad); }
.override-box { border: 1px dashed #fca5a5; background: #fff7f8; border-radius: var(--radius-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

/* ---------- report picker ---------- */
.report-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 16px; }
.rp {
  display: flex; align-items: center; gap: 11px; text-align: left; padding: 12px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm);
  box-shadow: var(--shadow); font-weight: 600; font-size: 13px; color: var(--ink-2); transition: all .15s;
}
.rp:hover { border-color: var(--brand); transform: translateY(-1px); }
.rp.on { border-color: var(--brand); background: var(--brand-soft); color: #92400e; box-shadow: 0 8px 20px -10px rgba(245,158,11,.5); }
.rp-ic { width: 34px; height: 34px; border-radius: 9px; background: var(--line-2); color: var(--muted); display: flex; align-items: center; justify-content: center; flex: none; }
.rp.on .rp-ic { background: #fff; color: var(--brand-2); }
.rep-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
.rep-summary .kpi { padding: 14px 16px; }
.rep-summary .kpi-value { font-size: 17px; }

/* ---------- settings ---------- */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.conn-status { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--radius-sm); margin-bottom: 14px; font-size: 13px; border: 1px solid; }
.conn-status .ic { flex: none; margin-top: 2px; }
.conn-status.live { background: var(--ok-soft); border-color: #a7f3d0; color: #065f46; }
.conn-status.demo { background: var(--info-soft); border-color: #bae6fd; color: #075985; }
.conn-sub { font-size: 11.5px; opacity: .85; margin-top: 2px; }
.conn-help { margin-top: 12px; border: 1px dashed var(--line); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12.5px; }
.conn-help summary { cursor: pointer; font-weight: 700; color: var(--brand-2); user-select: none; }
.conn-help ol { margin: 8px 0 0 18px; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; line-height: 1.45; }
.who { display: flex; align-items: center; gap: 9px; }

/* ---------- modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 500; background: rgba(11,18,32,.55);
  backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto; animation: fade .15s ease;
}
.modal-backdrop.closing { opacity: 0; transition: opacity .15s; }
@keyframes fade { from { opacity: 0; } }
.modal {
  background: #fff; border-radius: 16px; width: 100%; max-width: 620px;
  box-shadow: var(--shadow-lg); animation: rise .18s ease; overflow: hidden;
}
.modal-wide { max-width: 960px; }
.modal-tall .modal-body { max-height: 70vh; overflow-y: auto; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 17px 20px; border-bottom: 1px solid var(--line-2); }
.modal-head h3 { font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
.modal-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.modal-body { padding: 18px 20px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line-2); background: #fbfcfe; }

.confirm-wrap { display: flex; gap: 14px; align-items: flex-start; }
.confirm-ic { width: 46px; height: 46px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; }
.confirm-ic.danger { background: var(--bad-soft); color: var(--bad); }
.confirm-ic.info { background: var(--info-soft); color: var(--info); }
.confirm-title { font-weight: 700; font-size: 14.5px; margin-bottom: 3px; }
.confirm-msg { color: var(--muted); font-size: 13px; }

/* ---------- toast ---------- */
#toast-root { position: fixed; right: 18px; bottom: 18px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; max-width: 400px; }
.toast {
  display: flex; align-items: flex-start; gap: 9px; background: var(--dark); color: #e2e8f0;
  padding: 11px 12px 11px 14px; border-radius: 12px; box-shadow: var(--shadow-lg);
  font-size: 13px; animation: toastIn .25s ease; border-left: 3px solid var(--brand);
}
.toast.success { border-left-color: var(--ok); }
.toast.error { border-left-color: var(--bad); }
.toast.warn { border-left-color: var(--warn); }
.toast.out { opacity: 0; transform: translateX(30px); transition: all .3s; }
@keyframes toastIn { from { opacity: 0; transform: translateX(30px); } }
.toast-ic { color: #fcd34d; flex: none; margin-top: 1px; }
.toast.success .toast-ic { color: #34d399; }
.toast.error .toast-ic { color: #fb7185; }
.toast-body { flex: 1; min-width: 0; }
.toast-x { background: transparent; border: none; color: #7d8ba1; padding: 2px; }
.toast-x:hover { color: #fff; }

/* ---------- print root (hidden on screen, shown when printing) ---------- */
#print-root { display: none; }

/* ---------- empty & loading ---------- */
.empty { text-align: center; padding: 44px 20px; color: var(--muted); }
.empty-ic { width: 58px; height: 58px; margin: 0 auto 12px; border-radius: 16px; background: var(--line-2); color: var(--muted-2); display: flex; align-items: center; justify-content: center; }
.empty-title { font-weight: 700; color: var(--ink-2); margin-bottom: 3px; }
.empty-msg { font-size: 12.5px; }
.loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 60px 20px; color: var(--muted); }
.spinner { width: 34px; height: 34px; border: 3px solid var(--line-2); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }

/* ---------- login ---------- */
#login-screen {
  position: fixed; inset: 0; z-index: 2000; display: flex; background: #fff;
  animation: fade .3s ease;
}
#login-screen.gone { opacity: 0; transition: opacity .45s; pointer-events: none; }
.login-panel { width: 460px; max-width: 94vw; padding: 44px 46px; display: flex; flex-direction: column; background: #fff; }
.login-brand { display: flex; align-items: center; gap: 13px; margin-bottom: 30px; }
.login-company { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
.login-sub { font-size: 12px; color: var(--muted); }
.login-fields { display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px; }
.login-label { font-size: 12px; font-weight: 700; color: var(--ink-2); margin-top: 8px; }
.pin-wrap { position: relative; }
.pin-wrap .input { padding-right: 42px; }
.pin-wrap .icon-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.login-hint { font-size: 11.5px; color: var(--muted); background: var(--line-2); padding: 8px 11px; border-radius: 8px; }
.login-err { color: var(--bad); font-size: 12.5px; font-weight: 600; margin-top: 10px; min-height: 16px; }
.login-foot { margin-top: auto; padding-top: 18px; }
.mode-chip {
  display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700;
  padding: 7px 11px; border-radius: 99px;
}
.mode-chip.demo { background: var(--info-soft); color: #075985; }
.mode-chip.live { background: var(--ok-soft); color: #065f46; }
.login-side {
  flex: 1; background: linear-gradient(150deg, var(--dark) 0%, #14223d 60%, #1d3052 100%);
  color: #e2e8f0; display: flex; align-items: center; justify-content: center; padding: 40px;
  position: relative; overflow: hidden;
}
.login-side::before {
  content: ""; position: absolute; width: 560px; height: 560px; border-radius: 50%;
  border: 1px solid rgba(245,158,11,.18); top: -180px; right: -140px;
}
.login-side::after {
  content: ""; position: absolute; width: 340px; height: 340px; border-radius: 50%;
  border: 1px solid rgba(245,158,11,.14); bottom: -120px; left: -80px;
}
.login-side-inner { max-width: 560px; position: relative; z-index: 1; }
.login-big {
  width: 78px; height: 78px; border-radius: 22px; margin-bottom: 24px;
  background: linear-gradient(135deg, #fbbf24, #d97706); color: #1c1003;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 20px 50px -18px rgba(245,158,11,.55);
}
.login-side h1 { font-size: 34px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; margin-bottom: 14px; }
.login-side h1 span { color: #fcd34d; }
.login-side p { color: #94a3b8; font-size: 14.5px; margin-bottom: 22px; max-width: 480px; }
.login-side ul { list-style: none; display: flex; flex-direction: column; gap: 11px; }
.login-side li { display: flex; gap: 10px; align-items: center; color: #cbd5e1; font-size: 13.5px; }
.login-side li .ic { color: #34d399; flex: none; }

/* ---------- print preview (on screen) ---------- */
.print-preview { background: #e8edf3; padding: 22px; border-radius: 12px; max-height: 66vh; overflow: auto; }
.print-doc { background: #fff; max-width: 820px; margin: 0 auto; padding: 34px 38px; box-shadow: var(--shadow-lg); color: #111; }
.print-head { display: flex; justify-content: space-between; gap: 20px; border-bottom: 2.5px solid #f59e0b; padding-bottom: 14px; margin-bottom: 16px; }
.print-brand { display: flex; gap: 12px; align-items: flex-start; }
.print-logo { width: 42px; height: 42px; border-radius: 10px; background: #f59e0b; color: #1c1003; display: flex; align-items: center; justify-content: center; flex: none; }
.print-company { font-size: 17px; font-weight: 800; letter-spacing: .01em; }
.print-addr { font-size: 10.5px; color: #555; max-width: 420px; }
.print-meta { text-align: right; }
.print-title { font-size: 15px; font-weight: 800; }
.print-sub { font-size: 10.5px; color: #666; margin-top: 3px; }
.print-body { font-size: 12px; }
.print-body h4 { font-size: 13px; margin: 14px 0 7px; color: #92400e; }
.print-foot { margin-top: 18px; padding-top: 10px; border-top: 1px solid #ddd; font-size: 9.5px; color: #999; text-align: center; }

/* ---------- print tables ---------- */
.ptable { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
.ptable th { background: #f59e0b; color: #241503; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 7px 9px; text-align: left; border: 1px solid #e5d3a8; }
.ptable td { padding: 6px 9px; border: 1px solid #e2e8f0; font-size: 11px; }
.ptable tr:nth-child(even) td { background: #fafbfd; }
.ptable tfoot td { background: #fef9ec; font-weight: 700; border: 1px solid #e5d3a8; }
.ptable .ar, .ptable th.ar { text-align: right; }
.p-cards { margin-bottom: 8px; }
.p-cards .ptable th { background: #334155; color: #fff; border-color: #334155; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .charts-grid { grid-template-columns: 1fr; }
  .dash-cols { grid-template-columns: 1fr; }
  .settings-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .25s ease; box-shadow: var(--shadow-lg); }
  body.sb-open .sidebar { transform: translateX(0); }
  .menu-btn { display: inline-flex; }
  .content { padding: 16px; }
  .login-side { display: none; }
  .login-panel { margin: auto; }
  .form-grid { grid-template-columns: 1fr; }
  .span2 { grid-column: span 1; }
  .budget-info { grid-template-columns: 1fr; }
  .bi-rem { grid-column: span 1; }
  .dtable-search input { width: 150px; }
  .fb-grow { grid-column: span 1; }
}
@media print {
  body { background: #fff; }
  #app-root, #login-screen, #toast-root, .modal-backdrop, #print-root .no-print { display: none !important; }
  #print-root { display: block !important; }
}

</style>
  <style media="print">
/* ============================================================
   NEXORA CMS — print stylesheet
   Only the report inside #print-root is printed.
   ============================================================ */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #fff !important; margin: 0; font-family: "Inter", system-ui, sans-serif; font-size: 12px; color: #111; }

  #app-root, #login-screen, #toast-root, .modal-backdrop, noscript {
    display: none !important;
  }
  #print-root { display: block !important; }

  .print-doc { max-width: 100%; padding: 6px 2px; box-shadow: none; }
  .print-head { border-bottom: 2.5px solid #f59e0b; }
  .ptable th { background: #f59e0b !important; color: #241503 !important; }
  .ptable tr:nth-child(even) td { background: #fafbfd !important; }
  .ptable tfoot td { background: #fef9ec !important; }

  .print-foot { position: fixed; bottom: 0; left: 0; right: 0; }
  @page { margin: 12mm 10mm; }
}

</style>
</head>

/* ===== js/format.js ===== */
/* ============================================================
   NEXORA CMS — formatting & small utilities (pure, testable)
   ============================================================ */
(function (root) {
  "use strict";

  const CURRENCY = () => (root.APP_CONFIG && root.APP_CONFIG.COMPANY.currency) || "MK";

  function num(v) {
    const n = typeof v === "string" ? parseFloat(String(v).replace(/[,\s]/g, "")) : Number(v);
    return isFinite(n) ? n : 0;
  }

  /** Format money: MK 1,234,567.89 */
  function money(v, opts) {
    const o = opts || {};
    const sign = o.credit ? "" : num(v) < 0 ? "-" : "";
    const abs = Math.abs(num(v));
    const s = abs.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return `${sign}${CURRENCY()} ${s}`;
  }

  function qty(v, dp) {
    const n = num(v);
    const d = dp === undefined ? 2 : dp;
    return n.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: d });
  }

  function pct(v, dp) {
    return `${num(v).toFixed(dp === undefined ? 1 : dp)}%`;
  }

  function todayISO() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  }

  function nowStamp() {
    return new Date().toISOString().replace("T", " ").slice(0, 19);
  }

  function parseISO(v) {
    if (!v) return null;
    const s = String(v).slice(0, 10);
    const p = s.split("-").map(Number);
    if (p.length !== 3 || p.some(isNaN)) return null;
    return new Date(p[0], p[1] - 1, p[2]);
  }

  function fmtDate(v) {
    const d = parseISO(v);
    if (!d) return v ? String(v) : "—";
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  }

  function fmtDateTime(v) {
    if (!v) return "—";
    const s = String(v).replace("T", " ").slice(0, 16);
    return s;
  }

  function monthKey(v) {
    return v ? String(v).slice(0, 7) : "";
  }

  function fmtMonth(ym) {
    if (!ym) return "—";
    const p = String(ym).split("-");
    const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${names[Number(p[1]) - 1]} ${p[0]}`;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function csvCell(v) {
    const s = v == null ? "" : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function toCSV(columns, rows) {
    const lines = [columns.map(c => csvCell(c.label)).join(",")];
    rows.forEach(r => {
      lines.push(columns.map(c => csvCell(c.value ? c.value(r) : r[c.key])).join(","));
    });
    return "\uFEFF" + lines.join("\r\n"); // BOM so Excel opens UTF-8 nicely
  }

  function downloadFile(filename, content, mime) {
    const blob = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }

  function exportCSV(filename, columns, rows) {
    downloadFile(filename, toCSV(columns, rows), "text/csv;charset=utf-8");
  }

  function exportJSON(filename, obj) {
    downloadFile(filename, JSON.stringify(obj, null, 2), "application/json");
  }

  function uid(prefix) {
    const t = Date.now().toString(36);
    const r = Math.random().toString(36).slice(2, 7);
    return `${prefix || "ID"}-${t}${r}`.toUpperCase();
  }

  function debounce(fn, ms) {
    let t = null;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), ms || 250);
    };
  }

  function sum(arr, f) {
    return (arr || []).reduce((a, b) => a + num(f ? f(b) : b), 0);
  }

  function groupBy(arr, keyFn) {
    const m = new Map();
    (arr || []).forEach(x => {
      const k = keyFn(x);
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(x);
    });
    return m;
  }

  function sortBy(arr, keyFn, dir) {
    const d = dir === "desc" ? -1 : 1;
    return (arr || []).slice().sort((a, b) => {
      const va = keyFn(a), vb = keyFn(b);
      if (va < vb) return -1 * d;
      if (va > vb) return 1 * d;
      return 0;
    });
  }

  function byId(list, id) {
    if (!list || !id) return null;
    return list.find(x => String(x.id) === String(id)) || null;
  }

  function nameOf(list, id, fallback) {
    const it = byId(list, id);
    return it ? it.name : (fallback || "—");
  }

  /** search-as-you-go match: all terms must appear in the text */
  function matchSearch(query, text) {
    if (!query) return true;
    const q = String(query).toLowerCase().trim();
    if (!q) return true;
    const parts = q.split(/\s+/);
    const hay = String(text || "").toLowerCase();
    return parts.every(p => hay.includes(p));
  }

  function initials(name) {
    return String(name || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  }

  function pad2(n) { return String(n).padStart(2, "0"); }

  function hash(s) {
    let h = 5381;
    const str = String(s);
    for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
    return "h" + h.toString(36);
  }

  function isSameDay(a, b) {
    return String(a).slice(0, 10) === String(b).slice(0, 10);
  }

  root.Fmt = { num, money, qty, pct, todayISO, nowStamp, parseISO, fmtDate, fmtDateTime, monthKey, fmtMonth, esc, toCSV, csvCell, downloadFile, exportCSV, exportJSON, uid, debounce, sum, groupBy, sortBy, byId, nameOf, matchSearch, initials, pad2, hash, isSameDay };
})(typeof window !== "undefined" ? window : globalThis);

    const d = PATHS[name] || PATHS.box;
    return `<svg class="ic" width="${size || 18}" height="${size || 18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
  }

  /* ---------- toast ---------- */
  function toast(message, type, opts) {
    const o = opts || {};
    let wrap = document.getElementById("toast-root");
    if (!wrap) {
      wrap = document.createElement("div");
      wrap.id = "toast-root";
      document.body.appendChild(wrap);
    }
    const t = document.createElement("div");
    t.className = "toast " + (type || "info");
    const ic = type === "error" ? "warn" : type === "success" ? "check" : "info";
    t.innerHTML = `<span class="toast-ic">${icon(ic, 16)}</span><div class="toast-body">${o.html ? message : esc(message)}</div>${o.closable === false ? "" : `<button class="toast-x" aria-label="Close">${icon("close", 12)}</button>`}`;
    wrap.appendChild(t);
    const kill = () => { t.classList.add("out"); setTimeout(() => t.remove(), 300); };
    t.querySelector(".toast-x")?.addEventListener("click", kill);
    setTimeout(kill, o.ms || 4200);
  }

  /* ---------- modal ---------- */
  function openModal(html, opts) {
    const o = opts || {};
    const existing = document.querySelector(".modal-backdrop");
    if (existing) existing.remove();
    const b = document.createElement("div");
    b.className = "modal-backdrop";
    b.innerHTML = `<div class="modal ${o.wide ? "modal-wide" : ""} ${o.tall ? "modal-tall" : ""}" role="dialog" aria-modal="true">
        <div class="modal-head">
          <div>
            <h3>${o.title ? esc(o.title) : ""}</h3>
            ${o.subtitle ? `<div class="modal-sub">${esc(o.subtitle)}</div>` : ""}

          <button class="icon-btn modal-close" aria-label="Close">${icon("close", 18)}</button>
        </div>
        <div class="modal-body">${html}</div>
        ${o.footer === false ? "" : `<div class="modal-foot">${o.footer || ""}</div>`}
      </div>`;
    document.body.appendChild(b);
    b.addEventListener("mousedown", e => { if (e.target === b && o.closable !== false) closeModal(); });
    b.querySelector(".modal-close")?.addEventListener("click", () => { if (o.closable !== false) closeModal(); });
    if (o.onEsc !== false) {
      const h = e => { if (e.key === "Escape" && o.closable !== false) { closeModal(); document.removeEventListener("keydown", h); } };

    setTimeout(() => first?.focus(), 60);

  function confirmDialog(opts) {

      openModal(
        `<div class="confirm-wrap">
           <div class="confirm-ic ${o.danger ? "danger" : "info"}">${icon(o.danger ? "warn" : "info", 26)}</div>
           <div class="confirm-txt">

      b.addEventListener("click", e => {

        if (act === "no") { closeModal(); resolve(false); }
      });
    });
  }

  /* ---------- page toolbar ---------- */
  function pageToolbar(title, sub, buttons, extras) {
    const html = `
      <div class="pagehead">
        <div class="pagehead-titles">

          <h2>${esc(title)}</h2>
          ${sub ? `<p class="page-sub">${sub}</p>` : ""}
        </div>
        <div class="pagehead-actions">${(buttons || []).map(b => b).join("")}</div>
      </div>`;
    return html;
  }

  const BTN = {
    home: `<button class="btn btn-soft" data-act="home" title="Go to Home">${icon("home", 15)} Home</button>`,
    back: `<button class="btn btn-soft" data-act="back" title="Go back">${icon("back", 15)} Back</button>`,
    refresh: `<button class="btn btn-soft" data-act="refresh" title="Refresh data from Google Sheets">${icon("refresh", 15)} Refresh</button>`,
    print: `<button class="btn btn-soft" data-act="print" title="Print / save as PDF">${icon("print", 15)} Print</button>`,
    export: `<button class="btn btn-soft" data-act="export" title="Export to CSV (Excel)">${icon("export", 15)} Export</button>`,
    preview: `<button class="btn btn-soft" data-act="preview" title="Print preview">${icon("eye", 15)} Preview</button>`,
    filters: `<button class="btn btn-soft" data-act="filters" title="Show / hide filters">${icon("filter", 15)} Filters</button>`,
    add: label => `<button class="btn btn-primary" data-act="add">${icon("plus", 15)} ${esc(label || "Add New")}</button>`,
    save: `<button class="btn btn-primary" data-act="save">${icon("save", 15)} Save</button>`,
    cancel: `<button class="btn btn-ghost" data-act="cancel">${icon("close", 15)} Cancel</button>`,
  };

  /* ---------- status pills ---------- */
  const PILL = {
    Active: "ok", Approved: "ok", Paid: "ok", Received: "ok", Completed: "info", Issued: "info",
    "In Progress": "info", Awarded: "info", "Partially Paid": "warn", "Partially Received": "warn",
    Open: "warn", Hold: "warn", "On Hold": "warn", Planning: "info", Unpaid: "bad", Overdue: "bad",
    Cancelled: "bad", Terminated: "bad", Inactive: "muted", Over: "bad", Near: "warn", OK: "ok",
    Admin: "brand", Supervisor: "info", Clerk: "muted", UnpaidBad: "bad",
  };

  function pill(text, tone) {
    const t = tone || PILL[text] || "muted";
    return `<span class="pill ${t}">${esc(text || "—")}</span>`;
  }

  function usagePill(p) {
    const v = Number(p);
    const t = v > 100.005 ? "Over" : v >= 80 ? "Near" : "OK";
    return pill(`${v.toFixed(1)}%`, PILL[t]);
  }

  /* ---------- misc DOM helpers ---------- */
  function el(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function emptyState(iconName, title, msg, actionHtml) {
    return `<div class="empty">
      <div class="empty-ic">${icon(iconName || "box", 30)}</div>
      <div class="empty-title">${esc(title || "Nothing here yet")}</div>
      <div class="empty-msg">${msg || ""}</div>
      ${actionHtml || ""}
    </div>`;
  }

  function spinner(label) {
    return `<div class="loading"><div class="spinner"></div><div>${esc(label || "Loading…")}</div></div>`;
  }

  function attachActions(container, handler) {
    container.addEventListener("click", e => {
      const btn = e.target.closest("[data-act]");
      if (btn) handler(btn.getAttribute("data-act"), btn, e);
    });
  }

  root.UI = { icon, toast, openModal, closeModal, modalEl, confirmDialog, pageToolbar, BTN, pill, usagePill, el, emptyState, spinner, attachActions, PATHS };
})(typeof window !== "undefined" ? window : globalThis);

  <script>
/* ===== js/components.js ===== */
/* ============================================================
   NEXORA CMS — reusable components
   • searchSelect  : search-as-you-go dropdown (used everywhere)
   • dataTable     : sortable/paginated table with CSV export
   • form helpers  : field rows, inputs, validation display
   ============================================================ */
(function (root) {
  "use strict";

  const { esc, debounce, matchSearch } = root.Fmt;
  const { icon, emptyState } = root.UI;

  /* ============================================================
     SEARCH-AS-YOU-GO SELECT
     options: {
       id, items:[{id,label,sub,right,badge,data}], value, placeholder,
       required, disabled, allowClear, onSelect(item), onChange(q),
       minChars, emptyText, highlight:true
     }
     ============================================================ */
  function searchSelect(opts) {
    const o = opts || {};
    const wrap = document.createElement("div");
    wrap.className = "sselect" + (o.required ? " req" : "") + (o.disabled ? " disabled" : "");
    wrap.innerHTML = `
      <div class="sselect-box">
        <span class="sselect-ic">${icon("search", 14)}</span>
        <input class="sselect-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="${esc(o.placeholder || "Type to search…")}" />
        <button class="sselect-clear" type="button" tabindex="-1" aria-label="Clear">${icon("close", 12)}</button>
        <span class="sselect-arrow">${icon("chevD", 14)}</span>
        <input type="hidden" class="sselect-value" />
      </div>
      <div class="sselect-pop" role="listbox"></div>
      <div class="sselect-err"></div>`;
    const input = wrap.querySelector(".sselect-input");
    const pop = wrap.querySelector(".sselect-pop");
    const valEl = wrap.querySelector(".sselect-value");
    const clearBtn = wrap.querySelector(".sselect-clear");
    let open = false, items = o.items || [], selected = null, selIndex = -1;

    /** relevance scoring: word-boundary matches first, deep substrings last */
    function searchScore(q, text) {
      const t = String(text || "").toLowerCase();
      const parts = String(q || "").toLowerCase().trim().split(/\s+/).filter(Boolean);
      let score = 0;
      for (const p of parts) {
        const idx = t.indexOf(p);
        if (idx < 0) return -1;
        const wordStart = idx === 0 || /[^a-z0-9]/.test(t[idx - 1]);
        score += wordStart ? idx * 0.01 : 100 + idx;
      }
      return score;
    }

    const itemsFor = q => items
      .map(it => ({ it, score: searchScore(q, it.label + " " + (it.sub || "") + " " + (it.code || "")) }))
      .filter(x => x.score >= 0)
      .sort((a, b) => a.score - b.score)
      .map(x => x.it);

    function setValue(item, silent) {
      selected = item || null;
      valEl.value = item ? item.id : "";
      if (!silent) input.value = item ? item.label : "";
      wrap.classList.remove("has-value");
      if (item) wrap.classList.add("has-value");
      updateClear();
      if (!silent && o.onSelect) o.onSelect(item);
    }

    function updateClear() {
      clearBtn.style.display = (selected || input.value) ? "flex" : "none";
    }

    function renderPopup(list, query) {
      pop.innerHTML = "";
      selIndex = -1;
      if (!open) return;
      if (!list.length) {
        const d = document.createElement("div");
        d.className = "sselect-empty";
        d.innerHTML = `${icon("search", 13)} ${esc(o.emptyText || "No matches found")}`;
        pop.appendChild(d);
        return;
      }
      const max = Math.min(list.length, 60);
      for (let i = 0; i < max; i++) {
        const it = list[i];
        const row = document.createElement("div");
        row.className = "sselect-item" + (selected && selected.id === it.id ? " sel" : "");
        row.setAttribute("role", "option");
        row.dataset.idx = i;
        const label = o.highlight === false ? esc(it.label) : highlightMatch(it.label, query);
        row.innerHTML = `
          <div class="sselect-item-main">${label} ${it.badge ? `<span class="sselect-badge">${esc(it.badge)}</span>` : ""}</div>
          ${it.sub ? `<div class="sselect-item-sub">${esc(it.sub)}</div>` : ""}
          ${it.right != null ? `<div class="sselect-item-right">${esc(it.right)}</div>` : ""}`;
        row.addEventListener("mousedown", ev => {
          ev.preventDefault();
          setValue(it);
          close();
        });
        pop.appendChild(row);
      }
      if (list.length > max) {
        const more = document.createElement("div");
        more.className = "sselect-more";
        more.textContent = `+ ${list.length - max} more — keep typing to narrow down`;
        pop.appendChild(more);
      }
    }

    function highlightMatch(label, query) {
      if (!query) return esc(label);
      const qs = String(query).toLowerCase().split(/\s+/).filter(Boolean);
      const out = esc(label).replace(/[<>&]/g, m => m); // esc already applied
      // rebuild with highlighting on the escaped string is complex; simple approach:
      let html = esc(label);
      qs.forEach(q => {
        const idx = html.toLowerCase().indexOf(q);
        if (idx >= 0) {
          html = html.slice(0, idx) + "<mark>" + html.slice(idx, idx + q.length) + "</mark>" + html.slice(idx + q.length);
        }
      });
      return html;
    }

    function openPopup() {
      open = true;
      wrap.classList.add("open");
      renderPopup(itemsFor(input.value), input.value);
    }
    function close() {
      open = false;
      wrap.classList.remove("open");
      if (selected) input.value = selected.label;
      else if (!input.value) setValue(null, true);
      updateClear();
    }

    input.addEventListener("focus", () => {
      if (!o.disabled) { openPopup(); if (o.onFocus) o.onFocus(); }
    });
    input.addEventListener("input", debounce(() => {
      if (!o.disabled) {
        open = true;
        wrap.classList.add("open");
        if (selected && input.value !== selected.label) setValue(null, true);
        renderPopup(itemsFor(input.value), input.value);
        if (o.onChange) o.onChange(input.value);
        updateClear();
      }
    }, 120));
    input.addEventListener("keydown", e => {
      if (o.disabled) return;
      const list = pop.querySelectorAll(".sselect-item");
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!open) { openPopup(); list.length && activate(pop.querySelectorAll(".sselect-item"), 0); }
        else if (list.length) activate(list, selIndex + 1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (list.length) activate(list, selIndex - 1);
      } else if (e.key === "Enter" || e.key === "Tab") {
        if (open && list.length && selIndex >= 0) {
          e.preventDefault();
          const it = itemsFor(input.value)[selIndex];
          if (it) setValue(it);
          close();
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (open && itemsFor(input.value).length === 1) { setValue(itemsFor(input.value)[0]); }
          close();
        }
      } else if (e.key === "Escape") {
        close();
        input.blur();
      }
    });
    input.addEventListener("blur", () => setTimeout(close, 150));
    document.addEventListener("click", ev => {
      if (open && !wrap.contains(ev.target)) close();
    });

    function activate(list, idx) {
      if (!list.length) return;
      selIndex = (idx + list.length) % list.length;
      list.forEach((n, i) => n.classList.toggle("sel", i === selIndex));
      list[selIndex]?.scrollIntoView({ block: "nearest" });
    }

    clearBtn.addEventListener("click", () => {
      setValue(null);
      input.value = "";
      wrap.classList.remove("error");
      if (o.disabled) return;
      open = true; wrap.classList.add("open");
      renderPopup(itemsFor(""), "");
      input.focus();
    });

    function setItems(nextItems, keepSelection) {
      items = nextItems || [];
      if (!keepSelection && selected && !items.some(i => i.id === selected.id)) setValue(null, true);
      else if (selected) input.value = selected.label;
      updateClear();
    }

    function setError(msg) {
      const err = wrap.querySelector(".sselect-err");
      if (msg) { wrap.classList.add("error"); err.innerHTML = msg; }
      else { wrap.classList.remove("error"); err.innerHTML = ""; }
    }

    if (o.value != null) {
      const found = items.find(i => String(i.id) === String(o.value));
      if (found) setValue(found, true);
      else if (o.value) { input.value = String(o.value); updateClear(); }
    }
    updateClear();

    return {
      wrap,
      input,
      setItems,
      get value() { return valEl.value; },
      get item() { return selected; },
      setValue,
      setError,
      focus: () => input.focus(),
      clear: () => { setValue(null); input.value = ""; updateClear(); },
    };
  }

  /* ============================================================
     DATA TABLE — sortable, paginated, actions
     columns: [{key,label,sort?,sortVal?,render?,class?,align?,nowrap?}]
     rows: objects; actions: [{act,icon,title,danger?,show?}]
     ============================================================ */
  function dataTable(opts) {

      if (sortKey) {
        const col = o.columns.find(c => c.key === sortKey);
        const val = c => {
          const raw = c.sortVal ? c.sortVal(c) : c[sortKey];

      pagerEl.innerHTML = html;
      pagerEl.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
        const p = b.dataset.p;
        if (p === "prev") page = Math.max(1, page - 1);

    sizeSel.addEventListener("change", () => {

  function clearErrors(form) {

    form.querySelectorAll(".hint-err").forEach(h => h.remove());

  function formData(form) {
    const out = {};
    form.querySelectorAll("[name]").forEach(inp => {
      if (inp.type === "checkbox") out[inp.name] = inp.checked ? "YES" : "NO";
      else if (inp.type === "number") out[inp.name] = inp.value === "" ? "" : Number(inp.value);

  function progressBar(pctVal, tone) {

  /* ---------- KPI / stat card ---------- */
  function statCard(opts) {

      </div>`).join("")}</div>`;
  }

  root.CMP = { searchSelect, dataTable, field, textInput, textAreaInput, fieldError, clearErrors, formData, setFormData, progressBar, statCard, summaryStrip };

/* ===== js/charts.js ===== */
/* ============================================================
   NEXORA CMS — charts (Chart.js via CDN, CSS fallback offline)
   ============================================================ */
(function (root) {
  "use strict";

  const PALETTE = ["#f59e0b", "#0ea5e9", "#059669", "#e11d48", "#8b5cf6", "#f97316", "#14b8a6", "#6366f1", "#84cc16", "#ec4899"];
  const F = root.Fmt;
  let chartSeq = 0;
  const liveCharts = [];

  function destroyCharts() {
    while (liveCharts.length) {
      const c = liveCharts.pop();
      try { c.destroy(); } catch (e) { /* ignore */ }
    }
  }

  function hasChartJs() { return typeof window !== "undefined" && typeof window.Chart === "function"; }

  function moneyShort(v) {
    const n = F.num(v);
    const a = Math.abs(n);
    if (a >= 1e9) return `${F.qty(n / 1e9, 1)}B`;
    if (a >= 1e6) return `${F.qty(n / 1e6, 1)}M`;
    if (a >= 1e3) return `${F.qty(n / 1e3, 0)}K`;
    return F.qty(n, 0);
  }

  const TOOLTIP = {
    callbacks: {
      label: ctx => {
        const ds = ctx.dataset.label || "";
        let v = ctx.parsed.y != null ? ctx.parsed.y : ctx.parsed.x;
        if (ctx.chart.config.type === "doughnut" || ctx.chart.config.type === "pie") v = ctx.parsed;
        return `${ds}: ${F.money(v)}`;
      },
    },
  };

  function buildChart(spec, hostEl) {
    const card = document.createElement("div");
    card.className = "chart-card";
    const head = document.createElement("div");
    head.className = "chart-head";
    head.innerHTML = `<div class="chart-title">${F.esc(spec.title || "Chart")}</div>`;
    card.appendChild(head);
    hostEl.appendChild(card);

    const body = document.createElement("div");
    body.className = "chart-body";
    card.appendChild(body);

    if (!hasChartJs() || !spec.labels || !spec.labels.length) {
      body.classList.add("chart-fallback");
      const rows = spec.labels.map((lab, i) => {
        const val = spec.series.reduce((a, s) => a + F.num(s.data[i]), 0);
        const max = Math.max(1, ...spec.labels.map((_, j) => spec.series.reduce((a, s) => a + F.num(s.data[j]), 0)));
        return `<div class="fb-row">
          <div class="fb-label">${F.esc(lab)}</div>
          <div class="fb-bar-wrap"><div class="fb-bar" style="width:${(val / max) * 100}%"></div></div>
          <div class="fb-val">${F.money(val)}</div>
        </div>`;
      }).join("");
      body.innerHTML = rows || '<div class="chart-nodata">No data in the selected range</div>';
      if (!hasChartJs()) {
        const note = document.createElement("div");
        note.className = "chart-note";
        note.textContent = "Charts unavailable offline — connect to the internet for full charts.";
        body.appendChild(note);
      }
      return card;
    }

    const canvas = document.createElement("canvas");
    canvas.style.height = spec.type === "hbar" ? `${Math.max(220, spec.labels.length * 34)}px` : "280px";
    body.appendChild(canvas);
    const ctx = canvas.getContext ? canvas.getContext("2d") : null;
    if (!ctx) {
      // no canvas support (very old browser / headless env) — render CSS fallback bars
      body.removeChild(canvas);
      body.classList.add("chart-fallback");
      const max = Math.max(1, ...spec.labels.map((_, j) => spec.series.reduce((a, s) => a + F.num(s.data[j]), 0)));
      body.innerHTML = spec.labels.map((lab, i) => {
        const val = spec.series.reduce((a, s) => a + F.num(s.data[i]), 0);
        return `<div class="fb-row">
          <div class="fb-label">${F.esc(lab)}</div>
          <div class="fb-bar-wrap"><div class="fb-bar" style="width:${(val / max) * 100}%"></div></div>
          <div class="fb-val">${F.money(val)}</div>
        </div>`;
      }).join("") || '<div class="chart-nodata">No data in the selected range</div>';
      return card;
    }

    const baseOpts = {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: spec.series.length > 1, labels: { color: "#64748b", usePointStyle: true, boxWidth: 8, font: { family: "Inter, sans-serif", size: 11 } } },
        tooltip: TOOLTIP,
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: "#94a3b8", font: { size: 10 } } },
        y: { grid: { color: "#eef2f7" }, ticks: { color: "#94a3b8", font: { size: 10 }, callback: v => moneyShort(v) } },
      },
    };

    const chartId = `nxchart-${++chartSeq}`;
    canvas.id = chartId;
    const cfg = { type: "bar", data: { labels: spec.labels, datasets: [] }, options: baseOpts };

    if (spec.type === "doughnut") {
      cfg.type = "doughnut";
      cfg.options = {
        responsive: true, maintainAspectRatio: false, cutout: "62%",
        plugins: { legend: { position: "right", labels: { color: "#475569", usePointStyle: true, boxWidth: 8, font: { size: 11 } } }, tooltip: TOOLTIP },
      };
      cfg.data.datasets = spec.series.map((s, i) => ({
        label: s.label, data: s.data,
        backgroundColor: PALETTE.map((c, j) => PALETTE[j % PALETTE.length]),
        borderWidth: 2, borderColor: "#ffffff",
      }));
    } else if (spec.type === "line") {
      cfg.type = "line";
      cfg.data.datasets = spec.series.map((s, i) => ({
        label: s.label, data: s.data,
        borderColor: s.color || PALETTE[i], backgroundColor: s.color || PALETTE[i],
        tension: 0.35, fill: false, pointRadius: 3, pointBackgroundColor: "#fff", borderWidth: 2.5,
      }));
    } else if (spec.type === "hbar") {
      cfg.type = "bar";
      cfg.options = {
        indexAxis: "y",
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false }, tooltip: TOOLTIP },
        scales: {
          x: { grid: { color: "#eef2f7" }, ticks: { color: "#94a3b8", font: { size: 10 }, callback: v => moneyShort(v) } },
          y: { grid: { display: false }, ticks: { color: "#475569", font: { size: 10 } } },
        },
      };
      cfg.data.datasets = spec.series.map((s, i) => ({
        label: s.label, data: s.data,
        backgroundColor: (s.color || PALETTE[i]) + "cc", borderRadius: 4, maxBarThickness: 16,
      }));
    } else {
      cfg.data.datasets = spec.series.map((s, i) => ({
        label: s.label, data: s.data,
        backgroundColor: (s.color || PALETTE[i]) + "d9", borderRadius: 5, maxBarThickness: 34,
      }));
    }

    // eslint-disable-next-line no-new
    const chart = new window.Chart(canvas.getContext("2d"), cfg);
    liveCharts.push(chart);
    return card;
  }

  function renderCharts(specs, hostEl) {
    destroyCharts();
    hostEl.innerHTML = "";
    (specs || []).forEach(s => buildChart(s, hostEl));
  }

  root.Charts = { buildChart, renderCharts, hasChartJs, destroyCharts };
})(typeof window !== "undefined" ? window : globalThis);

/* ============================================================

    (store.expenses || []).forEach(e => {
      const c = cons.get(e.budgetId) || { qty: 0, amount: 0 };
      c.qty += num(e.qty);
      c.amount += num(e.amount);

      return Object.assign({}, b, {

        consumedAmount: c.amount,
        remainingQty: budgetedQty - c.qty,
        remainingAmount: budgetedAmt - c.amount,
        pctUsed,

        projectName: nameOf(store.masters.Projects, e.projectId),
        shopName: nameOf(store.masters.Shops, e.shopId),
        supplierName: nameOf(store.masters.Suppliers, e.supplierId),
        headName: nameOf(store.masters.ExpenseHeads, e.headId),
        materialName: nameOf(store.masters.Materials, e.materialId),
        unitName: nameOf(store.masters.Units, e.unitId),

      if (f.headId && b.headId !== f.headId) return false;
