    Shops: { icon: "grid", label: "Shops", hint: "Site stores & yards where materials are issued from." },
    ExpenseHeads: { icon: "list", label: "Expense Heads", hint: "Cost categories used on budget lines and expenses." },
    Materials: { icon: "box", label: "Materials", hint: "Materials, labour & plant items that can be budgeted." },
    Units: { icon: "chart", label: "Units", hint: "Units of measure (bag, m³, tonne, man-day…)." },
    Suppliers: { icon: "truck", label: "Suppliers", hint: "Vendors you purchase from and issue LPOs to." },
    Customers: { icon: "briefcase", label: "Customers", hint: "Clients you contract with and invoice." },
  };

  const state = { sheet: "Projects", filters: { q: "", status: "" } };

  function render(container, params) {
    if (params && params.sheet && SHEETS.includes(params.sheet)) state.sheet = params.sheet;
    const store = root.API.store;
    const meta = META[state.sheet];

    container.innerHTML = `
      ${UI.pageToolbar(`Masters — ${meta.label}`, meta.hint, [
        UI.BTN.home, UI.BTN.back, UI.BTN.refresh, UI.BTN.print, UI.BTN.export,
        root.App.can("masters") ? UI.BTN.add("Add " + meta.label.slice(0, -1)) : "",
      ], { crumbs: ["Masters", meta.label] })}

      <div class="master-tabs" id="master-tabs">
        ${SHEETS.map(s => `<button class="mtab ${s === state.sheet ? "on" : ""}" data-sheet="${s}">${UI.icon(META[s].icon, 15)} ${META[s].label}</button>`).join("")}
      </div>

      <div class="filterbar" id="masters-filters">
        <div class="fb-item fb-grow"><label>Search</label><div class="searchbox">${UI.icon("search", 14)}<input type="text" class="input" id="master-q" placeholder="Search ${meta.label.toLowerCase()}…" value="${F.esc(state.filters.q)}"/></div></div>
        <div class="fb-item"><label>Status</label>
          <select class="input" id="master-status">
            <option value="">All statuses</option>
            <option value="Active" ${state.filters.status === "Active" ? "selected" : ""}>Active</option>
            <option value="Inactive" ${state.filters.status === "Inactive" ? "selected" : ""}>Inactive</option>
          </select>
        </div>
        <div class="fb-item fb-actions"><button class="btn btn-ghost" data-act="clear">${UI.icon("close", 14)} Clear</button></div>
      </div>

      <div class="panel">
        <div class="panel-body" id="masters-table-host"></div>
      </div>`;

    // tabs
    container.querySelectorAll(".mtab").forEach(b => b.addEventListener("click", () => {
      state.sheet = b.dataset.sheet;
      state.filters = { q: "", status: "" };
      location.hash = "#/masters/" + state.sheet.toLowerCase();
      render(container);
    }));

    container.querySelector("#master-q").addEventListener("input", F.debounce(e => {
      state.filters.q = e.target.value;
      render(container);
    }, 250));
    container.querySelector("#master-status").addEventListener("change", e => {
      state.filters.status = e.target.value;
      render(container);
    });

    UI.attachActions(container, async (act, btn) => {
      if (act === "add") openForm(container, null);
      else if (act === "edit") openForm(container, F.byId(store.masters[state.sheet], btn.dataset.id));
      else if (act === "delete") await doDelete(container, btn.dataset.id);
      else if (act === "clear") { state.filters = { q: "", status: "" }; render(container); }
      else if (act === "refresh") { await root.API.refreshEntity(state.sheet, true); render(container); }
      else if (act === "print") printMasters();
      else if (act === "export") exportMasters();
      else if (act === "home") location.hash = "#/dashboard";
      else if (act === "back") history.back();
    });

    buildTable(container);
  }

  function filteredRows() {
    const store = root.API.store;
    let rows = store.masters[state.sheet] || [];
    const q = state.filters.q;
    if (q) {
      rows = rows.filter(r => F.matchSearch(q, Object.values(r).join(" ")));
    }
    if (state.filters.status) rows = rows.filter(r => r.status === state.filters.status);
    return rows;
  }

  function buildTable(container) {
    const store = root.API.store;
    const host = container.querySelector("#masters-table-host");
    host.innerHTML = "";
    const cols = columnsFor(state.sheet);
    const table = CMP.dataTable({
      columns: cols,
      rows: filteredRows(),
      search: false,
      onAction: (act, row) => {
        if (act === "edit") openForm(container, row);
        else if (act === "delete") doDelete(container, row.id);
      },
      actions: [
        { act: "edit", icon: "edit", title: "Edit", show: () => root.App.can("edit") },
        { act: "delete", icon: "trash", title: "Delete", danger: true, show: () => root.App.can("delete") },
      ],
    });
    host.appendChild(table.wrap);
  }

  function columnsFor(sheet) {
    const pill = r => UI.pill(r);
    const money = v => `<span class="num">${F.money(v)}</span>`;
    const common = [
      { key: "name", label: "Name" },
      { key: "status", label: "Status", render: r => pill(r.status) },
      { key: "remarks", label: "Remarks" },
    ];
    const bySheet = {
      Projects: [
        { key: "code", label: "Code" }, { key: "name", label: "Project Name" },
        { key: "client", label: "Client" }, { key: "location", label: "Location" },
        { key: "startDate", label: "Start", render: r => F.fmtDate(r.startDate), nowrap: true },
        { key: "endDate", label: "End", render: r => F.fmtDate(r.endDate), nowrap: true },
        { key: "manager", label: "Manager" }, { key: "status", label: "Status", render: r => pill(r.status) },
        { key: "remarks", label: "Remarks" },
      ],
      Shops: [
        { key: "name", label: "Shop Name" }, { key: "location", label: "Location" },
        { key: "supervisor", label: "Supervisor" }, { key: "status", label: "Status", render: r => pill(r.status) },
        { key: "remarks", label: "Remarks" },
      ],
      ExpenseHeads: [
        { key: "name", label: "Expense Head" }, { key: "category", label: "Category" },
        { key: "status", label: "Status", render: r => pill(r.status) }, { key: "remarks", label: "Remarks" },
      ],
      Materials: [
        { key: "name", label: "Material / Item" }, { key: "category", label: "Category" },
        { key: "unit", label: "Unit", render: r => F.nameOf(root.API.store.masters.Units, r.unit) },
        { key: "standardRate", label: "Standard Rate", align: "right", render: r => money(r.standardRate) },
        { key: "status", label: "Status", render: r => pill(r.status) }, { key: "remarks", label: "Remarks" },
      ],
      Units: [
        { key: "name", label: "Unit Name" }, { key: "abbrev", label: "Abbrev." },
        { key: "status", label: "Status", render: r => pill(r.status) }, { key: "remarks", label: "Remarks" },
      ],
      Suppliers: [
        { key: "name", label: "Supplier" }, { key: "contactPerson", label: "Contact" }, { key: "phone", label: "Phone", nowrap: true },
        { key: "email", label: "Email" }, { key: "tin", label: "TIN", nowrap: true },
        { key: "status", label: "Status", render: r => pill(r.status) },
      ],
      Customers: [
        { key: "name", label: "Customer" }, { key: "contactPerson", label: "Contact" }, { key: "phone", label: "Phone", nowrap: true },
        { key: "email", label: "Email" }, { key: "tin", label: "TIN", nowrap: true },
        { key: "status", label: "Status", render: r => pill(r.status) },
      ],
    };
    void common;
    return bySheet[sheet];
  }

  /* ---------------- add / edit form ---------------- */
  function openForm(container, row) {
    const store = root.API.store;
    const sheet = state.sheet;
    const meta = META[sheet];
    const isEdit = !!row;
    const d = row || { status: "Active" };

    let body = "";
    if (sheet === "Projects") {
      body = `
        <div class="form-grid">
          ${CMP.field("Project Code", CMP.textInput("code", d.code, { required: true, placeholder: "e.g. NX-2026-007" }), { required: true })}
          ${CMP.field("Status", `<select class="input" name="status"><option>Planning</option><option>Active</option><option>On Hold</option><option>Completed</option></select>`, { required: true })}
          ${CMP.field("Project Name", CMP.textInput("name", d.name, { required: true, placeholder: "e.g. Area 49 Clinic Extension" }), { required: true, span: 2 })}
          ${CMP.field("Client", CMP.textInput("client", d.client, { placeholder: "e.g. Ministry of Health" }))}
          ${CMP.field("Location", CMP.textInput("location", d.location, { placeholder: "Area, City" }))}
          ${CMP.field("Start Date", CMP.textInput("startDate", d.startDate, { type: "date" }))}
          ${CMP.field("End Date", CMP.textInput("endDate", d.endDate, { type: "date" }))}
          ${CMP.field("Project Manager", `<div data-sel="manager"></div>`)}
          ${CMP.field("Remarks", CMP.textAreaInput("remarks", d.remarks), { span: 2 })}
        </div>`;
    } else if (sheet === "Shops") {
      body = `
        <div class="form-grid">
          ${CMP.field("Shop Name", CMP.textInput("name", d.name, { required: true, placeholder: "e.g. Area 25 Site Store" }), { required: true, span: 2 })}
          ${CMP.field("Location", CMP.textInput("location", d.location, { placeholder: "Area, City" }))}
          ${CMP.field("Supervisor", CMP.textInput("supervisor", d.supervisor, { placeholder: "Staff name" }))}
          ${CMP.field("Status", `<select class="input" name="status"><option>Active</option><option>Inactive</option></select>`, { required: true })}
          ${CMP.field("Remarks", CMP.textAreaInput("remarks", d.remarks), { span: 2 })}
        </div>`;
    } else if (sheet === "ExpenseHeads") {
      body = `
        <div class="form-grid">
          ${CMP.field("Expense Head Name", CMP.textInput("name", d.name, { required: true, placeholder: "e.g. Concrete Works" }), { required: true, span: 2 })}
          ${CMP.field("Category", `<select class="input" name="category"><option>Direct</option><option>Labour</option><option>Equipment</option><option>Subcontract</option><option>Overhead</option><option>Other</option></select>`)}
          ${CMP.field("Status", `<select class="input" name="status"><option>Active</option><option>Inactive</option></select>`, { required: true })}
          ${CMP.field("Remarks", CMP.textAreaInput("remarks", d.remarks), { span: 2 })}
        </div>`;
    } else if (sheet === "Materials") {
      body = `
        <div class="form-grid">
          ${CMP.field("Material / Item Name", CMP.textInput("name", d.name, { required: true, placeholder: "e.g. Portland Cement 42.5R" }), { required: true, span: 2 })}
          ${CMP.field("Category", CMP.textInput("category", d.category, { placeholder: "e.g. Construction Materials" }))}
          ${CMP.field("Unit", `<div data-sel="unit"></div>`, { required: true })}
          ${CMP.field("Standard Rate (MK)", CMP.textInput("standardRate", d.standardRate, { type: "number", step: "0.01", placeholder: "0.00" }))}
          ${CMP.field("Status", `<select class="input" name="status"><option>Active</option><option>Inactive</option></select>`, { required: true })}
          ${CMP.field("Remarks", CMP.textAreaInput("remarks", d.remarks), { span: 2 })}
        </div>`;
    } else if (sheet === "Units") {
      body = `
        <div class="form-grid">
          ${CMP.field("Unit Name", CMP.textInput("name", d.name, { required: true, placeholder: "e.g. Cubic Metre" }), { required: true })}
          ${CMP.field("Abbreviation", CMP.textInput("abbrev", d.abbrev, { placeholder: "e.g. m³" }))}
          ${CMP.field("Status", `<select class="input" name="status"><option>Active</option><option>Inactive</option></select>`, { required: true })}
          ${CMP.field("Remarks", CMP.textAreaInput("remarks", d.remarks), { span: 2 })}
        </div>`;
    } else if (sheet === "Suppliers" || sheet === "Customers") {
      body = `
        <div class="form-grid">
          ${CMP.field("Name", CMP.textInput("name", d.name, { required: true, placeholder: "Company / individual name" }), { required: true, span: 2 })}
          ${CMP.field("Contact Person", CMP.textInput("contactPerson", d.contactPerson))}
          ${CMP.field("Phone", CMP.textInput("phone", d.phone, { placeholder: "+265 …" }))}
          ${CMP.field("Email", CMP.textInput("email", d.email, { type: "email" }))}
          ${CMP.field("TIN", CMP.textInput("tin", d.tin, { placeholder: "Taxpayer ID No." }))}
          ${CMP.field("Address", CMP.textInput("address", d.address))}
          ${CMP.field("Status", `<select class="input" name="status"><option>Active</option><option>Inactive</option></select>`, { required: true })}
          ${CMP.field("Remarks", CMP.textAreaInput("remarks", d.remarks), { span: 2 })}
        </div>`;
    }

    UI.openModal(body, {
      title: `${isEdit ? "Edit" : "Add"} ${meta.label.slice(0, -1)}`,
      subtitle: "Duplicate names/codes are blocked automatically.",
      footer: `${UI.BTN.cancel} ${UI.BTN.save}`,
    });

    const form = UI.modalEl().querySelector(".form-grid");
    CMP.setFormData(form, d);

    // custom search-as-you-go selects
    if (sheet === "Materials") {
      const unitSel = CMP.searchSelect({
        items: (store.masters.Units || []).map(u => ({ id: u.id, label: u.name, sub: u.abbrev })),
        value: d.unit || "", placeholder: "Type unit to search…", required: true,
        emptyText: "No unit found — add it under Masters → Units first.",
      });
      form.querySelector('[data-sel="unit"]').appendChild(unitSel.wrap);
      form._unitSel = unitSel;
    }
    if (sheet === "Projects") {
      const mgrSel = CMP.searchSelect({
        items: (store.users || []).map(u => ({ id: u.name, label: u.name, sub: u.role })),
        value: d.manager || "", placeholder: "Type to search…", allowClear: true,
      });
      form.querySelector('[data-sel="manager"]').appendChild(mgrSel.wrap);
      form._mgrSel = mgrSel;
    }

    UI.attachActions(UI.modalEl(), async act => {
      if (act === "cancel") UI.closeModal();
      else if (act === "save") {
        const data = CMP.formData(form);
        if (form._unitSel) data.unit = form._unitSel.value;
        if (form._mgrSel) data.manager = form._mgrSel.value;
        data.name = String(data.name || "").trim();
        data.code = String(data.code || "").trim();
        data.abbrev = String(data.abbrev || "").trim();
        if (sheet === "Projects" && !data.code) { CMP.fieldError("code", "Project code is required"); return; }
        if (!data.name) { CMP.fieldError("name", "Name is required"); return; }
        if (sheet === "Materials" && !data.unit) { return; }

        const saveBtn = UI.modalEl().querySelector('[data-act="save"]');
        saveBtn.disabled = true;
        const res = await root.API.call("saveMaster", { sheet, id: isEdit ? row.id : null, data });
        saveBtn.disabled = false;
        if (res && res.ok) {
          UI.toast(`${meta.label.slice(0, -1)} saved.`, "success");
          store.masters[sheet] = res.data.rows || [];
          store.version = res.data.version != null ? res.data.version : store.version;
          UI.closeModal();
          render(container);
        } else if (res && res.error) {
          if (res.error.field) CMP.fieldError(res.error.field, res.error.message);
          else UI.toast(res.error.message, "error", { ms: 7000 });
        }
      }
    });
  }

  async function doDelete(container, id) {
    const store = root.API.store;
    const sheet = state.sheet;
    const row = F.byId(store.masters[sheet], id);
    if (!row) return;
    const ok = await UI.confirmDialog({
      danger: true,
      title: `Delete ${META[sheet].label.slice(0, -1)}?`,
      message: `“${row.name}” will be removed. Records already used in budget / contracts / expenses cannot be deleted — set them to “Inactive” instead.`,
      okLabel: "Delete",
    });
    if (!ok) return;
    const res = await root.API.call("deleteMaster", { sheet, id });
    if (res && res.ok) {
      UI.toast("Record deleted.", "success");
      store.masters[sheet] = res.data.rows || [];
      render(container);
    } else if (res && res.error) {
      UI.toast(res.error.message, "error", { ms: 7000 });
    }
  }

  function printMasters() {
    const store = root.API.store;
    const meta = META[state.sheet];
    const cols = columnsFor(state.sheet);
    const rows = filteredRows();
    root.App.printReport(`Masters — ${meta.label}`, root.App.printTable(cols, rows));
  }

  function exportMasters() {
    const meta = META[state.sheet];
    const cols = columnsFor(state.sheet).map(c => ({ key: c.key, label: c.label, value: r => r[c.key] }));
    F.exportCSV(`nexora-masters-${state.sheet.toLowerCase()}-${F.todayISO()}.csv`, cols, filteredRows());
  }

  root.Pages = root.Pages || {};
  root.Pages.masters = { render, title: "Masters" };
})(typeof window !== "undefined" ? window : globalThis);

</script>
  <script>
/* ===== js/pages/budget.js ===== */
/* ============================================================
   NEXORA CMS — Budget page (Step 2 of the data-entry workflow)
   Strict rules: duplicate combos blocked; lines with expenses
   are locked (project/head/material/shop/unit) and cannot be
   reduced below what is already consumed.
   ============================================================ */
(function (root) {
  "use strict";

  const F = root.Fmt, UI = root.UI, CMP = root.CMP, RC = root.RC;

  const state = { filters: { projectId: "", headId: "", materialId: "", shopId: "", budgetStatus: "" } };

  function render(container, params) {
    const store = root.API.store;
    const f = state.filters;
    const budget = RC.enrichBudget(store);
    const fb = RC.filterBudget(budget, f);

    container.innerHTML = `
      ${UI.pageToolbar("Budget Entries", "Step 2 — approve the budget line by line. Expenses can ONLY be posted against these lines.", [
        UI.BTN.home, UI.BTN.back, UI.BTN.refresh, UI.BTN.filters, UI.BTN.print, UI.BTN.export,
        root.App.can("create") ? UI.BTN.add("Add Budget Line") : "",
      ], { crumbs: ["Budget"] })}

      <div class="filterbar" id="budget-filters">
        <div class="fb-item" data-f="projectId"></div>
        <div class="fb-item" data-f="headId"></div>
        <div class="fb-item" data-f="materialId"></div>
        <div class="fb-item" data-f="shopId"></div>
        <div class="fb-item"><label>Status</label>
          <select class="input" id="b-status"><option value="">All</option><option value="Approved">Approved</option><option value="Hold">Hold</option></select>
        </div>
        <div class="fb-item fb-actions"><button class="btn btn-ghost" data-act="clear">${UI.icon("close", 14)} Clear</button></div>
      </div>

      <div id="budget-summary"></div>
      <div class="panel"><div class="panel-body" id="budget-table-host"></div></div>`;

    const projItems = [{ id: "", label: "All projects" }].concat((store.masters.Projects || []).map(p => ({ id: p.id, label: p.name, sub: p.code })));
    const headItems = [{ id: "", label: "All heads" }].concat((store.masters.ExpenseHeads || []).map(h => ({ id: h.id, label: h.name, sub: h.category })));
    const matItems = [{ id: "", label: "All materials" }].concat((store.masters.Materials || []).map(m => ({ id: m.id, label: m.name, sub: m.category })));
    const shopItems = [{ id: "", label: "All shops" }].concat((store.masters.Shops || []).map(s => ({ id: s.id, label: s.name, sub: s.location })));

    const mk = (el, items, val, key, label) => {
      const host = container.querySelector(`[data-f="${el}"]`);
      if (!host) return;
      const l = document.createElement("label");
      l.textContent = label;
      host.appendChild(l);
      const sel = CMP.searchSelect({ items, value: val || "", placeholder: "Type to search…", onSelect: it => { state.filters[key] = it ? it.id : ""; render(container); } });
      host.appendChild(sel.wrap);
    };
    mk("projectId", projItems, f.projectId, "projectId", "Project");
    mk("headId", headItems, f.headId, "headId", "Expense Head");
    mk("materialId", matItems, f.materialId, "materialId", "Material");
    mk("shopId", shopItems, f.shopId, "shopId", "Shop");
    const stSel = container.querySelector("#b-status");
    stSel.value = f.budgetStatus || "";
    stSel.addEventListener("change", e => { state.filters.budgetStatus = e.target.value; render(container); });

    UI.attachActions(container, async (act, btn) => {
      if (act === "add") openForm(container, null);
      else if (act === "edit") openForm(container, F.byId(store.budget, btn.dataset.id));
      else if (act === "delete") await doDelete(container, btn.dataset.id);
      else if (act === "clear") { state.filters = { projectId: "", headId: "", materialId: "", shopId: "", budgetStatus: "" }; render(container); }
      else if (act === "filters") { const el = container.querySelector("#budget-filters"); el.style.display = el.style.display === "none" ? "grid" : "none"; }
      else if (act === "refresh") { await root.API.refreshEntity("budget", true); render(container); }
      else if (act === "print") printBudget();
      else if (act === "export") exportBudget();
      else if (act === "home") location.hash = "#/dashboard";
      else if (act === "back") history.back();
    });

    drawSummary(fb);
    buildTable(container, fb);
    if (params && params.new) setTimeout(() => openForm(container, null), 120);
  }

  function drawSummary(fb) {
    const host = document.getElementById("budget-summary");
    if (!host) return;
    const approved = fb.filter(b => b.status === "Approved");
    const consumed = F.sum(fb, b => b.consumedAmount);
    const remaining = F.sum(approved, b => b.amount) - consumed;
    host.innerHTML = CMP.summaryStrip([
      { label: "Budget lines", value: String(fb.length) },
      { label: "Approved budget", value: F.money(F.sum(approved, b => F.num(b.amount))) },
      { label: "Consumed (expenses)", value: F.money(consumed), tone: "warn" },
      { label: "Remaining", value: F.money(remaining), tone: remaining < 0 ? "bad" : "ok" },
      { label: "On Hold", value: String(fb.filter(b => b.status === "Hold").length) },
      { label: "Over-budget lines", value: String(fb.filter(b => b.pctUsed > 100.005).length), tone: "bad" },
    ]);
  }

  function buildTable(container, fb) {
    const store = root.API.store;
    const host = container.querySelector("#budget-table-host");
    host.innerHTML = "";
    const table = CMP.dataTable({
      defaultSort: "pctUsed",
      columns: [
        { key: "projectId", label: "Project", render: r => F.nameOf(store.masters.Projects, r.projectId) },
        { key: "headId", label: "Expense Head", render: r => F.nameOf(store.masters.ExpenseHeads, r.headId) },
        { key: "materialId", label: "Material / Item", render: r => `<b>${F.esc(F.nameOf(store.masters.Materials, r.materialId))}</b>` },
        { key: "shopId", label: "Shop", render: r => F.nameOf(store.masters.Shops, r.shopId) },
        { key: "qty", label: "Qty", align: "right", render: r => `<span class="num">${F.qty(r.qty)}</span>` },
        { key: "unitId", label: "Unit", render: r => F.nameOf(store.masters.Units, r.unitId, ""), nowrap: true },
        { key: "rate", label: "Rate", align: "right", render: r => `<span class="num">${F.money(r.rate)}</span>` },
        { key: "amount", label: "Budget", align: "right", render: r => `<span class="num">${F.money(r.amount)}</span>` },
        { key: "consumedAmount", label: "Consumed", align: "right", render: r => `<span class="num ${r.consumedAmount > r.amount ? "neg" : ""}">${F.money(r.consumedAmount)}</span>` },
        { key: "remainingAmount", label: "Remaining", align: "right", render: r => `<span class="num ${r.remainingAmount < 0 ? "neg" : ""}">${F.money(r.remainingAmount)}</span>` },
        { key: "pctUsed", label: "Used", align: "right", render: r => `<div class="pbar-cell">${CMP.progressBar(r.pctUsed, r.tone === "Over" ? "bad" : r.tone === "Near" ? "warn" : "ok")}<span class="pbar-pct">${F.pct(r.pctUsed)}</span></div>` },
        { key: "status", label: "Status", render: r => UI.pill(r.status) },
      ],
      rows: fb,
      onAction: (act, row) => {
        if (act === "edit") openForm(container, row);
        else if (act === "delete") doDelete(container, row.id);
      },
      actions: [
        { act: "edit", icon: "edit", title: "Edit", show: () => root.App.can("edit") },
        { act: "delete", icon: "trash", title: "Delete", danger: true, show: () => root.App.can("delete") },
      ],
    });
    host.appendChild(table.wrap);
  }

  /* ---------------- add / edit form ---------------- */
  function openForm(container, row) {
    const store = root.API.store;
    const isEdit = !!row;
    const d = row || { status: "Approved", qty: 1, rate: 0 };
    const consumed = row ? F.byId(RC.enrichBudget(store), row.id) : null;
    const locked = !!(consumed && (consumed.consumedQty > 0 || consumed.consumedAmount > 0));

    UI.openModal(`
      ${locked ? `<div class="notice warn">${UI.icon("lock", 15)} This line already has <b>${F.money(consumed.consumedAmount)}</b> consumed — project, head, material, shop &amp; unit are locked, and quantities cannot go below what is already used.</div>` : ""}
      <div class="form-grid">
        ${CMP.field("Project", `<div data-sel="projectId"></div>`, { required: true, span: 2 })}
        ${CMP.field("Expense Head", `<div data-sel="headId"></div>`, { required: true })}
        ${CMP.field("Shop", `<div data-sel="shopId"></div>`, { required: true })}
        ${CMP.field("Material / Item", `<div data-sel="materialId"></div>`, { required: true })}
        <div class="field"><label>Unit (from material)</label><input class="input" id="b-unit-ro" readonly value="—"/><div class="field-hint">Set on the material master</div></div>
        ${CMP.field("Quantity", CMP.textInput("qty", d.qty, { type: "number", step: "any", min: "0", required: true }), { required: true })}
        ${CMP.field("Rate (MK)", CMP.textInput("rate", d.rate, { type: "number", step: "any", min: "0", required: true }), { required: true })}
        ${CMP.field("Amount (MK)", CMP.textInput("amount", d.amount, { readonly: true }))}
        ${CMP.field("Status", `<select class="input" name="status"><option value="Approved">Approved</option><option value="Hold">Hold</option></select>`)}
        ${CMP.field("Notes", CMP.textAreaInput("notes", d.notes), { span: 2 })}
      </div>
      <div class="notice info">${UI.icon("info", 15)} Expenses can only be entered against <b>Approved</b> lines, and duplicate (project + head + material + shop) combinations are blocked.</div>
    `, {
      title: `${isEdit ? "Edit" : "Add"} Budget Line`,
      subtitle: "Step 2 of the workflow — plan the budget before spending.",
      footer: `${UI.BTN.cancel} ${UI.BTN.save}`,
    });

    const modal = UI.modalEl();
    const form = modal.querySelector(".form-grid");
    const matSel = CMP.searchSelect({
      items: (store.masters.Materials || []).map(m => ({ id: m.id, label: m.name, sub: `${m.category} · ${F.nameOf(store.masters.Units, m.unit)}` })),
      value: d.materialId || "", placeholder: "Type material to search…", required: true,
      emptyText: "No material found — add it under Masters → Materials first.",
      disabled: locked,
      onSelect: it => {
        if (!it) return;
        const m = F.byId(store.masters.Materials, it.id);
        const unitEl = form.querySelector("#b-unit-ro");
        if (unitEl) unitEl.value = m ? F.nameOf(store.masters.Units, m.unit) : "—";
        if (m && m.standardRate && !form.querySelector('[name="rate"]').value) form.querySelector('[name="rate"]').value = m.standardRate;
        recalc();
      },
    });
    form.querySelector('[data-sel="materialId"]').appendChild(matSel.wrap);

    const projSel = CMP.searchSelect({
      items: (store.masters.Projects || []).map(p => ({ id: p.id, label: p.name, sub: `${p.code} · ${p.client}` })),
      value: d.projectId || "", placeholder: "Type project to search…", required: true, disabled: locked,
    });
    form.querySelector('[data-sel="projectId"]').appendChild(projSel.wrap);
    const headSel = CMP.searchSelect({
      items: (store.masters.ExpenseHeads || []).map(h => ({ id: h.id, label: h.name, sub: h.category })),
      value: d.headId || "", placeholder: "Type head to search…", required: true, disabled: locked,
    });
    form.querySelector('[data-sel="headId"]').appendChild(headSel.wrap);
    const shopSel = CMP.searchSelect({
      items: (store.masters.Shops || []).map(s => ({ id: s.id, label: s.name, sub: s.location })),
      value: d.shopId || "", placeholder: "Type shop to search…", required: true, disabled: locked,
    });
    form.querySelector('[data-sel="shopId"]').appendChild(shopSel.wrap);

    if (d.materialId) {
      const m = F.byId(store.masters.Materials, d.materialId);
      form.querySelector("#b-unit-ro").value = m ? F.nameOf(store.masters.Units, m.unit) : "—";
    }

    function recalc() {
      const qty = F.num(form.querySelector('[name="qty"]').value);
      const rate = F.num(form.querySelector('[name="rate"]').value);
      form.querySelector('[name="amount"]').value = (qty * rate).toFixed(2);
    }
    form.querySelector('[name="qty"]').addEventListener("input", recalc);
    form.querySelector('[name="rate"]').addEventListener("input", recalc);
    recalc();

    UI.attachActions(modal, async act => {
      if (act === "cancel") UI.closeModal();
      else if (act === "save") {
        const data = CMP.formData(form);
        data.projectId = projSel.value;
        data.headId = headSel.value;
        data.materialId = matSel.value;
        data.shopId = shopSel.value;
        if (!data.projectId) { projSel.setError("Required"); return; }
        if (!data.headId) { headSel.setError("Required"); return; }
        if (!data.materialId) { matSel.setError("Required"); return; }
        if (!data.shopId) { shopSel.setError("Required"); return; }
        if (F.num(data.qty) <= 0) { CMP.fieldError("qty", "Quantity must be greater than zero"); return; }
        if (F.num(data.rate) <= 0) { CMP.fieldError("rate", "Rate must be greater than zero"); return; }

        const saveBtn = modal.querySelector('[data-act="save"]');
        saveBtn.disabled = true;
        const res = await root.API.call("saveBudgetLine", { id: isEdit ? row.id : null, data });
        saveBtn.disabled = false;
        if (res && res.ok) {
          UI.toast("Budget line saved.", "success");
          store.budget = res.data.rows || [];
          store.version = res.data.version != null ? res.data.version : store.version;
          UI.closeModal();
          render(container);
        } else if (res && res.error) {
          if (res.error.field) CMP.fieldError(res.error.field, res.error.message);
          else UI.toast(res.error.message, "error", { ms: 8000 });
        }
      }
    });
  }

  async function doDelete(container, id) {
    const store = root.API.store;
    const row = F.byId(store.budget, id);
    if (!row) return;
    const consumed = F.byId(RC.enrichBudget(store), id);
    if (consumed && (consumed.consumedQty > 0 || consumed.consumedAmount > 0)) {
      UI.toast("This budget line already has expenses against it and cannot be deleted. Set its status to “Hold” instead.", "error", { ms: 7000 });
      return;
    }
    const ok = await UI.confirmDialog({ danger: true, title: "Delete budget line?", message: `The line for “${F.nameOf(store.masters.Materials, row.materialId)}” will be removed.`, okLabel: "Delete" });
    if (!ok) return;
    const res = await root.API.call("deleteBudgetLine", { id });
    if (res && res.ok) {
      UI.toast("Budget line deleted.", "success");
      store.budget = res.data.rows || [];
      render(container);
    } else if (res && res.error) UI.toast(res.error.message, "error", { ms: 7000 });
  }

  function rowsForPrint() {
    const store = root.API.store;
    return RC.filterBudget(RC.enrichBudget(store), state.filters);
  }

  function printBudget() {
    const store = root.API.store;
    const rows = rowsForPrint();
    const cols = [
      { key: "projectId", label: "Project", render: r => F.nameOf(store.masters.Projects, r.projectId) },
      { key: "headId", label: "Head", render: r => F.nameOf(store.masters.ExpenseHeads, r.headId) },
      { key: "materialId", label: "Material", render: r => F.nameOf(store.masters.Materials, r.materialId) },
      { key: "shopId", label: "Shop", render: r => F.nameOf(store.masters.Shops, r.shopId) },
      { key: "qty", label: "Qty", render: r => F.qty(r.qty) },
      { key: "rate", label: "Rate", render: r => F.money(r.rate) },
      { key: "amount", label: "Budget", render: r => F.money(r.amount) },
      { key: "consumedAmount", label: "Consumed", render: r => F.money(r.consumedAmount) },
      { key: "remainingAmount", label: "Remaining", render: r => F.money(r.remainingAmount) },
      { key: "pctUsed", label: "Used %", render: r => F.pct(r.pctUsed) },
    ];
    root.App.printReport("Budget Register", root.App.printTable(cols, rows));
  }

  function exportBudget() {
    const store = root.API.store;
    const rows = rowsForPrint();
    F.exportCSV(`nexora-budget-${F.todayISO()}.csv`, [
      { key: "project", label: "Project", value: r => F.nameOf(store.masters.Projects, r.projectId) },
      { key: "head", label: "Expense Head", value: r => F.nameOf(store.masters.ExpenseHeads, r.headId) },
      { key: "material", label: "Material", value: r => F.nameOf(store.masters.Materials, r.materialId) },
      { key: "shop", label: "Shop", value: r => F.nameOf(store.masters.Shops, r.shopId) },
      { key: "qty", label: "Qty", value: r => r.qty },
      { key: "unit", label: "Unit", value: r => F.nameOf(store.masters.Units, r.unitId) },
      { key: "rate", label: "Rate", value: r => r.rate },
      { key: "amount", label: "Budget Amount", value: r => r.amount },
      { key: "consumed", label: "Consumed", value: r => r.consumedAmount },
      { key: "remaining", label: "Remaining", value: r => r.remainingAmount },
      { key: "status", label: "Status", value: r => r.status },
    ], rows);
  }

  root.Pages = root.Pages || {};
  root.Pages.budget = { render, title: "Budget" };
})(typeof window !== "undefined" ? window : globalThis);

</script>
  <script>
/* ===== js/pages/contract.js ===== */
/* ============================================================
   NEXORA CMS — Contracts / LPO / Sales Invoices (Step 3)
   ============================================================ */
(function (root) {
  "use strict";

  const F = root.Fmt, UI = root.UI, CMP = root.CMP, RC = root.RC;

  const TYPE_STATUS = {
    "Contract Value": ["Awarded", "In Progress", "Completed", "Terminated"],
    "Sales Invoice": ["Issued", "Cancelled"],
    "LPO": ["Open", "Partially Received", "Received", "Cancelled"],
  };
  const TYPES = Object.keys(TYPE_STATUS);

  const state = { filters: { projectId: "", type: "", customerId: "", supplierId: "", status: "", from: "", to: "" } };

  function render(container, params) {
    const store = root.API.store;
    const f = state.filters;
    if (params && params.type && TYPES.includes(params.type)) state.filters.type = params.type;
    const fc = RC.filterContracts(RC.enrichContracts(store), f);
    const cs = RC.contractSums(RC.enrichContracts(store), f);

    container.innerHTML = `
      ${UI.pageToolbar("Contracts, LPOs & Invoices", "Step 3 — record contract values, sales invoices and local purchase orders (LPOs).", [
        UI.BTN.home, UI.BTN.back, UI.BTN.refresh, UI.BTN.filters, UI.BTN.print, UI.BTN.export,
        root.App.can("create") ? UI.BTN.add("Add Document") : "",
      ], { crumbs: ["Contracts & LPO"] })}

      <div class="type-tabs">
        <button class="mtab ${!f.type ? "on" : ""}" data-type="">All Types</button>
        ${TYPES.map(t => `<button class="mtab ${f.type === t ? "on" : ""}" data-type="${t}">${t}</button>`).join("")}
      </div>

      <div class="filterbar" id="ct-filters">
        <div class="fb-item" data-f="projectId"></div>
        <div class="fb-item" data-f="customerId"></div>
        <div class="fb-item" data-f="supplierId"></div>
        <div class="fb-item"><label>Status</label><select class="input" id="ct-status"><option value="">All</option>${[...new Set(Object.values(TYPE_STATUS).flat())].map(s => `<option>${s}</option>`).join("")}</select></div>
        <div class="fb-item"><label>From</label><input type="date" class="input" id="ct-from" value="${F.esc(f.from)}"/></div>
        <div class="fb-item"><label>To</label><input type="date" class="input" id="ct-to" value="${F.esc(f.to)}"/></div>
        <div class="fb-item fb-actions"><button class="btn btn-ghost" data-act="clear">${UI.icon("close", 14)} Clear</button></div>
      </div>

      ${CMP.summaryStrip([
        { label: "Contract Values", value: F.money(cs.contractValue), tone: "ok" },
        { label: "Sales Invoices", value: F.money(cs.salesInvoices), tone: "ok" },
        { label: "Collected", value: F.money(cs.collected), tone: "ok" },
        { label: "Outstanding", value: F.money(cs.receivable), tone: cs.receivable > 0 ? "bad" : "ok" },
        { label: "LPO Value", value: F.money(cs.lpo), tone: "warn" },
        { label: "Open LPO", value: F.money(cs.lpoOutstanding), tone: "warn" },
      ])}

      <div class="panel"><div class="panel-body" id="ct-table-host"></div></div>`;

    // tabs
    container.querySelectorAll(".type-tabs .mtab").forEach(b => b.addEventListener("click", () => {
      state.filters.type = b.dataset.type;
      render(container);
    }));

    const mk = (el, items, val, key, label) => {
      const host = container.querySelector(`[data-f="${el}"]`);
      if (!host) return;
      const l = document.createElement("label"); l.textContent = label; host.appendChild(l);
      const sel = CMP.searchSelect({ items, value: val || "", placeholder: "Type to search…", onSelect: it => { state.filters[key] = it ? it.id : ""; render(container); } });
      host.appendChild(sel.wrap);
    };
    mk("projectId", [{ id: "", label: "All projects" }].concat((store.masters.Projects || []).map(p => ({ id: p.id, label: p.name, sub: p.code }))), f.projectId, "projectId", "Project");
    mk("customerId", [{ id: "", label: "All customers" }].concat((store.masters.Customers || []).map(c => ({ id: c.id, label: c.name }))), f.customerId, "customerId", "Customer");
    mk("supplierId", [{ id: "", label: "All suppliers" }].concat((store.masters.Suppliers || []).map(s => ({ id: s.id, label: s.name }))), f.supplierId, "supplierId", "Supplier");

    const stSel = container.querySelector("#ct-status");
    stSel.value = f.status || "";
    stSel.addEventListener("change", e => { state.filters.status = e.target.value; render(container); });
    container.querySelector("#ct-from").addEventListener("change", e => { state.filters.from = e.target.value; render(container); });
    container.querySelector("#ct-to").addEventListener("change", e => { state.filters.to = e.target.value; render(container); });

    UI.attachActions(container, async (act, btn) => {
      if (act === "add") openForm(container, null, state.filters.type || "Sales Invoice");
      else if (act === "edit") openForm(container, F.byId(store.contracts, btn.dataset.id), null);
      else if (act === "delete") await doDelete(container, btn.dataset.id);
      else if (act === "clear") { state.filters = { projectId: "", type: "", customerId: "", supplierId: "", status: "", from: "", to: "" }; render(container); }
      else if (act === "filters") { const el = container.querySelector("#ct-filters"); el.style.display = el.style.display === "none" ? "grid" : "none"; }
      else if (act === "refresh") { await root.API.refreshEntity("contracts", true); render(container); }
      else if (act === "print") printContracts();
      else if (act === "export") exportContracts();
      else if (act === "home") location.hash = "#/dashboard";
      else if (act === "back") history.back();
    });

    buildTable(container, fc);
    if (params && params.new) setTimeout(() => openForm(container, null, params.type || "Sales Invoice"), 120);
  }

  function buildTable(container, rows) {
    const store = root.API.store;
    const host = container.querySelector("#ct-table-host");
    host.innerHTML = "";
    const table = CMP.dataTable({
      defaultSort: "date",
      columns: [
        { key: "refNo", label: "Ref No.", render: r => `<b>${F.esc(r.refNo)}</b>`, nowrap: true },
        { key: "type", label: "Type", render: r => UI.pill(r.type, r.type === "LPO" ? "warn" : r.type === "Contract Value" ? "info" : "ok") },
        { key: "date", label: "Date", render: r => F.fmtDate(r.date), nowrap: true },
        { key: "projectId", label: "Project", render: r => F.nameOf(store.masters.Projects, r.projectId) },
        { key: "party", label: "Customer / Supplier", render: r => r.type === "LPO" ? F.nameOf(store.masters.Suppliers, r.supplierId) : F.nameOf(store.masters.Customers, r.customerId) },
        { key: "description", label: "Description" },
        { key: "amount", label: "Amount", align: "right", render: r => `<span class="num">${F.money(r.amount)}</span>` },
        { key: "vatAmount", label: "VAT", align: "right", render: r => `<span class="num">${F.money(r.vatAmount)}</span>` },
        { key: "total", label: "Total", align: "right", render: r => `<span class="num bold">${F.money(r.total)}</span>` },
        { key: "status", label: "Status", render: r => UI.pill(r.status) },
        { key: "paymentStatus", label: "Payment", render: r => UI.pill(r.paymentStatus) },
      ],
      rows,
      onAction: (act, row) => {
        if (act === "edit") openForm(container, row, null);
        else if (act === "delete") doDelete(container, row.id);
      },
      actions: [
        { act: "edit", icon: "edit", title: "Edit", show: () => root.App.can("edit") },
        { act: "delete", icon: "trash", title: "Delete", danger: true, show: () => root.App.can("delete") },
      ],
    });
    host.appendChild(table.wrap);
  }

  function openForm(container, row, presetType) {
    const store = root.API.store;
    const isEdit = !!row;
    const d = row || {
      type: presetType || "Sales Invoice", date: F.todayISO(), vatRate: F.num(store.settings.defaultVAT),
      amount: 0, status: (TYPE_STATUS[presetType || "Sales Invoice"] || ["Issued"])[0], paymentStatus: "Unpaid",
    };

    UI.openModal(`
      <div class="form-grid">
        ${CMP.field("Document Type", `<select class="input" name="type">${TYPES.map(t => `<option>${t}</option>`).join("")}</select>`, { required: true })}
        ${CMP.field("Ref No.", CMP.textInput("refNo", d.refNo, { required: true, placeholder: "e.g. INV-2026-007" }), { required: true })}
        ${CMP.field("Date", CMP.textInput("date", d.date, { type: "date", required: true }), { required: true })}
        ${CMP.field("Project", `<div data-sel="projectId"></div>`, { required: true, span: 2 })}
        ${CMP.field("Customer", `<div data-sel="customerId"></div>`, { required: true })}
        ${CMP.field("Supplier", `<div data-sel="supplierId"></div>`)}
        ${CMP.field("Description", CMP.textInput("description", d.description, { placeholder: "e.g. IPC No. 3 — roof works" }), { span: 2 })}
        ${CMP.field("Amount excl. VAT (MK)", CMP.textInput("amount", d.amount, { type: "number", step: "0.01", min: "0", required: true }), { required: true })}
        ${CMP.field("VAT %", CMP.textInput("vatRate", d.vatRate, { type: "number", step: "0.01", min: "0" }))}
        ${CMP.field("VAT Amount (MK)", CMP.textInput("vatAmount", d.vatAmount, { readonly: true }))}
        ${CMP.field("Total (MK)", CMP.textInput("total", d.total, { readonly: true }))}
        ${CMP.field("Status", `<select class="input" name="status"></select>`)}
        ${CMP.field("Payment Status", `<select class="input" name="paymentStatus"><option>Unpaid</option><option>Partially Paid</option><option>Paid</option></select>`)}
        ${CMP.field("Remarks", CMP.textAreaInput("remarks", d.remarks), { span: 2 })}
      </div>
      <div class="notice info">${UI.icon("info", 15)} Reference numbers must be unique per document type — duplicates are blocked automatically.</div>
    `, {
      title: `${isEdit ? "Edit" : "Add"} Contract / LPO / Invoice`,
      subtitle: "Step 3 of the workflow.",
      footer: `${UI.BTN.cancel} ${UI.BTN.save}`,
    });

    const modal = UI.modalEl();
    const form = modal.querySelector(".form-grid");
    CMP.setFormData(form, d);

    const projSel = CMP.searchSelect({
      items: (store.masters.Projects || []).map(p => ({ id: p.id, label: p.name, sub: `${p.code} · ${p.client}` })),
      value: d.projectId || "", placeholder: "Type project to search…", required: true,
    });
    form.querySelector('[data-sel="projectId"]').appendChild(projSel.wrap);
    const custSel = CMP.searchSelect({
      items: (store.masters.Customers || []).map(c => ({ id: c.id, label: c.name, sub: c.tin || "" })),
      value: d.customerId || "", placeholder: "Type customer to search…", required: true,
      emptyText: "No customer found — add it under Masters → Customers first.",
    });
    form.querySelector('[data-sel="customerId"]').appendChild(custSel.wrap);
    const suppSel = CMP.searchSelect({
      items: (store.masters.Suppliers || []).map(s => ({ id: s.id, label: s.name, sub: s.tin || "" })),
      value: d.supplierId || "", placeholder: "Type supplier to search…",
      emptyText: "No supplier found — add it under Masters → Suppliers first.",
    });
    form.querySelector('[data-sel="supplierId"]').appendChild(suppSel.wrap);

    const typeSel = form.querySelector('[name="type"]');
    const statusSel = form.querySelector('[name="status"]');
    function fillStatus(type, keep) {
      const list = TYPE_STATUS[type] || ["Issued"];
      statusSel.innerHTML = list.map(s => `<option>${s}</option>`).join("");
      if (keep && list.includes(keep)) statusSel.value = keep;
    }
    fillStatus(typeSel.value, d.status);

    function recalc() {
      const amount = F.num(form.querySelector('[name="amount"]').value);
      const vatRate = F.num(form.querySelector('[name="vatRate"]').value);
      form.querySelector('[name="vatAmount"]').value = (amount * vatRate / 100).toFixed(2);
      form.querySelector('[name="total"]').value = (amount + amount * vatRate / 100).toFixed(2);
    }
    form.querySelector('[name="amount"]').addEventListener("input", recalc);
    form.querySelector('[name="vatRate"]').addEventListener("input", recalc);
    recalc();

    typeSel.addEventListener("change", () => {
      const isLPO = typeSel.value === "LPO";
      form.querySelector('[name="vatRate"]').value = isLPO ? "0" : String(F.num(store.settings.defaultVAT));
      recalc();
      fillStatus(typeSel.value, null);
    });

    UI.attachActions(modal, async act => {
      if (act === "cancel") UI.closeModal();
      else if (act === "save") {
        const data = CMP.formData(form);
        data.projectId = projSel.value;
        data.customerId = custSel.value;
        data.supplierId = suppSel.value;
        data.refNo = String(data.refNo || "").trim();
        const isLPO = data.type === "LPO";
        if (!data.projectId) { projSel.setError("Required"); return; }
        if (!isLPO && !data.customerId) { custSel.setError("Required for contracts / invoices"); return; }
        if (isLPO && !data.supplierId) { suppSel.setError("Required for LPOs"); return; }
        if (!data.refNo) { CMP.fieldError("refNo", "Reference number is required"); return; }
        if (F.num(data.amount) <= 0) { CMP.fieldError("amount", "Amount must be greater than zero"); return; }

        const saveBtn = modal.querySelector('[data-act="save"]');
        saveBtn.disabled = true;
        const res = await root.API.call("saveContract", { id: isEdit ? row.id : null, data });
        saveBtn.disabled = false;
        if (res && res.ok) {
          UI.toast("Document saved.", "success");
          store.contracts = res.data.rows || [];
          store.version = res.data.version != null ? res.data.version : store.version;
          UI.closeModal();
          render(container);
        } else if (res && res.error) {
          if (res.error.field) CMP.fieldError(res.error.field, res.error.message);
          else UI.toast(res.error.message, "error", { ms: 8000 });
        }
      }
    });
  }

  async function doDelete(container, id) {
    const store = root.API.store;
    const row = F.byId(store.contracts, id);
    if (!row) return;
    const ok = await UI.confirmDialog({ danger: true, title: `Delete ${row.type}?`, message: `“${row.refNo}” (${F.money(row.total)}) will be removed permanently.`, okLabel: "Delete" });
    if (!ok) return;
    const res = await root.API.call("deleteContract", { id });
    if (res && res.ok) {
      UI.toast("Document deleted.", "success");
      store.contracts = res.data.rows || [];
      render(container);
    } else if (res && res.error) UI.toast(res.error.message, "error", { ms: 7000 });
  }

  function rowsForPrint() {
    return RC.filterContracts(RC.enrichContracts(root.API.store), state.filters);
  }

  function printContracts() {
    const store = root.API.store;
    const rows = rowsForPrint();
    const cols = [
      { key: "refNo", label: "Ref No.", render: r => r.refNo },
      { key: "type", label: "Type", render: r => r.type },
      { key: "date", label: "Date", render: r => F.fmtDate(r.date) },
      { key: "projectId", label: "Project", render: r => F.nameOf(store.masters.Projects, r.projectId) },
      { key: "party", label: "Customer / Supplier", render: r => r.type === "LPO" ? F.nameOf(store.masters.Suppliers, r.supplierId) : F.nameOf(store.masters.Customers, r.customerId) },
      { key: "description", label: "Description", render: r => r.description },
      { key: "total", label: "Total (MK)", render: r => F.money(r.total) },
      { key: "status", label: "Status", render: r => r.status },
      { key: "paymentStatus", label: "Payment", render: r => r.paymentStatus },
    ];
    root.App.printReport("Contracts / LPO / Invoices Register", root.App.printTable(cols, rows));
  }

  function exportContracts() {
    const store = root.API.store;
    const rows = rowsForPrint();
    F.exportCSV(`nexora-contracts-${F.todayISO()}.csv`, [
      { key: "refNo", label: "Ref No.", value: r => r.refNo },
      { key: "type", label: "Type", value: r => r.type },
      { key: "date", label: "Date", value: r => r.date },
      { key: "project", label: "Project", value: r => F.nameOf(store.masters.Projects, r.projectId) },
      { key: "customer", label: "Customer", value: r => F.nameOf(store.masters.Customers, r.customerId) },
      { key: "supplier", label: "Supplier", value: r => F.nameOf(store.masters.Suppliers, r.supplierId) },
      { key: "description", label: "Description", value: r => r.description },
      { key: "amount", label: "Amount", value: r => r.amount },
      { key: "vat", label: "VAT", value: r => r.vatAmount },
      { key: "total", label: "Total", value: r => r.total },
      { key: "status", label: "Status", value: r => r.status },
      { key: "payment", label: "Payment Status", value: r => r.paymentStatus },
    ], rows);
  }

  root.Pages = root.Pages || {};
  root.Pages.contract = { render, title: "Contracts & LPO" };
})(typeof window !== "undefined" ? window : globalThis);

</script>
  <script>
/* ===== js/pages/expenses.js ===== */
/* ============================================================
   NEXORA CMS — Actual Expenses (Step 4)
   STRICT CONTROL:
   • an expense can ONLY be posted against an APPROVED budget
     line of the selected project (no free-form entries)
   • over-budget entries are BLOCKED unless the Admin override
     is enabled in Settings AND a reason is given
   • duplicate invoice numbers per supplier+project are blocked
   ============================================================ */
(function (root) {
  "use strict";

  const F = root.Fmt, UI = root.UI, CMP = root.CMP, RC = root.RC;

  const state = { filters: { projectId: "", headId: "", shopId: "", supplierId: "", paymentStatus: "", from: "", to: "", onlyOver: "" } };

  function render(container, params) {
    const store = root.API.store;
    const f = state.filters;
    const enriched = RC.enrichAll(store);
    const fe = RC.filterExpenses(enriched.expenses, f);

    container.innerHTML = `
      ${UI.pageToolbar("Actual Expenses", "Step 4 — post actual spend. Entries are ONLY allowed against approved budget lines — no new or additional expenses can be created here.", [
        UI.BTN.home, UI.BTN.back, UI.BTN.refresh, UI.BTN.filters, UI.BTN.print, UI.BTN.export,
        root.App.can("create") ? UI.BTN.add("Add Expense") : "",
      ], { crumbs: ["Expenses"] })}

      ${store.settings.allowOverBudget === "YES"
        ? `<div class="notice warn">${UI.icon("warn", 15)} Budget override is <b>ENABLED</b> — Admins may exceed a budget line with a documented reason. Disable it in Settings for strictest control.</div>`
        : `<div class="notice info">${UI.icon("lock", 15)} Strict mode — expenses above the remaining budget on a line are <b>blocked</b>.</div>`}

      <div class="filterbar" id="ex-filters">
        <div class="fb-item" data-f="projectId"></div>
        <div class="fb-item" data-f="headId"></div>
        <div class="fb-item" data-f="shopId"></div>
        <div class="fb-item" data-f="supplierId"></div>
        <div class="fb-item"><label>Payment</label><select class="input" id="ex-pay"><option value="">All</option><option>Unpaid</option><option>Partially Paid</option><option>Paid</option></select></div>
        <div class="fb-item"><label>From</label><input type="date" class="input" id="ex-from" value="${F.esc(f.from)}"/></div>
        <div class="fb-item"><label>To</label><input type="date" class="input" id="ex-to" value="${F.esc(f.to)}"/></div>
        <div class="fb-item"><label>&nbsp;</label><label class="checkline"><input type="checkbox" id="ex-over" ${f.onlyOver ? "checked" : ""}/> Over-budget only</label></div>
        <div class="fb-item fb-actions"><button class="btn btn-ghost" data-act="clear">${UI.icon("close", 14)} Clear</button></div>
      </div>

      ${CMP.summaryStrip([
        { label: "Entries", value: String(fe.length) },
        { label: "Total Expenses", value: F.money(F.sum(fe, e => e.amount)), tone: "warn" },
        { label: "This Month", value: F.money(F.sum(fe.filter(e => F.monthKey(e.date) === F.monthKey(F.todayISO())), e => e.amount)) },
        { label: "Pending Payment", value: F.money(F.sum(fe.filter(e => e.paymentStatus !== "Paid"), e => e.amount)), tone: "bad" },
        { label: "Over-budget (override)", value: String(fe.filter(e => e.override === "YES").length), tone: "warn" },
      ])}

      <div class="panel"><div class="panel-body" id="ex-table-host"></div></div>`;

    const mk = (el, items, val, key, label) => {
      const host = container.querySelector(`[data-f="${el}"]`);
      if (!host) return;
      const l = document.createElement("label"); l.textContent = label; host.appendChild(l);
      const sel = CMP.searchSelect({ items, value: val || "", placeholder: "Type to search…", onSelect: it => { state.filters[key] = it ? it.id : ""; render(container); } });
      host.appendChild(sel.wrap);
    };
    mk("projectId", [{ id: "", label: "All projects" }].concat((store.masters.Projects || []).map(p => ({ id: p.id, label: p.name }))), f.projectId, "projectId", "Project");
    mk("headId", [{ id: "", label: "All heads" }].concat((store.masters.ExpenseHeads || []).map(h => ({ id: h.id, label: h.name }))), f.headId, "headId", "Head");
    mk("shopId", [{ id: "", label: "All shops" }].concat((store.masters.Shops || []).map(s => ({ id: s.id, label: s.name }))), f.shopId, "shopId", "Shop");
    mk("supplierId", [{ id: "", label: "All suppliers" }].concat((store.masters.Suppliers || []).map(s => ({ id: s.id, label: s.name }))), f.supplierId, "supplierId", "Supplier");

    const paySel = container.querySelector("#ex-pay");
    paySel.value = f.paymentStatus || "";
    paySel.addEventListener("change", e => { state.filters.paymentStatus = e.target.value; render(container); });
    container.querySelector("#ex-from").addEventListener("change", e => { state.filters.from = e.target.value; render(container); });
    container.querySelector("#ex-to").addEventListener("change", e => { state.filters.to = e.target.value; render(container); });
    container.querySelector("#ex-over").addEventListener("change", e => { state.filters.onlyOver = e.target.checked ? "1" : ""; render(container); });

    UI.attachActions(container, async (act, btn) => {
      if (act === "add") openForm(container, null);
      else if (act === "edit") openForm(container, F.byId(store.expenses, btn.dataset.id));
      else if (act === "delete") await doDelete(container, btn.dataset.id);
      else if (act === "clear") { state.filters = { projectId: "", headId: "", shopId: "", supplierId: "", paymentStatus: "", from: "", to: "", onlyOver: "" }; render(container); }
      else if (act === "filters") { const el = container.querySelector("#ex-filters"); el.style.display = el.style.display === "none" ? "grid" : "none"; }
      else if (act === "refresh") { await root.API.refreshEntity("expenses", true); render(container); }
      else if (act === "print") printExpenses();
      else if (act === "export") exportExpenses();
      else if (act === "home") location.hash = "#/dashboard";
      else if (act === "back") history.back();
    });

    buildTable(container, fe);
    if (params && params.new) setTimeout(() => openForm(container, null), 120);
  }

  function buildTable(container, rows) {
    const host = container.querySelector("#ex-table-host");
    host.innerHTML = "";
    const table = CMP.dataTable({
      defaultSort: "date",
      columns: [
        { key: "date", label: "Date", render: r => F.fmtDate(r.date), nowrap: true },
        { key: "invoiceNo", label: "Invoice / Ref", render: r => `<b>${F.esc(r.invoiceNo || "—")}</b>`, nowrap: true },
        { key: "projectId", label: "Project", render: r => F.nameOf(root.API.store.masters.Projects, r.projectId) },
        { key: "headId", label: "Head", render: r => F.nameOf(root.API.store.masters.ExpenseHeads, r.headId) },
        { key: "materialId", label: "Material / Item", render: r => F.nameOf(root.API.store.masters.Materials, r.materialId) },
        { key: "shopId", label: "Shop", render: r => F.nameOf(root.API.store.masters.Shops, r.shopId) },
        { key: "supplierId", label: "Supplier", render: r => F.nameOf(root.API.store.masters.Suppliers, r.supplierId) },
        { key: "qty", label: "Qty", align: "right", render: r => `<span class="num">${F.qty(r.qty)}</span>` },
        { key: "rate", label: "Rate", align: "right", render: r => `<span class="num">${F.money(r.rate)}</span>` },
        { key: "amount", label: "Amount", align: "right", render: r => `<span class="num bold">${F.money(r.amount)}</span>` },
        { key: "paymentStatus", label: "Payment", render: r => UI.pill(r.paymentStatus) },
        { key: "override", label: "Budget", render: r => r.override === "YES" ? `<span class="pill bad" title="${F.esc(r.overrideReason || "")}">Over</span>` : `<span class="pill ok">Within</span>` },
      ],
      rows,
      onAction: (act, row) => {
        if (act === "edit") openForm(container, row);
        else if (act === "delete") doDelete(container, row.id);
      },
      actions: [
        { act: "edit", icon: "edit", title: "Edit", show: () => root.App.can("edit") },
        { act: "delete", icon: "trash", title: "Delete (reverses budget consumption)", danger: true, show: () => root.App.can("delete") },
      ],
    });
    host.appendChild(table.wrap);
  }

  /* ---------------- add / edit form (STRICT) ---------------- */
  function openForm(container, row) {
    const store = root.API.store;
    const isEdit = !!row;
    const d = row || { date: F.todayISO(), paymentStatus: "Unpaid", qty: 1, rate: 0 };
    const allowOverride = String(store.settings.allowOverBudget) === "YES" && store.user && store.user.role === "Admin";

    UI.openModal(`
      <div class="form-grid">
        ${CMP.field("Project", `<div data-sel="projectId"></div>`, { required: true, span: 2 })}
        ${CMP.field("Budget Line (approved only)", `<div data-sel="budgetId"></div>`, { required: true, span: 2, hint: "Expenses can ONLY be posted against existing approved budget lines." })}
        <div class="budget-info" id="budget-info"></div>
        ${CMP.field("Date", CMP.textInput("date", d.date, { type: "date", required: true }), { required: true })}
        ${CMP.field("Invoice / Ref No.", CMP.textInput("invoiceNo", d.invoiceNo, { placeholder: "Supplier invoice / delivery note" }))}
        ${CMP.field("Supplier", `<div data-sel="supplierId"></div>`, { required: true })}
        ${CMP.field("Payment Status", `<select class="input" name="paymentStatus"><option>Unpaid</option><option>Partially Paid</option><option>Paid</option></select>`)}
        ${CMP.field("Quantity", CMP.textInput("qty", d.qty, { type: "number", step: "any", min: "0", required: true }), { required: true })}
        ${CMP.field("Rate (MK)", CMP.textInput("rate", d.rate, { type: "number", step: "any", min: "0", required: true }), { required: true })}
        ${CMP.field("Amount (MK)", CMP.textInput("amount", d.amount, { readonly: true }))}
        ${allowOverride ? `
          <div class="override-box span2" id="override-box">
            <label class="checkline"><input type="checkbox" name="override" ${d.override === "YES" ? "checked" : ""}/> <b>Override budget limit</b> (Admin only)</label>
            <div class="field" id="override-reason-field"><label>Override reason <span class="req-star">*</span></label><textarea class="input" name="overrideReason" rows="2" placeholder="Why is this over-budget expense necessary?">${F.esc(d.overrideReason || "")}</textarea></div>
          </div>` : `
          <div class="notice info span2">${UI.icon("lock", 14)} Over-budget entries are <b>blocked</b>${allowOverride === false && String(store.settings.allowOverBudget) === "YES" ? " for your role" : ""}. Adjust the quantity or ask an Admin to enable override in Settings.</div>`}
        ${CMP.field("Remarks", CMP.textAreaInput("remarks", d.remarks), { span: 2 })}
      </div>
    `, {
      title: `${isEdit ? "Edit" : "Add"} Expense Entry`,
      subtitle: "Step 4 — the selected budget line defines the head, material, unit and shop.",
      footer: `${UI.BTN.cancel} ${UI.BTN.save}`,
    });

    const modal = UI.modalEl();
    const form = modal.querySelector(".form-grid");
    CMP.setFormData(form, d);

    const projSel = CMP.searchSelect({
      items: (store.masters.Projects || []).map(p => ({ id: p.id, label: p.name, sub: `${p.code} · ${p.client}` })),
      value: d.projectId || "", placeholder: "Type project to search…", required: true,
      onSelect: () => refreshBudgetItems(),
    });
    form.querySelector('[data-sel="projectId"]').appendChild(projSel.wrap);

    const suppSel = CMP.searchSelect({
      items: (store.masters.Suppliers || []).map(s => ({ id: s.id, label: s.name, sub: s.phone || "" })),
      value: d.supplierId || "", placeholder: "Type supplier to search…", required: true,
      emptyText: "No supplier found — add it under Masters → Suppliers first.",
    });
    form.querySelector('[data-sel="supplierId"]').appendChild(suppSel.wrap);

    let budgetSel = null;

    function budgetItems() {
      const pid = projSel.value;
      const budget = RC.enrichBudget(store).filter(b => b.projectId === pid && b.status === "Approved");
      return budget.map(b => ({
        id: b.id,
        label: `${F.nameOf(store.masters.Materials, b.materialId)} — ${F.nameOf(store.masters.ExpenseHeads, b.headId)}`,
        sub: `Shop: ${F.nameOf(store.masters.Shops, b.shopId)} · Budgeted ${F.qty(b.qty)} ${F.nameOf(store.masters.Units, b.unitId)} · Remaining ${F.money(b.remainingAmount)}`,
        right: `${F.pct(b.pctUsed)} used`,
        badge: b.tone === "Over" ? "over" : "",
        data: b,
      }));
    }

    function refreshBudgetItems() {
      if (budgetSel) {
        budgetSel.setItems(budgetItems());
        budgetSel.clear();
      }
    }

    budgetSel = CMP.searchSelect({
      items: budgetItems(),
      value: d.budgetId || "", placeholder: "Type to search budget lines…", required: true,
      emptyText: "No approved budget lines for this project — create one under Budget first.",
      onSelect: it => {
        const b = it && it.data;
        const info = form.querySelector("#budget-info");
        if (!b) { info.innerHTML = ""; return; }
        info.innerHTML = `
          <div class="bi-row"><span>Expense Head</span><b>${F.esc(F.nameOf(store.masters.ExpenseHeads, b.headId))}</b></div>
          <div class="bi-row"><span>Material / Item</span><b>${F.esc(F.nameOf(store.masters.Materials, b.materialId))}</b></div>
          <div class="bi-row"><span>Shop</span><b>${F.esc(F.nameOf(store.masters.Shops, b.shopId))}</b></div>
          <div class="bi-row"><span>Unit</span><b>${F.esc(F.nameOf(store.masters.Units, b.unitId))}</b></div>
          <div class="bi-row"><span>Budgeted</span><b>${F.qty(b.qty)} × ${F.money(b.rate)} = ${F.money(b.amount)}</b></div>
          <div class="bi-row"><span>Already consumed</span><b class="${b.consumedAmount > b.amount ? "neg" : ""}">${F.money(b.consumedAmount)} (${F.pct(b.pctUsed)})</b></div>
          <div class="bi-row bi-rem"><span>REMAINING on this line</span><b class="${b.remainingAmount < 0 ? "neg" : ""}">${F.qty(Math.max(0, b.remainingQty))} ${F.nameOf(store.masters.Units, b.unitId)} / ${F.money(Math.max(0, b.remainingAmount))}</b></div>`;
        form.querySelector('[name="rate"]').value = b.rate;
        form.querySelector('[name="qty"]').value = "";
        recalc();
      },
    });
    form.querySelector('[data-sel="budgetId"]').appendChild(budgetSel.wrap);

    if (d.budgetId) {
      const b = F.byId(RC.enrichBudget(store), d.budgetId);
      if (b) {
        budgetSel.setValue(budgetItems().find(x => x.id === b.id));
      }
    }

    function recalc() {
      const qty = F.num(form.querySelector('[name="qty"]').value);
      const rate = F.num(form.querySelector('[name="rate"]').value);
      form.querySelector('[name="amount"]').value = (qty * rate).toFixed(2);
    }
    form.querySelector('[name="qty"]').addEventListener("input", recalc);
    form.querySelector('[name="rate"]').addEventListener("input", recalc);
    recalc();

    UI.attachActions(modal, async act => {
      if (act === "cancel") UI.closeModal();
      else if (act === "save") {
        const data = CMP.formData(form);
        data.projectId = projSel.value;
        data.budgetId = budgetSel.value;
        data.supplierId = suppSel.value;
        if (!data.projectId) { projSel.setError("Required"); return; }
        if (!data.budgetId) { budgetSel.setError("Select an approved budget line — expenses cannot be entered outside the budget."); return; }
        if (!data.supplierId) { suppSel.setError("Required"); return; }
        if (F.num(data.qty) <= 0) { CMP.fieldError("qty", "Quantity must be greater than zero"); return; }
        if (F.num(data.rate) <= 0) { CMP.fieldError("rate", "Rate must be greater than zero"); return; }
        if (allowOverride && data.override === "YES" && !String(data.overrideReason || "").trim()) {
          CMP.fieldError("overrideReason", "A reason is required for over-budget overrides");
          return;
        }

        const saveBtn = modal.querySelector('[data-act="save"]');
        saveBtn.disabled = true;
        const res = await root.API.call("saveExpense", { id: isEdit ? row.id : null, data });
        saveBtn.disabled = false;
        if (res && res.ok) {
          UI.toast("Expense posted — budget consumption updated.", "success");
          store.expenses = res.data.rows || [];
          store.version = res.data.version != null ? res.data.version : store.version;
          UI.closeModal();
          render(container);
        } else if (res && res.error) {
          if (res.error.field) {
            if (res.error.field === "budgetId") budgetSel.setError(res.error.message);
            else CMP.fieldError(res.error.field, res.error.message);
          }
          UI.toast(res.error.message, "error", { ms: 9000, html: true });
        }
      }
    });
  }

  async function doDelete(container, id) {
    const store = root.API.store;
    const row = F.byId(store.expenses, id);
    if (!row) return;
    const ok = await UI.confirmDialog({
      danger: true,
      title: "Delete expense entry?",
      message: `${F.money(row.amount)} on ${F.fmtDate(row.date)} will be removed and the budget consumption on that line will be reversed.`,
      okLabel: "Delete",
    });
    if (!ok) return;
    const res = await root.API.call("deleteExpense", { id });
    if (res && res.ok) {
      UI.toast("Expense deleted — budget reversed.", "success");
      store.expenses = res.data.rows || [];
      render(container);
    } else if (res && res.error) UI.toast(res.error.message, "error", { ms: 7000 });
  }

  function rowsForPrint() {
    return RC.filterExpenses(RC.enrichAll(root.API.store).expenses, state.filters);
  }

  function printExpenses() {
    const store = root.API.store;
    const rows = rowsForPrint();
    const cols = [
      { key: "date", label: "Date", render: r => F.fmtDate(r.date) },
      { key: "invoiceNo", label: "Invoice", render: r => r.invoiceNo },
      { key: "projectId", label: "Project", render: r => F.nameOf(store.masters.Projects, r.projectId) },
      { key: "headId", label: "Head", render: r => F.nameOf(store.masters.ExpenseHeads, r.headId) },
      { key: "materialId", label: "Material", render: r => F.nameOf(store.masters.Materials, r.materialId) },
      { key: "shopId", label: "Shop", render: r => F.nameOf(store.masters.Shops, r.shopId) },
      { key: "supplierId", label: "Supplier", render: r => F.nameOf(store.masters.Suppliers, r.supplierId) },
      { key: "qty", label: "Qty", render: r => F.qty(r.qty) },
      { key: "rate", label: "Rate", render: r => F.money(r.rate) },
      { key: "amount", label: "Amount", render: r => F.money(r.amount) },
      { key: "paymentStatus", label: "Payment", render: r => r.paymentStatus },
    ];
    root.App.printReport("Expense Register", root.App.printTable(cols, rows));
  }

  function exportExpenses() {
    const store = root.API.store;
    const rows = rowsForPrint();
    F.exportCSV(`nexora-expenses-${F.todayISO()}.csv`, [
      { key: "date", label: "Date", value: r => r.date },
      { key: "invoiceNo", label: "Invoice / Ref", value: r => r.invoiceNo },
      { key: "project", label: "Project", value: r => F.nameOf(store.masters.Projects, r.projectId) },
      { key: "head", label: "Expense Head", value: r => F.nameOf(store.masters.ExpenseHeads, r.headId) },

  function reportHTML() {

    const rep = RC.report(store, state.key, state.filters);

  function stripHtml(html) {
    const t = document.createElement("textarea");
    t.innerHTML = String(html || "");

  function exportReport() {
    const store = root.API.store;
    const rep = RC.report(store, state.key, state.filters);

    F.exportCSV(`nexora-${meta.key}-${F.todayISO()}.csv`, cols, tb.rows);

  }
